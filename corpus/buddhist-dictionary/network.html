ematically through the sūtras to standardize Yogācāra's core terminology — a text so foundational that Xuanzang's translation of it helped define the entire shape of Chinese Yogācāra.",{"start":300,"end":400,"basis":"\"the compilation of the work of a number of scholars... during the fourth century CE\""},null],["n4272","yogin",1068,3,31,29,363,0,-214,-147,["concept"],"Yogin. A male practitioner of meditative discipline who has achieved genuine attainment through practice — usable for any accomplished Buddhist adept generally, but applied especially to advanced practitioners of tantra.",null,null],["n4311","yulu",1078,7,35,25,1410,0,10,-428,["concept","work"],"Yulu. (\"Discourse records\" or \"recorded sayings.\") A Chan literary genre compiling a master's sermons, dialogues, and informal utterances, typically assembled by disciples shortly after his death and prized for preserving the vernacular immediacy of his actual speech — as if the master remained, in some sense, still present and accessible. Particularly associated with Mazu Daoyi and his Hongzhou lineage, the genre expanded to include biography, poetry, and correspondence alongside recorded teachings, functioning as Chan's answer to the secular literati's own personal literary collections.",{"start":709,"end":788,"basis":"the genre \"is often associated particularly with the Chan master Mazu Daoyi (709–788)\""},null],["n4333","Zen",1083,7,138,131,3449,0,98,-377,["school"],"Zen. The Japanese branch of the East Asian Chan tradition, first transmitted from China in the late twelfth century by Myōan Eisai. Three surviving lineages call themselves Zen schools: Rinzai (koan-focused, from Eisai), Sōtō (founded by Dōgen on \"just sitting\"), and the smaller, later Ōbaku. In the twentieth century, thinkers like D.T. Suzuki recast \"Zen\" in the West as a culture-transcending \"pure experience\" — a framing the dictionary notes has little to do with how the tradition understands itself in Japan or elsewhere in East Asia.",{"start":1150,"end":1200,"basis":"\"first transmitted to Japan in the late twelfth century by Myōan Eisai\""},{"lat":35.6762,"lng":139.6503,"label":"Japan (general placeholder — Tokyo/Kantō; no specific site named)"}],["n4345","Zhaozhou Congshen",1086,7,26,13,2413,0,-16,-382,["person"],"Zhaozhou Congshen. (778–897.) A Tang-dynasty Chan master who studied for decades under Nanquan Puyuan before settling at eighty into a small monastery in Zhaozhou, teaching through understated verbal exchange rather than the shouting and beating favored by contemporaries — Yuanwu Keqin later said \"Zhaozhou's Chan lies on the lips.\" His most famous exchange, in which he answered \"no\" to whether a dog possesses buddha-nature, became the single most cited case in all of Chan literature and, through Dahui Zonggao's promotion, the archetypal huatou of kanhua Chan meditation — even though his own dharma lineage died out not long after his death.",{"start":778,"end":897,"basis":"\"(778–897)\", given directly"},{"lat":37.75,"lng":114.78,"label":"Zhaozhou, Hebei, China (Guanyinyuan, where he taught for his final forty years)"}],["n4382","zong",1093,5,31,23,1175,0,-76,-97,["concept"],"Zong. A Chinese term spanning \"core teaching\" or \"cardinal doctrine\" on one hand and \"school\" or \"lineage\" on the other — used to translate the Sanskrit siddhānta (a philosophical school's axiomatic tenet). Properly rendered \"school\" only for traditions like Tiantai, Huayan, and Chan that claim an unbroken lineage back to a founding patriarch; purely exegetical traditions built around a single commentarial text, lacking any claimed founder or exclusive lineage, are more accurately called \"scholastic traditions\" instead.",null,null],["n4389","zuochan",1095,7,31,14,2253,0,8,-176,["concept"],"Zuochan. (\"Seated meditation,\" better known in English by its Japanese pronunciation, zazen.) The archetypal Chan meditative posture, modeled on both the Buddha's own seated enlightenment beneath the Bodhi tree and Bodhidharma's nine years of wall-facing meditation. So closely identified with Chan practice that later Chan teachers pushed back against treating it as the only legitimate form — the Platform Sūtra redefines \"seated\" and \"meditation\" entirely inwardly, insisting the practice is really about an unmoving, unattached mind sustained through all four bodily postures, not literal sitting alone.",null,null],["n4392","zushi",1095,7,44,22,3619,0,81,-152,["concept"],"Zushi. (\"Patriarch.\") An eminent teacher in a lineage claimed to trace back to Śākyamuni or earlier buddhas, a concept likely descended from the vinaya's more mundane notion of a \"preceptor\" who confers ordination and thereby forges a durable teacher-disciple bond. East Asian schools from Chan to Tiantai to Huayan built their legitimacy on such retrospectively constructed lineages, none more scrutinized than Chan's canonical list of twenty-eight Indian and six Chinese patriarchs — genealogies whose fluid, contested membership reveals they were compiled after the fact to authorize specific contemporary teachers, not preserved as settled history.",null,null]],"edges":[["n15","n991"],["n15","n3249"],["n15","n3736"],["n15","n646"],["n15","n2580"],["n15","n3623"],["n15","n2216"],["n15","n3844"],["n15","n3803"],["n15","n3240"],["n15","n21"],["n15","n3815"],["n15","n4033"],["n15","n1736"],["n15","n1737"],["n15","n2199"],["n15","n2125"],["n19","n15"],["n19","n3981"],["n19","n3249"],["n19","n20"],["n19","n3924"],["n19","n3291"],["n19","n4197"],["n19","n2580"],["n19","n991"],["n19","n1436"],["n19","n2809"],["n19","n3154"],["n19","n2199"],["n19","n3264"],["n19","n3157"],["n19","n306"],["n19","n3445"],["n19","n382"],["n19","n1034"],["n19","n2044"],["n19","n3001"],["n19","n819"],["n19","n820"],["n19","n680"],["n19","n826"],["n19","n2662"],["n19","n2799"],["n19","n1736"],["n19","n1737"],["n19","n1900"],["n19","n123"],["n19","n1816"],["n19","n320"],["n19","n294"],["n19","n3092"],["n19","n3105"],["n19","n282         ctx.beginPath();
        for (const [a,b] of edges) {
          const na = nodeById.get(a), nb = nodeById.get(b);
          if (isHidden(na) || isHidden(nb)) continue;
          if (isDimmed(na) || isDimmed(nb)) continue;
          ctx.moveTo(na[F.x], na[F.y]); ctx.lineTo(nb[F.x], nb[F.y]);
        }
        ctx.stroke();
      }
    }

    // nodes
    const labelCandidates = [];
    for (const n of nodes) {
      if (isHidden(n)) continue;
      const r = radiusFor(n[F.degree]);
      const dim = anyDim && isDimmed(n);
      ctx.globalAlpha = dim ? 0.10 : (n[F.degree] === 0 ? 0.55 : 1);
      ctx.fillStyle = clusterColor(n[F.cluster]);
      ctx.beginPath();
      ctx.arc(n[F.x], n[F.y], r, 0, Math.PI*2);
      ctx.fill();
      if (!dim && r > 5) labelCandidates.push(n);
    }
    ctx.globalAlpha = 1;

    if (focusNode) {
      const r = radiusFor(focusNode[F.degree]) + 1.5/scale;
      ctx.lineWidth = 1.5/scale;
      ctx.strokeStyle = cssVar('--ink');
      ctx.beginPath();
      ctx.arc(focusNode[F.x], focusNode[F.y], r, 0, Math.PI*2);
      ctx.stroke();
    }

    if (showLabels) {
      labelCandidates.sort((a,b) => b[F.degree]-a[F.degree]);
      ctx.font = (12/scale) + 'px -apple-system, "Segoe UI", sans-serif';
      ctx.textBaseline = 'middle';
      const placed = [];
      const minGap = 14/scale;
      for (const n of labelCandidates) {
        if (placed.length > 260) break;
        let clash = false;
        for (const p of placed) { if (Math.abs(p[0]-n[F.x]) < minGap*3 && Math.abs(p[1]-n[F.y]) < minGap) { clash = true; break; } }
        if (clash) continue;
        placed.push([n[F.x], n[F.y]]);
        const r = radiusFor(n[F.degree]);
        const lx = n[F.x] + r + 3/scale;
        ctx.lineWidth = 3/scale;
        ctx.strokeStyle = cssVar('--canvas-bg');
        ctx.globalAlpha = 0.85;
        ctx.strokeText(n[F.headword], lx, n[F.y]);
        ctx.globalAlpha = 1;
        ctx.fillStyle = cssVar('--ink-2');
        ctx.fillText(n[F.headword], lx, n[F.y]);
      }
    }

    ctx.restore();
  }

  // ---- selection: shared by canvas click, search, and list rows ----
  function applySelection(n) {
    focusNode = n; focusSet = neighbors.get(n[idIdx]);
    soloCluster = null; clearTypeFilter();
    renderLegend(); renderFilters(); updateVisibleCount(); renderList(); renderDetail(n);
    renderTimeline(); renderMap();
  }
  function clearSelection() {
    focusNode = null; focusSet = null;
    hideDetail();
    renderLegend(); renderFilters(); updateVisibleCount(); renderList();
    renderTimeline(); renderMap();
  }
  function focusAndCenter(n) {
    applySelection(n);
    scale = Math.max(scale, 1.6);
    tx = W/2 - n[F.x]*scale; ty = H/2 - n[F.y]*scale;
    draw();
  }

  // ---- pan/zoom ----
  let dragging = false, lastX = 0, lastY = 0, moved = false;
  canvas.addEventListener('mousedown', e => {
    dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
  window.addEventListener('mousemove', e => {
    if (dragging) {
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      if (Math.abs(dx)+Math.abs(dy) > 2) moved = true;
      tx += dx; ty += dy; lastX = e.clientX; lastY = e.clientY;
      draw();
      hideTooltip();
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
    const [wx, wy] = screenToWorld(sx, sy);
    const n = nearestNode(wx, wy, 10/scale);
    if (n !== hoverNode) {
      hoverNode = n;
      // preview the hovered entry's description aside in the sidebar; falls back to
      // the pinned (clicked) entry when the cursor leaves nodes, so a click-isolated
      // network's description stays visible the whole time the filter is active.
      if (n) renderDetail(n);
      else if (focusNode) renderDetail(focusNode);
      else hideDetail();
    }
    if (n) showTooltip(n, e.clientX, e.clientY); else hideTooltip();
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
    const [wx, wy] = screenToWorld(sx, sy);
    const factor = Math.pow(1.0016, -e.deltaY);
    scale = Math.min(10, Math.max(0.08, scale*factor));
    tx = sx - wx*scale; ty = sy - wy*scale;
    draw();
  }, { passive: false });
  canvas.addEventListener('click', e => {
    if (moved) return;
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
    const [wx, wy] = screenToWorld(sx, sy);
    const n = nearestNode(wx, wy, 10/scale);
    if (n) {
      if (focusNode === n) clearSelection();
      else applySelection(n);
    } else {
      clearSelection();
    }
    draw();
  });
  function zoomAtCenter(factor) {
    const [wx, wy] = screenToWorld(W/2, H/2);
    scale = Math.min(10, Math.max(0.08, scale*factor));
    tx = W/2 - wx*scale; ty = H/2 - wy*scale;
    draw();
  }
  document.getElementById('zoom-in').addEventListener('click', () => zoomAtCenter(1.35));
  document.getElementById('zoom-out').addEventListener('click', () => zoomAtCenter(1/1.35));
  document.getElementById('reset-btn').addEventListener('click', () => {
    soloCluster = null; focusNode = null; focusSet = null; clearTypeFilter();
    hideDetail();
    fitView(); renderLegend(); renderFilters(); updateVisibleCount(); renderList(); renderTimeline(); renderMap(); draw();
  });

  // ---- tooltip (lightweight hover preview; full detail lives in the sidebar on click) ----
  const tooltip = document.getElementById('tooltip');
  function showTooltip(n, cx, cy) {
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(cx+14, window.innerWidth-260) + 'px';
    tooltip.style.top = Math.min(cy+14, window.innerHeight-90) + 'px';
    const types = (n[F.type] || []).map(t => TYPE_LABELS[t] || t);
    tooltip.innerHTML = '<div class="hw">'+escapeHtml(n[F.headword])+'</div>'
      + '<div class="meta">cited by '+n[F.inDegree]+' · degree '+n[F.degree]+'</div>'
      + '<div class="cl">'+escapeHtml(clusterName(n[F.cluster]))+'</div>'
      + (types.length ? '<div class="cl" style="opacity:0.75">'+types.join(' · ')+'</div>' : '');
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  // ---- selected-entry detail card ----
  const detailPanel = document.getElementById('detail-panel');
  function renderDetail(n) {
    const types = (n[F.type] || []).map(t => '<span class="type-pill">'+escapeHtml(TYPE_LABELS[t] || t)+'</span>').join('');
    const time = n[F.time], loc = n[F.location], note = n[F.note];
    detailPanel.style.display = 'block';
    detailPanel.style.borderBottomColor = clusterColor(n[F.cluster]);
    detailPanel.innerHTML = ''
      + '<div class="det-head"><div class="det-title">'+escapeHtml(n[F.headword])+'</div>'
      + '<button class="det-close" id="det-close" aria-label="Clear selection" title="Clear selection">✕</button></div>'
      + (types ? '<div class="det-types">'+types+'</div>' : '')
      + (time ? '<div class="det-meta"><b>When</b>'+escapeHtml(fmtTime(time))+'</div>' : '')
      + (loc ? '<div class="det-meta"><b>Where</b>'+escapeHtml(loc.label)+'</div>' : '')
      + (note ? '<div class="det-note">'+escapeHtml(note)+'</div>' : '')
      + '<div class="det-sub">degree '+n[F.degree]+' · cited by '+n[F.inDegree]+'</div>';
    document.getElementById('det-close').addEventListener('click', () => { clearSelection(); draw(); });
  }
  function hideDetail() { detailPanel.style.display = 'none'; detailPanel.innerHTML = ''; }

  // ---- collapsible sections ----
  document.querySelectorAll('.panel-section.collapsible > h2').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });

  // ---- view mode: graph <-> list ----
  function setViewMode(v) {
    viewMode = v;
    document.getElementById('stage').style.display = v === 'graph' ? '' : 'none';
    document.getElementById('list-pane').style.display = v === 'list' ? 'flex' : 'none';
    document.getElementById('timeline-pane').style.display = v === 'timeline' ? 'flex' : 'none';
    document.getElementById('map-pane').style.display = v === 'map' ? 'flex' : 'none';
    document.getElementById('vtab-graph').classList.toggle('active', v === 'graph');
    document.getElementById('vtab-list').classList.toggle('active', v === 'list');
    document.getElementById('vtab-timeline').classList.toggle('active', v === 'timeline');
    document.getElementById('vtab-map').classList.toggle('active', v === 'map');
    if (v === 'graph') applySize(stage.clientWidth, stage.clientHeight);
    else if (v === 'list') renderList();
    else if (v === 'timeline') renderTimeline();
    else if (v === 'map') { if (!leafMap) initCorpusMap(); else { leafMap.invalidateSize(); renderMap(); } }
  }
  document.getElementById('vtab-graph').addEventListener('click', () => setViewMode('graph'));
  document.getElementById('vtab-list').addEventListener('click', () => setViewMode('list'));
  document.getElementById('vtab-timeline').addEventListener('click', () => setViewMode('timeline'));
  document.getElementById('vtab-map').addEventListener('click', () => setViewMode('map'));

  // ---- legend ----
  const legendEl = document.getElementById('legend');
  function renderLegend() {
    legendEl.innerHTML = '';
    for (const item of legendMeta) {
      const btn = document.createElement('button');
      btn.className = 'legend-item' + (soloCluster !== null && soloCluster !== item.id ? ' dimmed' : '');
      const color = item.slot === 0 ? cssVar('--other-node') : cssVar(SLOT_VAR[item.slot]);
      btn.innerHTML = '<span class="legend-swatch" style="background:'+color+'"></span>'
        + '<span class="legend-name">'+escapeHtml(item.name)+'</span>'
        + '<span class="legend-count">'+item.count.toLocaleString()+'</span>';
      btn.addEventListener('click', () => {
        focusNode = null; focusSet = null; hideDetail();
        soloCluster = (soloCluster === item.id) ? null : item.id;
        renderLegend(); updateVisibleCount(); renderList(); renderTimeline(); renderMap(); draw();
      });
      legendEl.appendChild(btn);
    }
  }
  renderLegend();

  // ---- filters ----
  const filtersEl = document.getElementById('filters');
  const visibleCountEl = document.getElementById('visible-count');
  function updateVisibleCount() {
    const shown = computeCurrentSet().length;
    visibleCountEl.textContent = shown.toLocaleString() + ' / ' + nodes.length.toLocaleString();
  }
  function renderFilters() {
    filtersEl.innerHTML = '';
    for (const f of DATA.filterDefs) {
      const isActive = activeTypes.has(f.key);
      const btn = document.createElement('button');
      btn.className = 'type-item' + (isActive ? ' active' : '') + (activeTypes.size > 0 && !isActive ? ' dimmed' : '');
      btn.innerHTML = '<span class="type-icon">'+f.icon+'</span>'
        + '<span class="type-name">'+escapeHtml(f.label)+'</span>'
        + '<span class="type-count">'+f.count.toLocaleString()+'</span>';
      btn.addEventListener('click', () => {
        focusNode = null; focusSet = null; hideDetail();
        if (activeTypes.has(f.key)) activeTypes.delete(f.key); else activeTypes.add(f.key);
        renderFilters(); updateVisibleCount(); renderList(); renderTimeline(); renderMap();
        draw();
      });
      filtersEl.appendChild(btn);
    }
  }
  renderFilters();
  updateVisibleCount();

  // ---- list pane ----
  function renderList() {
    const arr = computeCurrentSet();
    const label = focusSet ? (arr.length.toLocaleString() + ' linked to "' + escapeHtml(focusNode[F.headword]) + '"')
                            : (arr.length.toLocaleString() + ' ' + (arr.length === nodes.length ? 'entries (unfiltered)' : 'entries matching current filters'));
    document.getElementById('list-count-label').innerHTML = label;
    const rowsEl = document.getElementById('list-rows');
    rowsEl.innerHTML = '';
    for (const n of arr) {
      const row = document.createElement('div');
      row.className = 'list-row' + (n === focusNode ? ' is-focus' : '');
      const types = (n[F.type] || []).map(t => TYPE_LABELS[t] || t).join(' · ');
      const note = n[F.note] || '';
      const preview = note.length > 150 ? note.slice(0, 150) + '…' : note;
      row.innerHTML = '<div class="lr-main"><span class="lr-name">'+escapeHtml(n[F.headword])+'</span>'
        + '<span class="lr-types">'+escapeHtml(types)+'</span></div>'
        + (preview ? '<div class="lr-note">'+escapeHtml(preview)+'</div>' : '');
      row.addEventListener('click', () => { focusAndCenter(n); });
      rowsEl.appendChild(row);
    }
  }

  // ---- timeline & map: markers wired into the same select/hover/detail plumbing as
  // the graph and list, and scoped by the same computeCurrentSet() (type filter /
  // cluster solo / focus) so all four views always agree on what's "in view" ----
  function wireMarkerEvents(svg) {
    svg.querySelectorAll('[data-id]').forEach(el => {
      const n = nodeById.get(el.getAttribute('data-id'));
      if (!n) return;
      el.addEventListener('click', e => { e.stopPropagation(); applySelection(n); draw(); });
      el.addEventListener('mouseenter', e => { renderDetail(n); showTooltip(n, e.clientX, e.clientY); });
      el.addEventListener('mousemove', e => showTooltip(n, e.clientX, e.clientY));
      el.addEventListener('mouseleave', () => { hideTooltip(); if (focusNode) renderDetail(focusNode); else hideDetail(); });
    });
    svg.addEventListener('click', e => { if (e.target === svg) { clearSelection(); draw(); } });
  }

  // ---- timeline ----
  const TL_ROW_H = 16, TL_PAD_L = 8, TL_PAD_R = 140, TL_PAD_T = 24, TL_PAD_B = 10;
  function assignLanes(arr) {
    const sorted = arr.slice().sort((a,b) => a[F.time].start - b[F.time].start || a[F.time].end - b[F.time].end);
    const laneEnds = [];
    const laneOf = new Map();
    for (const n of sorted) {
      const t = n[F.time];
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        if (t.start >= laneEnds[i]) { laneEnds[i] = t.end + 4; laneOf.set(n, i); placed = true; break; }
      }
      if (!placed) { laneEnds.push(t.end + 4); laneOf.set(n, laneEnds.length - 1); }
    }
    return { laneOf, laneCount: Math.max(1, laneEnds.length) };
  }
  function renderTimeline() {
    const totalDated = nodes.filter(n => n[F.time]).length;
    const arr = computeCurrentSet().filter(n => n[F.time]);
    const label = arr.length.toLocaleString() + ' dated entries' + (arr.length !== totalDated ? ' (of ' + totalDated.toLocaleString() + ' total)' : '');
    document.getElementById('timeline-count-label').textContent = label;
    const svg = document.getElementById('timeline-svg');
    if (arr.length === 0) { svg.innerHTML = ''; return; }

    let minY = Infinity, maxY = -Infinity;
    for (const n of arr) { minY = Math.min(minY, n[F.time].start); maxY = Math.max(maxY, n[F.time].end); }
    if (minY === maxY) { minY -= 10; maxY += 10; }
    const { laneOf, laneCount } = assignLanes(arr);

    const scrollEl = document.getElementById('timeline-scroll');
    const width = Math.max(scrollEl.clientWidth || 0, 700);
    const innerW = width - TL_PAD_L - TL_PAD_R;
    const height = TL_PAD_T + TL_PAD_B + laneCount * TL_ROW_H;
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    const yr2x = y => TL_PAD_L + (y - minY) / (maxY - minY) * innerW;

    const span = maxY - minY;
    const step = span > 1500 ? 200 : span > 700 ? 100 : span > 300 ? 50 : span > 100 ? 20 : 5;
    const parts = [];
    for (let y = Math.ceil(minY/step)*step; y <= maxY; y += step) {
      const x = yr2x(y);
      parts.push('<line class="tl-axis" x1="'+x+'" y1="'+TL_PAD_T+'" x2="'+x+'" y2="'+height+'" />');
      parts.push('<text class="tl-axis-label" x="'+x+'" y="15" text-anchor="middle">'+escapeHtml(fmtYear(y))+'</text>');
    }
    for (const n of arr) {
      const lane = laneOf.get(n);
      const y = TL_PAD_T + lane*TL_ROW_H + TL_ROW_H/2;
      const t = n[F.time];
      const x1 = yr2x(t.start), x2 = yr2x(t.end);
      const color = clusterColor(n[F.cluster]);
      if (t.start === t.end) {
        parts.push('<circle class="tl-dot" data-id="'+n[idIdx]+'" cx="'+x1+'" cy="'+y+'" r="4" style="fill:'+color+'" />');
      } else {
        parts.push('<rect class="tl-bar" data-id="'+n[idIdx]+'" x="'+x1+'" y="'+(y-3)+'" width="'+Math.max(2,x2-x1)+'" height="6" rx="3" style="fill:'+color+'" />');
      }
      if (n === focusNode) parts.push('<circle class="tl-focus-ring" cx="'+((x1+x2)/2)+'" cy="'+y+'" r="8" />');
      parts.push('<text class="tl-label" x="'+(Math.max(x1,x2)+6)+'" y="'+(y+3)+'">'+escapeHtml(n[F.headword])+'</text>');
    }
    svg.innerHTML = parts.join('');
    wireMarkerEvents(svg);
  }

  // ---- map: a real Leaflet + OpenStreetMap basemap, same tile source and pin/
  // cluster visual language as hist-map's own folio Map tab, so this doesn't look
  // like a different app bolted on. Lazy-initialized on first visit to the tab
  // (a hidden-container Leaflet map lays out at zero size); renderMap() re-renders
  // markers only, on the same computeCurrentSet() as every other view. ----
  let leafMap = null, markerLayer = null;
  function initCorpusMap() {
    leafMap = L.map('the-corpus-map', { minZoom: 2, maxZoom: 12 });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }).addTo(leafMap);
    const all = nodes.filter(n => n[F.location]);
    if (all.length) {
      leafMap.fitBounds(L.latLngBounds(all.map(n => [n[F.location].lat, n[F.location].lng])), { padding: [24, 24] });
    } else {
      leafMap.setView([20, 95], 4);
    }
    leafMap.on('click', () => { clearSelection(); draw(); });
    renderMap();
  }
  function renderMap() {
    if (!leafMap) return;
    const totalLocated = nodes.filter(n => n[F.location]).length;
    const arr = computeCurrentSet().filter(n => n[F.location]);
    document.getElementById('map-count-label').textContent =
      arr.length.toLocaleString() + ' located entries' + (arr.length !== totalLocated ? ' (of ' + totalLocated.toLocaleString() + ' total)' : '');

    if (markerLayer) markerLayer.clearLayers();
    markerLayer = L.layerGroup().addTo(leafMap);

    const groups = new Map();
    for (const n of arr) {
      const l = n[F.location];
      const key = l.lat.toFixed(2) + ',' + l.lng.toFixed(2);
      if (!groups.has(key)) groups.set(key, { latlng: [l.lat, l.lng], items: [] });
      groups.get(key).items.push(n);
    }

    for (const { latlng, items } of groups.values()) {
      const multi = items.length > 1;
      let html, size;
      if (multi) {
        const R = 13, total = Math.min(items.length, 8);
        let slices = '';
        items.slice(0, total).forEach((it, i) => {
          const a0 = (i/total)*2*Math.PI - Math.PI/2, a1 = ((i+1)/total)*2*Math.PI - Math.PI/2;
          const x1=R+R*Math.cos(a0), y1=R+R*Math.sin(a0), x2=R+R*Math.cos(a1), y2=R+R*Math.sin(a1);
          slices += '<path d="M'+R+','+R+' L'+x1+','+y1+' A'+R+','+R+' 0 '+((a1-a0)>Math.PI?1:0)+' 1 '+x2+','+y2+' Z" fill="'+clusterColor(it[F.cluster])+'" opacity="0.92"/>';
        });
        html = '<div style="width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);overflow:hidden;background:#fff"><svg width="30" height="30" viewBox="0 0 26 26">'+slices+'</svg></div>';
        size = [30, 30];
      } else {
        const isFocus = items[0] === focusNode;
        html = '<div style="width:22px;height:22px;border-radius:50%;background:'+clusterColor(items[0][F.cluster])+';border:2px solid '+(isFocus?'#201c14':'#fff')+';box-shadow:0 1px 5px rgba(0,0,0,.4)"></div>';
        size = [22, 22];
      }
      const icon = L.divIcon({ html, className: 'corpus-pin', iconSize: size, iconAnchor: [size[0]/2, size[1]/2] });
      const marker = L.marker(latlng, { icon }).addTo(markerLayer);

      if (multi) {
        const listHtml = items.map(it =>
          '<div class="map-pop-item" data-id="'+it[idIdx]+'">'
          + '<span class="map-pop-dot" style="background:'+clusterColor(it[F.cluster])+'"></span>'
          + '<span class="map-pop-name">'+escapeHtml(it[F.headword])+'</span></div>'
        ).join('');
        marker.bindPopup('<div class="map-pop">'+listHtml+'</div>', { maxWidth: 260 });
        marker.on('popupopen', e => {
          e.popup.getElement().querySelectorAll('[data-id]').forEach(el => {
            const nd = nodeById.get(el.getAttribute('data-id'));
            if (nd) el.addEventListener('click', () => { applySelection(nd); draw(); leafMap.closePopup(); });
          });
        });
      } else {
        const n = items[0];
        marker.on('click', () => { applySelection(n); draw(); });
        marker.on('mouseover', () => renderDetail(n));
        marker.on('mouseout', () => { if (focusNode) renderDetail(focusNode); else hideDetail(); });
      }
    }
  }

  // ---- search ----
  const searchInput = document.getElementById('search');
  const searchResults = document.getElementById('search-results');
  const sortedByDegree = nodes.slice().sort((a,b) => b[F.degree]-a[F.degree]);
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!q) return;
    const hits = sortedByDegree.filter(n => n[F.headword].toLowerCase().includes(q)).slice(0, 30);
    for (const n of hits) {
      const div = document.createElement('div');
      div.className = 'search-result';
      div.tabIndex = 0;
      div.innerHTML = '<span>'+escapeHtml(n[F.headword])+'</span>';
      div.addEventListener('click', () => focusAndCenter(n));
      searchResults.appendChild(div);
    }
  });

  // theme change redraw (canvas colors, and the timeline SVG's/map pins' inline
  // per-node fill styles, are all read from CSS vars at render time, not live-bound)
  function redrawAll() { draw(); renderTimeline(); renderMap(); }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
  new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  new ResizeObserver(entries => {
    const cr = entries[0].contentRect;
    if (viewMode === 'graph') applySize(cr.width, cr.height);
  }).observe(stage);
  window.addEventListener('resize', () => {
    if (viewMode === 'graph') applySize(stage.clientWidth, stage.clientHeight);
    else if (viewMode === 'timeline') renderTimeline();
    else if (viewMode === 'map' && leafMap) leafMap.invalidateSize();
  });

  // belt-and-braces: some embedding contexts deliver layout a frame or two late,
  // or don't fire ResizeObserver while the tab is unpainted — poll briefly until sized.
  let pollFrames = 0;
  (function pollSize() {
    if (hasFit || pollFrames++ > 90) return;
    applySize(stage.clientWidth, stage.clientHeight);
    requestAnimationFrame(pollSize);
  })();

  renderList();
  renderTimeline();
})();
</script>
