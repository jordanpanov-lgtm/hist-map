division of all phenomena into ultimate and conventional truth, defined differently by every school — Vaibhāṣika ties it to whether something can be physically decomposed into parts, Yogācāra to dependent versus consummate natures, Madhyamaka to emptiness versus everything else. Despite being called \"truths,\" conventional truths are in a real sense false, since unenlightened perception ascribes to them more solid reality than they actually possess.",null,null],["n3291","Sautrāntika",822,5,41,33,1945,0,-274,161,["school"],"Sautrāntika. (\"Followers of the Sūtras.\") A mainstream school, likely a Sarvāstivāda offshoot, distinguished by rejecting the abhidharma's status as authentic word of the Buddha and advocating that only the present moment truly exists. No independent texts survive; its positions are known mainly through the Abhidharmakośabhāṣya, whose author Vasubandhu — by Tibetan accounts a committed Yogācārin — wrote it from a broadly Sautrāntika standpoint. Grouped with its rival Vaibhāṣika as one of the two \"śrāvaka schools\" in later Indian and Tibetan classification, the two differ chiefly on whether the mind perceives external objects directly or only through mediating images.",null,null],["n3313","sengtang",826,7,26,11,2252,0,109,-261,["concept"],"Sengtang. (\"Saṃgha hall\" or \"monks' hall.\") The architectural and practical center of Chinese Chan monastic life, where monks ate, slept, and meditated together on long communal platforms arranged by seniority — a practice traditionally credited to Baizhang Qinggui and later codified into the standard plan of every large Song-dynasty public monastery. Introduced to Japan by Dōgen in 1236, it became closely identified with the Sōtō tradition specifically, since Rinzai instead reserved a separate, meditation-only zendō, using the saṃgha hall model solely for eating and sleeping.",{"start":749,"end":814,"basis":"foundation \"traditionally attributed to the Chan master Baizhang Qinggui (749–814)\""},null],["n3345","Shi",835,5,37,22,1797,0,-85,-42,["concept"],"Shi. The monastic surname adopted by Chinese Buddhist monks and nuns in place of their family names, taken from the first syllable of the Buddha's own clan name, Śākya. Before the monk Dao'an standardized the practice, ordinands instead took ethnic surnames tied to their teacher's homeland — An for Parthians, Zhu for Indians, Zhi for Kushans, Kang for Sogdians. Adopting \"Shi\" instead signified a decisive break from one's birth family in favor of a shared identity within the lineage of the Buddha, and became universal practice after 385 once a translated scriptural passage seemed to supply textual justification for it.",{"start":365,"end":379,"basis":"the custom introduced while Dao'an \"resided in Xiangyang... between 365 and 379\""},{"lat":32.0424,"lng":112.122,"label":"Xiangyang, Hubei, China (where Dao'an introduced the custom, named directly)"}],["n3362","Shingonshū",839,0,51,43,4103,0,139,-227,["school"],"Shingonshū. (\"True Word School.\") Japan's major esoteric Buddhist tradition, built by the monk Kūkai around ritual access to the cosmic buddha Mahāvairocana through maṇḍala visualization, mantra recitation, and mudrā — techniques said to let a practitioner achieve buddhahood in this very body. Kūkai's political skill secured him control of ordination platforms at Nara and Kyōto and imperial grants of Tōji and Mt. Kōya, the latter surviving Oda Nobunaga's destruction of rival Buddhist centers by successfully appealing to Toyotomi Hideyoshi. Suppressed during the Meiji persecution, its scattered lineages later reunified under the single Shingonshū banner.",{"start":774,"end":835,"basis":"founder Kūkai's dates, \"(774–835)\""},{"lat":34.2125,"lng":135.5858,"label":"Kōyasan, Japan (major center Kūkai established, named directly)"}],["n3365","Shinran",840,0,36,22,4671,0,168,-110,["person"],"Shinran. (1173–1262.) Founder of Jōdo Shinshū, who left Tendai training on Mt. Hiei to become Hōnen's disciple, was defrocked and exiled when Hōnen's exclusive-nenbutsu teaching was suppressed, and went on to marry and raise a family while declaring himself \"neither monk nor layman.\" His central concept, shinjin, reframes salvation as arising not from any effort of one's own (\"self-power\") but purely through entrusting oneself to Amitābha's vow (\"other-power\") — radical enough that he argued an evil person has an easier path to rebirth in the pure land than a virtuous one, since the virtuous remain attached to the illusion that their own good deeds matter.",{"start":1173,"end":1262,"basis":"\"(1173–1262)\", given directly"},{"lat":35.0116,"lng":135.7681,"label":"Kyōto, Japan (where he trained at Mt. Hiei and where the Jōdo Shinshū tradition later centered)"}],["n3398","Siddhārtha",850,2,28,24,787,0,179,73,["person"],"Siddhārtha. (\"He Who Achieves His Goal.\") The Buddha's given name, used during his years as prince and ascetic before enlightenment, after which he becomes known instead as Gautama, Śākyamuni, or simply the Tathāgata — the Lalitavistara instead names him Sarvārthasiddha, \"He Who Achieves the Welfare of All.\" The name is likely best known in the West as the title of Hermann Hesse's 1922 novel, whose protagonist, despite the title, is explicitly not the historical Buddha.",{"start":-560,"end":-480,"basis":"personal name of the Buddha before enlightenment; chronology convention"},{"lat":27.6667,"lng":83.2833,"label":"Kapilavastu/Lumbinī area, southern Nepal (associated with his princely years)"}],["n3417","śīla",854,1,82,69,2414,0,25,130,["concept"],"Śīla. (\"Morality.\") Restraint of unwholesome deeds of body and speech — one of the three trainings alongside concentration and wisdom, and the second of the six perfections. Takes graduated forms across the tradition: five precepts for laypeople, an expanded eight for occasional lay observance, ten for novices, and the full monastic code for ordained monks and nuns. In the bodhisattva path, its scope widens further still, into the distinct bodhisattva precepts.",null,null],["n3424","Silk Road",856,2,30,26,5151,0,163,-11,["concept"],"Silk Road. A term coined in 1877 by geographer Ferdinand von Richthofen for the sprawling network of Central Asian caravan routes linking China, India, and the Mediterranean world — not a single road but a web of paths skirting the Takla Makan desert through oasis kingdoms like Kucha, Turfan, and Khotan before reconverging at Dunhuang. Beyond trade in silk, spices, and precious metals, the route served for centuries as Buddhism's primary conduit out of India into Central and East Asia, carried by monks traveling alongside merchant caravans — the same routes that later carried Nestorian Christianity, Manichaeism, and Islam in Buddhism's wake.",null,null],["n3445","skandha",861,1,120,115,1131,0,-161,188,["concept"],"Skandha. (\"Heap\" or \"aggregate.\") The five constituents into which Buddhist analysis decomposes a person: form, sensation, perception, conditioning factors, and consciousness — the last four together called \"name,\" paired with form as \"name-and-form.\" Nowhere among these five is there a self to be found, yet the mind habitually mistakes one or another of them for exactly that — the root wrong view that perpetuates suffering and rebirth.",null,null],["n3456","smṛti",864,1,50,33,3383,0,-124,241,["concept"],"Smṛti. (\"Mindfulness\" or \"memory.\") The ability to stay focused on a chosen object without forgetting or drifting, classed by Sarvāstivāda abhidharma among five \"determinative\" mental factors that together aid the mind in fixing on its object. Uniquely among the five spiritual faculties, mindfulness can never be excessive — it is precisely what keeps faith from collapsing into blind belief, wisdom from curdling into skepticism, and effort from swinging between restlessness and sloth. As the seventh element of the noble eightfold path and the first of the seven factors of enlightenment, it underlies virtually every account of Buddhist meditative training.",null,null],["n3457","smṛtyupasthāna",864,1,28,24,1159,0,-122,347,["concept"],"Smṛtyupasthāna. (\"Foundations of mindfulness.\") A fourfold meditative training contemplating the body, sensations, mental states, and mental factors in turn — from breath and posture awareness to noticing whether the mind is elated or distracted to observing the five hindrances and five aggregates directly. As the first of the thirty-seven factors of enlightenment, it establishes mindfulness's foundational role within the noble eightfold path itself.",null,null],["n3468","ṣoḍaśasthavira",866,2,30,21,1342,0,143,76,["concept"],"Ṣoḍaśasthavira. (\"The sixteen elders,\" known in East Asia as the sixteen arhats.) A group of venerated arhat disciples instructed by the Buddha to forgo their own final nirvāṇa and remain in the world, each guarding a specific mythical residence with a retinue of disciples, until Maitreya's arrival — at which point they will gather Śākyamuni's relics into one last stūpa before finally passing into parinirvāṇa themselves. An earlier and narrower tradition, the Śāriputraparipṛcchā, names only four monks entrusted with this task after the Buddha's death: Mahākāśyapa, Piṇḍola, Kundovahan (apparently identical to Bakkula), and Rāhula.",null,null],["n3482","Sŏn",872,7,98,89,2346,0,-17,-342,["school"],"Sŏn. The Korean branch of the East Asian Chan tradition, brought to the peninsula by pilgrim-monks no later than the early ninth century. At least nine returning pilgrims founded their own lineages, together known as the Nine Mountains school. Flourished under Pojo Chinul during the Koryŏ dynasty, developed a distinctive \"questioning meditation\" focused on the Linji lineage, and survived centuries of Chosŏn-era suppression to remain the dominant strand of Korean Buddhism today, in the Chogye and T'aego orders.",{"start":800,"end":850,"basis":"\"no later than the early-ninth century during the Silla dynasty\" (pilgrims bringing the tradition to Korea)"},{"lat":37.5,"lng":127,"label":"Korea (general placeholder — no specific site named)"}],["n3492","Songgwangsa",875,7,26,18,2288,0,10,-219,["place"],"Songgwangsa. (\"Piney Expanse Monastery.\") One of Korea's three \"jewel monasteries,\" representing the saṃgha jewel through its succession of sixteen state preceptors during the Koryŏ dynasty, and expanded from a small foundation by Pojo Chinul in 1197 into the seat of his Samādhi and Prajñā Community. Renamed Susŏnsa by royal decree in 1208 — a name its meditation hall still bears — the monastery today functions as one of five ecumenical training centers in the modern Chogye order, teaching the full range of Korean Buddhist practice under its alternate name, Chogye Ch'ongnim.",{"start":1197,"end":1197,"basis":"restored and expanded by Pojo Chinul \"in 1197\""},{"lat":35,"lng":127.35,"label":"Mount Chogye, South Chŏlla Province, Korea (named directly as the entry's subject)"}],["n3502","Sōtōshū",878,7,48,38,5374,0,101,-352,["school"],"Sōtōshū. One of Japanese Zen's three major branches, tracing its lineage through Dōgen Kigen, who brought the Chinese Caodong line back from China in 1227 and, driven out of Kyōto by rival Tendai and Rinzai institutions, founded Eiheiji in rural Echizen instead. Revitalized by \"second patriarch\" Keizan Jōkin, who folded local kami worship into Sōtō practice and founded the second head monastery, Sōjiji, the school expanded through the medieval period by serving rural communities with bridges, irrigation, and funerals largely neglected by court Buddhism. Its central practice, \"just sitting\" (shikan taza), treats meditation itself as the direct manifestation of buddhahood rather than a means toward it, and the school remains one of Japan's largest, with over fourteen thousand temples today.",{"start":1200,"end":1253,"basis":"founder Dōgen Kigen's dates, \"(1200–1253)\""},{"lat":36.05,"lng":136.35,"label":"Eiheiji, Echizen (Fukui), Japan (the monastery Dōgen founded as the tradition's center)"}],["n3503","sparśa",879,1,41,35,1256,0,-267,377,["concept"],"Sparśa. (\"Contact.\") The sixth link of dependent origination, the mental — not physical — event by which consciousness \"touches\" an object once sense organ and sense object meet, immediately classifying it as pleasant, unpleasant, or neutral and thereby triggering the next link, sensation. The Buddha traced his own pre-enlightenment inquiry into suffering back to exactly this point: sensation depends on contact, contact depends on the sense organs, and if the sense organs cease functioning, the whole chain collapses with them.",null,null],["n3509","sprul sku",880,3,45,36,3480,0,-252,-169,["concept"],"Sprul sku. (\"Tulku.\") The Tibetan rendering of nirmāṇakāya, a buddha's \"emanation body\" manifest in the world for others' benefit — extended by usage to mean any recognized \"incarnate lama.\" Unlike ordinary beings, whose rebirth is involuntary and risks a lower destiny, an incarnate lama's rebirth is held to be a deliberate choice, traceable through instructions the dying master leaves behind. By the fifteenth century every Tibetan sect had adopted the practice — the Dalai Lamas its most famous example — creating roughly three thousand recognized incarnation lines and, with them, a durable mechanism for passing religious authority across generations.",{"start":1000,"end":1200,"basis":"the practice of identifying incarnate children \"may date from as early as the eleventh or twelfth century\""},null],["n3510","śraddhā",880,1,56,29,3738,0,-83,206,["concept"],"Śraddhā. (\"Faith\" or \"confidence.\") Ranges from mental clarity and positive disposition toward the Buddha to conviction in the path's efficacy to active commitment to follow it — with real cognitive, conative, and affective dimensions, the latter epitomized by the disciple Vakkali's rapturous devotion. Listed first among both the wholesome mental factors and the five spiritual faculties, faith is deliberately kept in tension with wisdom via mindfulness: unchecked faith risks blind acceptance, unchecked wisdom risks corrosive skepticism. Its four proper objects are karmic cause-and-effect, the conditioned nature of the world, the three jewels, and the prospect of nirvāṇa itself.",null,null],["n3512","śraddhānusārin",881,1,35,13,3468,0,-64,306,["concept"],"Śraddhānusārin. (\"Follower of faith.\") One of seven types of noble ones recognized across Sarvāstivāda and Pāli scholastic traditions: a stream-enterer in whom the faculty of faith predominates over analytical understanding, destined eventually to become someone \"liberated through faith.\" Distinguished from the \"dharma-follower,\" who advances through direct knowledge of the four noble truths and eliminates obstacles all at once rather than progressively — a distinction with real stakes, since Vaibhāṣika abhidharma holds that faith-based arhatship can backslide, while the dharma-follower's attainment cannot.",null,null],["n3514","śramaṇa",882,2,48,34,3390,0,90,228,["concept"],"Śramaṇa. (\"Renunciant\" or \"mendicant.\") A category of itinerant ancient Indian religious founded by historical figures flourishing around the sixth century BCE, challenging Brahmanical orthodoxy and its Vedic ritual authority — Buddhism and Jainism among them. Six rival śramaṇa teachers are named in early Buddhist texts, each championing a different position (antinomianism, fatalism, materialism, atomism, agnosticism, and the Jaina teacher Mahāvīra's asceticism), all dismissed by the Buddha as \"heterodox.\" In Buddhism the term also broadens generically to mean any monk, including the Buddha himself, distinguished carefully from śrāmaṇera, a mere novice.",{"start":-600,"end":-500,"basis":"śramaṇa movements \"derive from historical persons who all flourished around the sixth century BCE\""},null],["n3515","śrāmaṇera",882,2,47,36,2057,0,230,123,["concept"],"Śrāmaṇera. (\"Novice.\") The preliminary ordination stage every man must pass through before full ordination as a monk, entered through a simple ceremony of shaving, robing, and a threefold recitation of the refuges. Bound to ten precepts in Pāli tradition (expanded to thirty-six under Mūlasarvāstivāda), a novice cannot yet attend the formal recitation of the monastic code or participate in official ecclesiastical acts, and must live under a teacher's guidance until reaching full ordination — with disqualifying categories for admission ranging from convicted criminals to those with communicable disease.",null,null],["n3521","śrāvaka",883,5,81,76,1397,0,-130,57,["concept"],"Śrāvaka. (\"Listener\" or \"disciple.\") In Mahāyāna usage, one who seeks personal liberation as an arhat rather than full buddhahood — grouped with the pratyekabuddha as followers of the lesser vehicle, and pointedly contrasted with the bodhisattva. Mahāyāna texts disagree sharply on their fate: the Lotus Sūtra has the Buddha prophesy future buddhahood for famous śrāvakas like Śāriputra, while other traditions treat arhatship as a genuine dead end. Frequently appear as the Buddha's interlocutors and audience throughout Mahāyāna sūtras, sometimes visibly out of their depth — as when several balk at visiting the layman Vimalakīrti, dreading his superior grasp of the dharma.",null,null],["n3525","Śrāvastī",884,2,80,76,1172,0,187,324,["place"],"Śrāvastī. Capital of Kośala and one of India's major cities during the Buddha's lifetime, where he is said to have spent twenty-five rainy-season retreats — more than anywhere else. Ruled by his patron King Prasenajit; home to his wealthiest lay donor, Anāthapiṇḍada, who gave him the Jetavana grove where hundreds of sūtras are set. Also the site of two of the Buddha's most spectacular recorded miracles: multiplying himself across the heavens and earth, and rising into the air emitting fire and water simultaneously.",{"start":-560,"end":-480,"basis":"\"at the time of the Buddha\"; chronology convention"},{"lat":27.5077,"lng":82.0512,"label":"Śrāvastī (Sahet-Mahet), Uttar Pradesh, India — the entry itself"}],["n3527","Śreṇika heresy",885,7,25,0,3297,0,15,-112,["concept"],"Śreṇika heresy. The mistaken view, traced to the wanderer Śreṇika Vatsagotra, that the impermanent body houses a permanent self — illustrated by Śreṇika's own image of a house burning down while its owner escapes unharmed outside, directly inverting the Buddha's own fire-simile teaching that nothing \"goes anywhere\" when the aggregates cease. The charge resurfaces repeatedly in East Asian Chan polemics, leveled against Mazu Daoyi's \"mind itself is buddha\" teaching by Nanyang Huizhong and later against similar claims by Dōgen, who worried any doctrine implying an eternal, unchanging mind-nature beneath an impermanent body collapsed straight back into this same ancient error.",{"start":-560,"end":-480,"basis":"originated with Śreṇika Vatsagotra, \"a contemporary of Gautama Buddha\"; chronology convention"},null],["n3534","Srong btsan sgam po",887,3,36,29,4147,0,-204,-251,["person"],"Srong btsan sgam po. (r. c. 605–650.) The Tibetan king credited with establishing Buddhism in Tibet and, per later tradition, an earthly manifestation of Avalokiteśvara — though his historical religious commitments remain genuinely uncertain, since he maintained close ties to the indigenous Bon religion throughout his reign. Built an empire rivaling any in Asia, moved his capital to Lhasa, commissioned the creation of the Tibetan script to translate Buddhist texts, and, per Tibetan geomantic legend, constructed a network of \"taming temples\" across the landscape to pin down a demoness whose subjugation was believed necessary for Buddhism to take root.",{"start":605,"end":650,"basis":"\"(r. c. 605–650)\", given directly"},{"lat":29.6467,"lng":91.117,"label":"Lhasa, Tibet (capital he established, named directly)"}],["n3535","srotaāpanna",887,1,117,100,2998,0,16,279,["concept"],"Srotaāpanna. (\"Stream-enterer.\") The first of four stages of sanctity in mainstream Buddhism, attained by severing the first three of ten fetters binding beings to rebirth: belief in a perduring self, doubt about the path's efficacy, and faith in the power of rites and rituals. Having \"entered the stream\" toward liberation, the stream-enterer is guaranteed never again to be reborn as an animal, ghost, or hell-denizen, and will reach arhatship within at most seven more lifetimes.",null,null],["n3554","*Sthaviranikāya",891,2,43,33,2489,0,62,220,["school"],"*Sthaviranikāya. (\"School of the Elders.\") One of the two mainstream factions produced by a dispute over ten points of monastic conduct at the second Buddhist council in Vaiśālī, insisting the disputed rules be strictly observed against the more permissive Mahāsāṃghika. Subsequently splintered into further schools, the earliest being the Vātsīputrīya or Pudgalavāda, notorious among rival mainstream schools for positing a quasi-permanent \"person\" underlying karmic continuity — a position its critics viewed as a thinly disguised self, yet one that proved durable and widespread despite near-universal reproach.",{"start":-380,"end":-380,"basis":"arose \"about a century after the Buddha's death, at the... second Buddhist council\" (chronology convention)"},{"lat":26.0281,"lng":85.1214,"label":"Vaiśālī (site of the second Buddhist council, named directly)"}],["n3559","stūpa",892,2,137,125,4646,0,110,22,["concept"],"Stūpa. (\"Reliquary.\") A hemispherical monument enshrining the relics of the Buddha or a saint — begun, per tradition, when the Buddha's own remains were divided into ten portions and enshrined at sites including Kapilavastu, Kuśinagarī, Rājagṛha, and Vaiśālī shortly after his death. Emperor Aśoka reportedly reopened these and redistributed the relics into eighty-four thousand stūpas in the third century BCE. Evolved regionally into the dagoba and pagoda; by the seventh century, Indian stūpas increasingly enshrined not physical relics but tablets stamped with a verse encapsulating the Buddha's teaching on causation.",{"start":-480,"end":-480,"basis":"origin, shortly after the Buddha's death, per this entry's own account"},{"lat":26.7385,"lng":83.8882,"label":"Kuśinagarī (one of the ten original relic-distribution sites named in this entry)"}],["n3574","śuddhāvāsa",896,1,24,12,2244,0,-28,308,["concept"],"Śuddhāvāsa. (\"Pure abodes.\") The five highest heavens of the subtle-materiality realm's fourth meditative absorption, serving as a final way station for nonreturners — advanced practitioners in their last life before arhatship, who need never again be reborn in the sensuous realm below. Believed to sit empty for entire eons when no buddha is present in the world, and, in Mahāyāna sources, home to the divinities who present the four portents that drive a bodhisattva-in-training to renounce the household life.",null,null],["n3576","Śuddhodana",896,2,28,19,2774,0,198,208,["person"],"Śuddhodana. (\"Pure Rice.\") The Buddha's father, king of the Śākya clan at Kapilavastu, who built three pleasure palaces in a failed attempt to shield his son from the sufferings that would eventually drive him to renounce the world. Reconciled to his son's path after his enlightenment, though he objected when the Buddha ordained his young grandson Rāhula without parental consent — prompting a new rule requiring parental permission for ordination going forward — Śuddhodana himself became a stream-enterer and, shortly before his death, an arhat.",{"start":-560,"end":-480,"basis":"father of the Buddha, contemporary with his son's life; chronology convention"},{"lat":27.5667,"lng":83.05,"label":"Kapilavastu (where he ruled, named directly)"}],["n3591","sukhāvatī",900,0,58,55,1111,0,195,-136,["concept"],"Sukhāvatī. (\"Blissful\" — rendered in Chinese as \"ultimate bliss.\") The buddha-field or pure land of Amitābha, described across the three core pure land sūtras and known in East Asia as \"the western pure land.\" In India, rebirth there appears to have circulated as a general soteriological goal somewhat independent of devotion to Amitābha specifically, appearing in Mahāyāna sūtras such as the Samādhirājasūtra, which likely dates to the second century CE — though its own fullest description appears in the larger Sukhāvatīvyūhasūtra.",null,null],["n3592","Sukhāvatīvyūhasūtra",900,0,42,35,4927,0,134,-56,["work"],"Sukhāvatīvyūhasūtra. (\"Sūtra Displaying [the Land of] Bliss.\") The longer and shorter versions of Pure Land Buddhism's foundational scripture, recounting how the monk Dharmākara, inspired by a vision of countless buddha-fields, vowed to concentrate their finest qualities into a single realm and made forty-eight specific vows describing it — including that anyone who calls his name with sincere faith will be reborn there. Having fulfilled his vow and become the buddha Amitābha, he brought into being the pure land Sukhāvatī exactly as promised: level, lotus-carpeted, radiant with light-born buddhas, and entirely free of suffering's harsher registers.",{"start":200,"end":300,"basis":"\"both sūtras are believed to date from the third century CE\""},null],["n3610","śūnyatā",904,5,153,141,2533,0,-224,44,["concept"],"Śūnyatā. (\"Emptiness.\") In its early sense, one aspect of suffering — the body's lack of anything worth grasping as \"mine.\" Nāgārjuna and the Madhyamaka school, from the second century CE, radically broadened it: emptiness becomes the absence of intrinsic nature (svabhāva) in every phenomenon whatsoever, equated with dependent origination itself — not nonexistence, but the absence of a falsely imagined kind of existence. Yogācāra later reinterprets it through the three natures; in Tibet, the precise meaning of emptiness became the subject of the rang stong/gzhan stong debate.",{"start":100,"end":300,"basis":"Madhyamaka's systematized sense, via Nāgārjuna, \"second century CE\""},null],["n3623","sūtra",908,2,176,168,2115,0,27,68,["concept","work"],"Sūtra. (\"Aphorism.\") A discourse delivered by the Buddha or spoken with his sanction — opening formulaically with \"Thus have I heard,\" certifying the first-person report of his attendant Ānanda. Tradition holds the sūtras were first recited into fixed form by Ānanda at the first Buddhist council, shortly after the Buddha's death. Centuries later, hundreds of new Mahāyāna sūtras began appearing in India claiming the same authority, sparking a genre-wide anxiety about proving they too were the Buddha's actual word.",{"start":-480,"end":-480,"basis":"first Buddhist council, shortly after the Buddha's death (chronology convention)"},null],["n3625","sūtrapiṭaka",908,2,54,43,3087,0,110,252,["concept","work"],"Sūtrapiṭaka. (\"Basket of discourses.\") One of the three divisions of the canon, a sprawling collection of thousands of texts attributed to the Buddha or spoken with his sanction. The Pāli version splits into five groups running from thirty-four long discourses to nearly ten thousand brief numerically-organized texts, preserved orally for centuries before being committed to writing in Sri Lanka at the end of the first century BCE; other Indian schools' Chinese and Tibetan translations use \"āgama\" instead of \"nikāya\" for the same groupings, with real differences in content despite the parallel titles.",{"start":-100,"end":-100,"basis":"\"committed to writing in Sri Lanka at the end of the first century BCE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Anurādhapura placeholder — where the Pāli canon was first committed to writing)"}],["n3632","Suvarṇaprabhāsottamasūtra",910,5,25,15,2533,0,-24,-44,["work"],"Suvarṇaprabhāsottamasūtra. (\"Sūtra of Supreme Golden Light.\") A hugely influential East Asian Mahāyāna sūtra, rich in dhāraṇī and sometimes classified as proto-tantric, central to \"state-protection Buddhism\" through its promise that faithful rulers who uphold it will be divinely protected while negligent ones will see their kingdoms fall to ruin. Also the scriptural source for the \"water and land ceremony\" for universal salvation, illustrated by the sūtra's own story of a past-life Buddha who saved a pond of dying fish and, in another tale, of Prince Mahāsattva's self-sacrifice to feed a starving tigress — one of Buddhist literature's most famous instances of the \"gift of the body.\"",{"start":300,"end":400,"basis":"\"scholars speculate that the text originated in India in the fourth century\""},null],["n3639","svabhāva",912,5,47,35,2063,0,-305,139,["concept"],"Svabhāva. (\"Self-nature\" or \"intrinsic existence.\") In Madhyamaka, a falsely hypostatized independent essence that ignorance wrongly attributes to phenomena — so central to refute that the school calls itself the \"Proponents of No Svabhāva.\" Yogācāra instead sorts all phenomena into three natures — imaginary, dependent, and consummate — while the Laṅkāvatārasūtra multiplies the term into seven distinct senses of \"nature,\" from causal origination to the fully realized buddha-nature underlying reality. The same word, in other words, names either the illusion Madhyamaka dismantles or the structure Yogācāra builds up, depending entirely on which school is using it.",null,null],["n3654","*Svātantrika",916,5,26,22,943,0,-383,61,["concept"],"*Svātantrika. (\"Autonomist.\") One of two retrospective Tibetan classifications of Indian Madhyamaka — a label that never actually appears in Indian sources — coined to describe Bhāvaviveka's insistence on using autonomous syllogisms in philosophical debate, a method Candrakīrti explicitly rejected in founding what Tibetans would call the rival Prāsaṅgika approach. Tibetan doxography further splits Svātantrika into a Sautrāntika-aligned branch founded by Bhāvaviveka and a Yogācāra-aligned branch founded by Śāntarakṣita.",null,null],["n3689","tantra",926,3,117,96,3961,0,-141,-156,["concept","work"],"Tantra. (\"Continuum.\") A genre of esoteric Buddhist manual — mantras, maṇḍalas, initiations, fire sacrifices — aimed at both mundane and supramundane powers, appearing in India from the late seventh century in a nonstandard, colloquial Sanskrit. Exegetes classed the Mahāyāna into two modes: the pāramitānaya of the sūtras and the mantranaya of the tantras, the latter promising the same buddhahood by a faster route — the vajra vehicle. Later Indian scholiasts sorted the corpus into a fourfold hierarchy: kriyā, caryā, yoga, and anuttarayoga tantra.",{"start":675,"end":725,"basis":"\"texts called tantras began to appear in India in the late seventh and early eighth centuries CE\""},{"lat":25.61,"lng":85.14,"label":"India (general placeholder — Magadha; no specific site named)"}],["n3696","Tārā",928,3,41,21,5954,0,-138,-179,["deity"],"Tārā. (\"Savioress.\") A female bodhisattva born either from a ray of light in Amitābha's eye or a tear of Avalokiteśvara's compassion, revered — despite her youthful maiden form — as \"mother of all buddhas\" alongside the goddess Prajñāpāramitā. Best known in her peaceful White and Green forms and her wrathful dancing Kurukullā, she is invoked especially as protector from eight great fears (lions, fire, thieves, and the like) and became central to Tibetan Buddhism from the eleventh century onward through Atiśa's visions and translations, with later tradition identifying her as incarnate in figures from the Nepalese and Chinese princesses who married Srong btsan sgam po to the female tantric master Ma gcig lab sgron.",{"start":500,"end":600,"basis":"\"entered the Buddhist pantheon relatively late, around the sixth century, in northern India and Nepal\""},{"lat":27.7172,"lng":85.324,"label":"Nepal / northern India (general placeholder, per the entry's own dating)"}],["n3704","tathāgata",930,5,46,41,1647,0,-85,59,["concept"],"Tathāgata. (\"One who has thus come/gone.\") One of the Buddha's most common epithets, deliberately ambiguous in Sanskrit between \"thus come\" and \"thus gone,\" and used by the Buddha himself to refer both to himself and to buddhas of the past. Pāli commentaries offer as many as sixteen explanations, some possibly pre-Buddhist in origin; the most common readings hold that a buddha has \"thus come\" into the world following the pattern of past buddhas, or \"thus gone\" on to nirvāṇa as they did — with the term's root also suggesting a more literal claim to understand things \"as they truly are.\"",null,null],["n3706","tathāgatagarbha",930,5,81,63,4633,0,-196,-26,["concept"],"Tathāgatagarbha. (\"Womb\" or \"embryo of the tathāgatas\" — buddha-nature.) The claim that the potential for buddhahood is innate in all sentient beings, merely concealed by adventitious afflictions rather than absent. Evolves across Mahāyāna sūtras from a simple assurance that awakening is possible into something closer to genetic destiny — the Laṅkāvatāra even gives it the thirty-two physical marks of a buddha. Provoked real anxiety about smuggling back a forbidden permanent self: Candrakīrti insists it names nothing but the mind's own emptiness, while others, like the Jo nang, defended it as an ultimately real, if obscured, nature — a live fault line between Tibetan schools to this day.",null,null],["n3711","tathatā",932,5,36,31,1068,0,-250,-3,["concept"],"Tathatā. (\"Suchness\" or \"thusness.\") A term for ultimate reality carrying a more \"positive\" register than emptiness — reality as it is \"ever thus,\" free of conceptual elaboration, rather than reality defined by what it lacks. Yogācāra reads it as wisdom free of any subject-object split; Madhyamaka collapses it back into emptiness itself, rejecting any attempt to give suchness a positive nature of its own. Its Chinese rendering, zhenru, became one of the most consequential terms in East Asian Buddhist philosophy, anchoring texts like the Dasheng qixin lun.",null,null],["n3723","Tendaishū",934,0,53,42,3675,0,135,-207,["school"],"Tendaishū. The Japanese counterpart of Chinese Tiantai, founded on the doctrinal and institutional groundwork laid by the pilgrim-monk Saichō, centered like its parent tradition on the Lotus Sūtra and Zhiyi's commentaries, and later distinctive for its doctrine of original enlightenment. Its Mt. Hiei headquarters, Enryakuji, became both a major religious center and a political force at the Kyōto court — and, crucially, an incubator: Genshin, Hōnen, Shinran, Dōgen, and Nichiren, founders of Japan's later Kamakura schools, all trained there first. Rivalry with Kūkai's Shingon esoteric teachings pushed Tendai to absorb its own esoteric practices (Taimitsu), securing its dominance through the medieval and Tokugawa periods.",{"start":767,"end":822,"basis":"founder Saichō's dates, \"(767–822)\", who \"laid the doctrinal and institutional foundations\""},{"lat":35.0708,"lng":135.8408,"label":"Mt. Hiei / Enryakuji, Japan (the school's institutional base, named directly)"}],["n3736","Theravāda",937,2,88,75,5484,0,122,220,["school"],"Theravāda. (\"Way of the Elders.\") A modern name — not adopted in its current sense until the early twentieth century — applied to the Buddhism of Sri Lanka and Southeast Asia, which became the region's dominant tradition by the eleventh century CE. The dictionary is unusually blunt about the term's shaky pedigree: \"Theravāda\" isn't securely attested in Indian sources, the name largely displaced the pejorative \"Hīnayāna\" only in the 1950s by resolution of the World Fellowship of Buddhists, and — despite popular belief — its Pāli scriptures were often redacted later than much of the \"newer\" Mahāyāna literature they're assumed to predate.",{"start":1000,"end":1100,"basis":"\"By the eleventh century CE, what is today designated as the Theravāda became the dominant form of Buddhism in Sri Lanka\""},{"lat":7.2906,"lng":80.6337,"label":"Sri Lanka (general placeholder — no specific site named)"}],["n3761","ti",943,5,27,9,2647,0,-209,-68,["concept"],"Ti. (\"Body,\" \"essence,\" or \"substance.\") A term paired philosophically with \"function\" (yong), elevated from its ordinary Confucian sense of physical body into a metaphysical concept by Wang Bi, who used it as a synonym for Daoist nonbeing. Chinese Buddhist thinkers from Sengzhao to Guifeng Zongmi adopted and systematized the ti-yong pairing — Zongmi identifying ti with the unchanging essence of true thusness and yong with its diverse functional manifestations — a framework later exported wholesale into Neo-Confucian metaphysics by thinkers like Zhu Xi.",null,null],["n3764","Tiantai Zhiyi",944,5,48,40,2630,0,-115,-87,["person"],"Tiantai Zhiyi. (538–597.) De facto founder of the Tiantai zong, orphaned by wartime turmoil and ordained at eighteen, who studied under Nanyue Huisi before retiring to Mt. Tiantai for eleven years of intensive meditative practice and writing. His three great commentaries — the Fahua xuanyi, Fahua wenju, and Mohe zhiguan, the latter composed after returning to lecture at the invitation of Sui royalty — systematized Lotus Sūtra doctrine and meditation into the framework that has defined Tiantai (and Japanese Tendai) ever since, earning him the imperial title \"Great Master Zhizhe.\"",{"start":538,"end":597,"basis":"\"(538–597)\", given directly"},{"lat":29.1667,"lng":121.0167,"label":"Mt. Tiantai, Zhejiang, China (the mountain and monastery from which the school he founded takes its name)"}],["n3765","Tiantai zong",945,5,141,124,8094,0,-61,-140,["school"],"Tiantai zong. (\"Terrace of Heaven School.\") Major Chinese Buddhist school named for its headquarters on Mt. Tiantai in Zhejiang, given its systematic form by Zhiyi (538–597) around the Lotus Sūtra and the doctrine that a single thought-moment perfectly contains the entire cosmos. Zhiyi's \"three truths\" — emptiness, provisional reality, and the mean — and his claim that even hell-denizens possess buddha-nature became foundational across East Asia. Transmitted to Korea and, as Tendai, to Japan, where Mt. Hiei trained the founders of nearly every major Kamakura-era school before Tendai itself declined.",{"start":538,"end":597,"basis":"Zhiyi's dates, given directly as \"de facto founder\""},{"lat":29.1397,"lng":121.0064,"label":"Mt. Tiantai, Zhejiang, China (named directly in the entry)"}],["n3781","Tōdaiji",949,0,30,22,3616,0,190,-182,["place"],"Tōdaiji. (\"Great Monastery of the East.\") A monumental Nara-period monastery housing the Great Buddha of Vairocana, at forty-eight feet the largest gilt-bronze image in the world, enshrined within the largest wooden building on earth — a project so vast that its construction, according to monastery records, nearly bankrupted the country. Headquarters of a network of provincial monasteries across the Yamato region, it has been sacked and rebuilt repeatedly across the centuries, and its Shōsōin repository still preserves thousands of eighth-century treasures imported via the Silk Road, from Persian glassware to Indian harps.",{"start":747,"end":798,"basis":"renamed Tōdaiji in 747 when major construction began, with \"the complex... completed in 798\""},{"lat":34.6851,"lng":135.8048,"label":"Nara, Japan (named directly as the entry's subject)"}],["n3784","T’ongdosa",950,7,25,10,4489,0,116,-149,["place"],"T'ongdosa. Korea's \"buddha-jewel monastery,\" one of three representing the three jewels, founded by the vinaya master Chajang in 646 to enshrine relics and a robe he received from Mañjuśrī on pilgrimage at Wutaishan. Uniquely for a main shrine hall in Korea, its taeung chŏn contains no buddha image at all — instead a rear window looks out onto the Diamond Ordination Platform where the actual relics are enshrined — and generations of monks protected those relics through repeated Japanese invasions, hiding them in forests and even carrying them as far as the Diamond Mountains before finally restoring them to the monastery for good in 1603.",{"start":646,"end":646,"basis":"\"established by the vinaya master Chajang... in 646\""},{"lat":35.4919,"lng":129.0656,"label":"Yangsan, South Kyŏngsang Province, Korea (named directly as the entry's subject)"}],["n3803","trāyastriṃśa",954,6,47,39,2247,0,178,41,["concept"],"Trāyastriṃśa. (\"[Heaven] of the thirty-three.\") The second-lowest of the six sensuous-realm heavens, sitting atop Mount Sumeru and ruled by Śakra, king of the gods, presiding over thirty-two other male divinities in golden palaces with thirty-million-year lifespans. Here, in the seventh year after his enlightenment, the Buddha spent a rains retreat teaching the abhidharma to his deceased mother, later descending to earth on a jeweled ladder — and here Śakra is said to have enshrined a lock of hair Prince Siddhārtha cut off at his renunciation. Scholars note its thirty-three-god roster likely echoes the Ṛgveda's own pantheon, suggesting Buddhist cosmology absorbing pre-Buddhist Indian religion wholesale.",null,null],["n3810","trikāya",956,13,37,22,3304,0,-1,37,["concept"],"Trikāya. (\"Three bodies.\") Mahāyāna buddhology's central doctrine of a buddha's three aspects: the dharmakāya (\"truth body,\" originally just the sum of a buddha's virtuous qualities, later a transcendent cosmic principle), the saṃbhogakāya (\"enjoyment body,\" a resplendent form marked with the thirty-two signs, visible only to advanced bodhisattvas in a buddha-field), and the nirmāṇakāya (\"emanation body,\" the form that appears to ordinary beings in the world). The scheme resolved a real doctrinal puzzle — since the Buddha's physical body decayed and died, how could it serve as a genuine object of refuge? — by locating ultimate refuge instead in the imperishable body of qualities underlying it.",null,null],["n3811","trilakṣaṇa",956,1,29,20,786,0,-151,306,["concept"],"Trilakṣaṇa. (\"Three marks.\") Impermanence, suffering, and nonself — the three characteristics shared by everything conditioned within saṃsāra. Per the Visuddhimagga, genuinely realizing these three marks is itself what constitutes enlightenment, permanently dismantling belief in a perduring self and guaranteeing stream-entry, with full arhatship and nirvāṇa following within at most seven more lifetimes.",null,null],["n3815","tripiṭaka",957,5,74,62,2038,0,1,77,["concept","work"],"Tripiṭaka. (\"Three baskets.\") The standard organizing schema of the Buddhist canon — discourses (sūtrapiṭaka), monastic discipline (vinayapiṭaka), and scholastic analysis (abhidharmapiṭaka) — named for the baskets once used to store palm-leaf manuscripts. Each mainstream school kept its own version; only the Pāli recension survives complete in an Indian language. Mahāyāna sūtras were never organized under this scheme at all, though some later exegetes reinterpreted the three baskets figuratively, as corresponding to the three trainings in morality, meditation, and wisdom.",null,null],["n3819","triśikṣā",958,1,30,22,1354,0,-36,207,["concept"],"Triśikṣā. (\"Three trainings.\") Morality, concentration, and wisdom — the three overarching categories into which the entire noble eightfold path is traditionally sorted, with wisdom training covering right view and intention, morality training covering right speech, action, and livelihood, and concentration training covering right effort, mindfulness, and concentration itself. Morality lays the necessary foundation on which the subsequent cultivation of concentration and wisdom depends.",null,null],["n3821","trisvabhāva",958,5,31,29,1588,0,-302,86,["concept"],"Trisvabhāva. (\"Three natures.\") A central Yogācāra doctrine describing all phenomena through three lenses: the imaginary nature, the false appearance of objects as distinct from the consciousness perceiving them; the dependent nature, their real dependence on causes and conditions (ultimately, seeds within the storehouse consciousness); and the consummate nature, the nonduality between consciousness and its objects once the imaginary overlay is removed. In short: the consummate nature is simply the dependent nature once its imaginary distortion has been stripped away.",null,null],["n3826","triyāna",959,5,33,19,1555,0,-150,-21,["concept"],"Triyāna. (\"Three vehicles.\") Either the śrāvaka, pratyekabuddha, and bodhisattva paths, or the broader hīnayāna-mahāyāna-vajrayāna scheme — with the Lotus Sūtra famously declaring the first triad merely provisional, expedient devices concealing a single true vehicle to buddhahood for everyone. Whether the three vehicles are genuinely three separate, permanent endpoints or ultimately just one became a real dividing line in Mahāyāna philosophy, with Yogācāra and Faxiang defending three final destinations against Madhyamaka and Tiantai's insistence on a single, universal one.",null,null],["n3840","Tsong kha pa Blo bzang grags pa",962,3,35,10,4023,0,-241,-109,["person"],"Tsong kha pa Blo bzang grags pa. (1357–1419.) Founder of the Dge lugs sect, trained across Bka' gdams, Sa skya, and other traditions before settling on Prāsaṅgika-Madhyamaka as Buddhism's highest philosophical view, guided in his own account by recurring visions of Nāgārjuna, Buddhapālita, and the bodhisattva Mañjuśrī. His four signature achievements — restoring a Maitreya image, convening a vinaya reform council, inaugurating the Great Prayer Festival at the Jo khang, and founding Dga' ldan monastery in 1409 — anchor a legacy as one of Tibet's most systematic philosophers, author of eighteen volumes including the monumental Lam rim chen mo.",{"start":1357,"end":1419,"basis":"\"(1357–1419)\", given directly"},{"lat":29.75,"lng":91.475,"label":"Dga' ldan monastery, near Lhasa, Tibet (founded by him in 1409, seat of the Dge lugs sect)"}],["n3844","tuṣita",963,2,37,34,1188,0,21,43,["concept"],"Tuṣita. (\"Contentment.\") The fourth of six sensuous-realm heavens, distinguished as the waiting place for bodhisattvas destined for their final rebirth and buddhahood — it was from here that the future Śākyamuni descended into his mother's womb, and here that Maitreya currently resides awaiting his own turn. A single day in Tuṣita equals four hundred earth years, and countless Buddhists across history have aspired to rebirth there simply for the chance to study directly under Maitreya before accompanying him back to earth.",null,null],["n3884","Upagupta",972,7,24,12,1768,0,123,4,["person"],"Upagupta. An Indian arhat unknown to Pāli canonical sources but prominent in Sanskrit avadāna literature, famed for taming Māra by hanging a garland of corpses around his neck, and later invited by Aśoka to personally tour him around the great Buddhist pilgrimage sites. Listed as the fifth Indian patriarch in Sarvāstivāda sources (fourth in the Chan tradition's count), his cult became especially prominent in Southeast Asian and Burmese Buddhism, where he is believed to reside in a southern-ocean pavilion and is ritually invited ashore to ward off Māra's interference.",{"start":-268,"end":-232,"basis":"invited to Pāṭaliputra by King Aśoka, \"(r. c. 268–232 BCE)\" per the Aśoka entry"},{"lat":27.4924,"lng":77.6737,"label":"Mathurā, India (named directly as where he lived)"}],["n3895","upāsaka",974,2,25,19,1115,0,216,211,["concept"],"Upāsaka. (\"[Male] lay disciple.\") A layman formally committed to Buddhism through the three refuges and five basic precepts, permanently binding, supplemented on full- and new-moon fasting days by three further precepts — no eating after midday, no entertainment or adornment, no luxurious beds — that together make eight, with celibacy substituting for the usual sexual-conduct precept on those specific days.",null,null],["n3897","upasaṃpadā",974,2,42,35,2899,0,264,184,["concept"],"Upasaṃpadā. (\"Higher ordination.\") The ceremony admitting a novice into full monkhood or nunhood, requiring a candidate of at least twenty, a qualified preceptor of ten years' standing, and an assembly of at least ten (or five, outside India) monks convened within a consecrated boundary. After three formal requests and a round of disqualifying questions, silence from the assembly signals approval; women additionally undergo a double ordination, first before the order of nuns and then before the order of monks. A lengthy list of disqualifying conditions — from criminal record to physical disability — governs who may be admitted at all.",null,null],["n3902","upāya",975,1,51,45,1023,0,-93,-4,["concept"],"Upāya. (\"Method\" or \"stratagem.\") One of the two essential components of the bodhisattva path alongside wisdom — the active deeds performed on behalf of all beings, said to fructify as a buddha's form-body just as wisdom fructifies as the dharma-body. In tantra, method is gendered male against wisdom's female, and the superiority of the esoteric vajrayāna over the exoteric path is explained by the sheer sophistication of its methods compared to those the sūtras offer.",null,null],["n3905","upekṣā",976,1,32,27,1509,0,-57,259,["concept"],"Upekṣā. (\"Equanimity.\") A term spanning neutral sensation, a virtuous mental factor of undisturbed evenness, a balanced state during concentration practice free of both lethargy and excitement, and — most prominently — the fourth of the four divine abidings, an even-minded regard toward all beings without attachment or aversion. Uniquely among the four divine abidings, equanimity alone can produce all four levels of meditative absorption, where loving-kindness, compassion, and sympathetic joy each top out at the third.",null,null],["n3907","upoṣadha",976,2,42,38,2463,0,219,228,["concept"],"Upoṣadha. A fortnightly monastic observance, held on the new and full moon, in which the community assembles to confess faults and recite the prātimokṣa code — a practice of pre-Buddhist origin, likely adapted from other Indian ascetic movements, originally tied to fasting before a Vedic sacrifice. Only four or more monks trigger a full recitation; laypeople often mark the day by voluntarily taking eight precepts that temporarily turn them into monks or nuns for the day, while a long list of disqualified categories of people may not even be present at a monk's version of the ceremony.",null,null],["n3924","Vaibhāṣika",981,1,77,69,1834,0,-218,209,["school"],"Vaibhāṣika. (\"Followers of the Vibhāṣā.\") The Sarvāstivāda abhidharma specialists of Kashmir-Gandhāra and Bactria, named for their allegiance to the school's massive encyclopedic treatise, the Abhidharmamahāvibhāṣā — which they held to be the Buddha's own word, its dialogic structure explained by divine interlocutors he summoned for the occasion. Maintained that all seventy-five constituent factors of reality are both real and eternal, enduring across past, present, and future — a position so committal that a rival faction split off entirely, calling itself Sautrāntika, \"those who adhere to the sūtras instead.\"",null,{"lat":34.0837,"lng":74.7973,"label":"Kashmir (Srinagar placeholder) — named as where the school was especially based"}],["n3930","Vairocana",982,0,98,72,5410,0,-5,-107,["deity"],"Vairocana. (\"Resplendent.\") Central buddha of the Avataṃsakasūtra and Huayan tradition, personifying the dharmakāya and the universal truth that every phenomenon interpenetrates every other. Originates as a minor solar deity in the Hindu tradition before being absorbed into Buddhism; became one of East Asian Buddhism's principal buddhas as the Avataṃsakasūtra's popularity grew, with colossal images erected at the Longmen Grottoes near Luoyang and at Tōdaiji in Nara. Also central to esoteric Buddhism as the axis of the vajradhātu and garbhadhātu maṇḍalas — though there he is often conflated with the distinct, if closely related, Mahāvairocana.",null,null],["n3932","Vaiśālī",983,2,34,26,2603,0,173,201,["place"],"Vaiśālī. Capital of the Licchavi confederacy, visited repeatedly by the Buddha, who accepted a mango grove from the courtesan Āmrapālī and, on the road here from Kapilavastu, granted his stepmother Mahāprajāpatī's request that founded the order of nuns. Also the site of the pivotal second Buddhist council roughly a century after the Buddha's death, convened after the monk Yaśas accused local monks of ten vinaya violations — a dispute that split the saṃgha into the Sthaviranikāya and Mahāsāṃghika and set in motion the eventual fracturing into eighteen mainstream schools.",{"start":-524,"end":-380,"basis":"period spanning the Buddha's ministry-era visits through the second Buddhist council held there \"approximately one hundred years after the Buddha's parinirvāṇa\" (chronology convention)"},{"lat":26.0281,"lng":85.1214,"label":"Vaiśālī, Bihar, India (named directly as the entry's subject)"}],["n3938","vajra",985,0,34,28,1465,0,-38,-139,["concept"],"Vajra. (\"Adamant,\" \"diamond,\" or \"thunderbolt.\") A symbol of indestructibility central enough to tantric Buddhism to name the entire vajrayāna, and also the ritual scepter paired with a bell in tantric liturgy — vajra for method held in the right hand, bell for wisdom in the left. A five-pointed vajra carries dense symbolic freight: its five lower points represent either the five aggregates or five afflictions, transmuted through practice into the five buddhas represented by its five upper points, with the connecting sphere symbolizing the emptiness that unites them.",null,null],["n3942","Vajracchedikāprajñāpāramitāsūtra",986,5,42,19,5761,0,-44,49,["work"],"Vajracchedikāprajñāpāramitāsūtra. (\"Diamond Sūtra.\") One of Mahāyāna Buddhism's most famous and commented-upon texts, staging a dialogue between the Buddha and the arhat Subhūti that repeatedly collapses ordinary categories — \"A is in fact not A, therefore it is called A\" — to argue that even a bodhisattva's most generous act is worthless if tainted by any residual notion of self, giver, or recipient. Its self-promoting claim that reciting even four lines earns incalculable merit helped fuel what scholars call a \"cult of the book,\" evidenced by the world's earliest dated printed text — an 868 CE Dunhuang copy — and a monumental rock carving on Mt. Tai; in Chan legend, it was hearing this very sūtra that triggered Huineng's enlightenment.",{"start":100,"end":400,"basis":"\"composed in Sanskrit, probably sometime between the second and fourth centuries CE\""},null],["n3944","Vajradhara",987,3,24,8,1572,0,-183,-202,["deity"],"Vajradhara. (\"Vajra Holder.\") A primordial buddha of the tantric systems, closely identified with (and possibly originally identical to) Vajrapāṇi, and the principal deity of the mahāmudrā lineage he is said to have revealed to Tilopa, transmitted onward through Nāropa and Mar pa to Mi la ras pa. Regarded in Tibet as the primordial buddha of the three \"new\" tantric sects — Sa skya, Bka' brgyud, and Dge lugs — alongside Samantabhadra, the separate primordial buddha of the Rnying ma sect.",null,null],["n3948","vajrakula",988,0,24,13,1089,0,-3,-77,["concept"],"Vajrakula. (\"Vajra family\" or \"vajra lineage.\") One of tantric Buddhism's classificatory lineages — three in earlier systems (vajra, lotus, buddha families) or five in later anuttarayogatantra schemes (adding jewel and action families) — each linked to its own buddha, aggregate, wisdom, root affliction, element, and color. The vajra family itself is headed by Akṣobhya or Vajrasattva and corresponds to the consciousness aggregate, mirror-like wisdom, the affliction of anger, the element water, and the color white.",null,null],["n3949","Vajrapāṇi",988,0,43,25,3928,0,69,-90,["deity"],"Vajrapāṇi. (\"Holder of the Vajra.\") A bodhisattva who began as a lowly yakṣa bodyguard of the Buddha in Pāli sources — tasked with splitting open the skull of anyone who thrice refused to answer the Buddha's questions — before rising through Mahāyāna and tantric literature to become a principal bodhisattva and, alongside Avalokiteśvara and Mañjuśrī, one of the \"protectors of the three families\" embodying compassion, wisdom, and power. His signature narrative has him subjugating the god Śiva at Vairocana's command, killing him with a mantra only to ensure his rebirth and eventual buddhahood — the template for how fearsome pre-Buddhist deities get absorbed wholesale into the Buddhist pantheon.",null,null],["n3953","Vajrasattva",989,0,27,14,2363,0,-19,-171,["deity"],"Vajrasattva. (\"Vajra Being.\") A tantric deity of purification worshipped as a primordial buddha, sometimes counted as a sixth member of or substitute within the five-buddha system, and identified with both Vajrapāṇi and Vajradhara depending on context. East Asian esoteric Buddhism casts him as the second patriarch of its teaching lineage, receiving the doctrine directly from Vairocana before passing it down through Nāgārjuna to the tradition's later transmitters; in Tibet, reciting his hundred-syllable mantra one hundred thousand times is a standard preliminary purification practice required before any tantric instruction can be received.",null,null],["n3957","vajrayāna",990,0,35,33,882,0,-12,-128,["concept"],"Vajrayāna. (\"Adamantine\" or \"thunderbolt vehicle.\") The general term for tantric Buddhism, understood by its own practitioners not as a rival to the Mahāyāna but as its esoteric complement — the exoteric pāramitāyāna of the sūtras and the esoteric vajrayāna of the tantras forming two routes to the same bodhisattva goal. The name evokes the vajra's unbreakable, indivisible quality, typically applied to the inseparable union of method and wisdom that vajrayāna practice is built around.",null,null],["n3975","varṣā",993,2,33,32,2181,0,251,196,["concept"],"Varṣā. (\"Rains retreat.\") A mandatory three-month period of fixed monastic residence during the monsoon, originally intended to spare insects and worms from being trampled on muddy roads, though likely adapted from a wider ascetic practice already current among rival Indian śramaṇa sects. The requirement to stay put for months at a time is credited with directly spurring the rise of permanent monasteries, and monastic seniority itself is measured in the number of rains retreats completed — with breaking the retreat disqualifying a monk from the robe-donation ceremony that traditionally marks its end.",null,null],["n3981","Vasubandhu",994,5,87,64,4559,0,-189,61,["person"],"Vasubandhu. (c. 4th–5th century CE.) Born in Puruṣapura, Gandhāra (modern Peshawar) — one of Buddhism's most consequential authors, and the only major figure to shape both the mainstream schools and the Mahāyāna. Composed the Abhidharmakośa from within Sarvāstivāda-Vaibhāṣika orthodoxy, then critiqued it from a Sautrāntika angle in his own prose commentary. Converted to Mahāyāna after encountering his half-brother Asaṅga, becoming a foundational Yogācāra author whose Triṃśikā underlies Xuanzang's massive Chengweishi lun — the root text of the Chinese Faxiang school.",{"start":350,"end":450,"basis":"\"most scholars placing him in the fourth or fifth century CE\""},{"lat":34.0151,"lng":71.5249,"label":"Peshawar, Pakistan (ancient Puruṣapura, Gandhāra — named directly in the entry)"}],["n3989","vedanā",997,1,37,35,1218,0,-189,347,["concept"],"Vedanā. (\"Sensation\" or \"feeling.\") The pleasurable, painful, or neutral quality accompanying every moment of sensory consciousness, present universally in the mind according to every major abhidharma system. As the second of the five aggregates and seventh link of dependent origination, it occupies a pivotal causal position — sensation is what conditions craving, making \"contemplation of sensations\" the second of the four foundations of mindfulness and a direct point of intervention in the chain that otherwise runs on to suffering.",null,null],["n3995","Vibhaṅga",999,1,27,5,2234,0,-26,286,["work"],"Vibhaṅga. (\"Analysis.\") The second book of the Pāli abhidhamma canon, often treated as a supplement to the first book, the Dhammasaṅgaṇī, though it applies its own distinct analytical methods across eighteen self-contained chapters covering topics from the aggregates and sense bases to the eightfold path and meditative absorption. Most chapters follow a three-part structure — sutta-style analysis, technical abhidharma categorization, then a closing catechism of questions — and the text's most influential commentary, Buddhaghosa's Sammohavinodanī, was written in the fifth century.",null,null],["n3998","vicikitsā",1000,1,41,30,1390,0,-115,273,["concept"],"Vicikitsā. (\"Doubt\" or \"skepticism.\") A root affliction across every major abhidharma system, appearing on the standard lists of fetters and hindrances alike — a paralyzing \"two-pointedness of mind\" that leaves a person unable to act virtuously, likened to trying to sew with a two-pronged needle. Countered by wisdom and scriptural study, it is only temporarily suppressed by meditative absorption but permanently uprooted the moment one becomes a stream-enterer.",null,null],["n4006","vihāra",1001,2,25,22,2019,0,212,100,["concept"],"Vihāra. (\"Abode\" — monastery.) The dwelling place that formal monasticism grew out of once the Buddha instructed wandering monks to settle in one place during the rains retreat to avoid trampling insects on muddy roads — a practical rule that snowballed into the entire institution of permanent monastic residence. Vinaya regulations govern everything from a vihāra's layout (rooms arranged around a courtyard typically holding a Bodhi tree sapling or stūpa) to its permanence as saṃgha property once donated, which can never be reclaimed; the Indian state of Bihar takes its very name from the many vihāras once scattered across the region.",null,null],["n4009","vijñāna",1001,1,79,74,1762,0,-237,224,["concept"],"Vijñāna. (\"Consciousness.\") Technically, the six types of sensory consciousness — eye, ear, nose, tongue, body, and mind — that constitute the fifth of the five aggregates and give the observable universe its knowability. Most schools accept exactly six; Yogācāra adds two more, an afflicted mentality that mistakenly generates the sense of self, and a foundational storehouse consciousness beneath it. Each form of consciousness arises dependent on three conditions, tying vijñāna directly into the broader Buddhist analysis of causation.",null,null],["n4016","vikalpa",1003,1,39,14,4507,0,-250,137,["concept"],"Vikalpa. (\"[False] discrimination\" or \"conception.\") The mind's conceptualizing activity, generally cast negatively as fantasy or imaginative proliferation and contrasted with the immediate, unmediated knowledge of direct perception. Traditions disagree sharply on its value: some treat structured conceptual analysis as a necessary stepping-stone toward a nonconceptual goal, while Chan's \"sudden\" approach holds thought-free awareness to be accessible at any moment without passing through concepts first. Yogācāra locates its deepest form in the false split between a perceiving subject and perceived object — a bifurcation gradually dissolved, moving from coarser to subtler levels, on the way to the nonconceptual wisdom that opens the path of vision.",null,null],["n4021","Vimalakīrtinirdeśa",1004,5,35,30,2734,0,-95,-57,["work"],"Vimalakīrtinirdeśa. (\"Vimalakīrti's Instructions.\") A beloved Mahāyāna sūtra whose protagonist, unusually, is a layman — the Buddha's leading monastic and bodhisattva disciples alike all decline to visit the ailing Vimalakīrti, each recalling a past encounter in which he humbled them. Famous for its climactic teaching on nonduality, delivered through Vimalakīrti's eloquent silence after a series of bodhisattvas fail to adequately describe it in words, and for a scene where a goddess transforms the wise monk Śāriputra into a woman to puncture his conceptual attachments — its original Sanskrit, lost for over a thousand years, resurfaced only in 2001 inside the Potala Palace.",{"start":100,"end":200,"basis":"\"probably dates from around the second century CE\""},null],["n4026","vimokṣa",1005,1,47,33,2125,0,-106,233,["concept"],"Vimokṣa. (\"Liberation\" or \"deliverance.\") Freedom from rebirth achieved via the śrāvaka, pratyekabuddha, or bodhisattva paths, classically reached through one of three \"doors\": emptiness, signlessness, or wishlessness. A separate scheme of eight graded liberations tracks increasingly refined states of meditative absorption, moving from perceiving material form, through the four formless-realm attainments of infinite space, infinite consciousness, nothingness, and neither-perception-nor-nonperception, to the final cessation of consciousness itself — with Mahāyāna abhidharma reinterpreting the earlier stages as a bodhisattva's tool for manifesting different forms to help other beings.",null,null],["n4029","viṃśatiprabhedasaṃgha",1006,1,43,30,2549,0,-24,377,["concept"],"Viṃśatiprabhedasaṃgha. (\"Twenty varieties of the saṃgha.\") A finely graded subdivision of the eight noble persons into twenty, sorting practitioners by faculty and by the specific manner in which each reaches nirvāṇa — those who \"enter\" versus those who \"abide\" in each of the four fruits from stream-enterer to arhat. Later Mahāyāna commentators, especially in the perfection of wisdom literature, used this same twenty-fold template as scaffolding to classify as many as forty-eight distinct grades of noble bodhisattva.",null,null],["n4033","vinaya",1007,2,240,235,4406,0,111,55,["school","concept","work"],"Vinaya. (\"Discipline.\") The corpus of monastic regulations for fully ordained monks and nuns, and the canonical texts that record them — one of the three baskets of the Buddhist canon. Five major recensions descend from disciples of the Buddha's fifth successor Upagupta; only the Pāli version survives complete in an Indian language, while the massive Mūlasarvāstivāda recension — four times longer than the rest — survives complete only in Tibetan. Each rule is traditionally said to have been formulated only after an actual infraction occurred.",{"start":-380,"end":-380,"basis":"Upagupta, whose five disciples produced the five vinaya recensions, was \"the fifth successor... about a century following [the Buddha's] death\""},{"lat":25.61,"lng":85.14,"label":"India (general placeholder — Magadha; Upagupta traditionally linked to Mathurā, but that's outside this entry's own text, so flagged as uncertain rather than asserted)"}],["n4034","vinayapiṭaka",1008,2,46,30,5482,0,148,150,["concept","work"],"Vinayapiṭaka. (\"Basket of discipline.\") One of the three divisions of the canon, and a far richer historical source than its reputation as mere monastic rulebook suggests — since each rule is narratively framed by the specific misconduct that prompted the Buddha to institute it, the vinaya doubles as some of Buddhism's earliest narrative literature. There is no single vinayapiṭaka but many, one per mainstream school, with disputes over correct monastic conduct a major force behind the historical fracturing into eighteen schools; when Ānanda failed to ask the dying Buddha which minor rules could later be dropped, the first council resolved simply to keep them all.",{"start":0,"end":100,"basis":"the Pāli vinayapiṭaka \"perhaps redacted around the first century CE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Anurādhapura placeholder — where the Pāli canon was redacted and committed to writing)"}],["n4046","vipassanā",1011,1,41,19,3167,0,-51,318,["concept"],"Vipassanā. The Pāli counterpart of Sanskrit vipaśyanā — direct insight into impermanence, suffering, and nonself, paired with calm (samatha) as Buddhist meditation's two complementary wings. The Visuddhimagga catalogues eighteen distinct types of insight-knowledge, from basic recognition of impermanence to a final \"turning away\" from conditioned existence; the popular lay vipassanā movements taught worldwide today, including the lineages descending from the Thai forest tradition and from S. N. Goenka, are modern nineteenth- and twentieth-century Burmese constructions, not ancient unbroken practices, even though they draw on genuine scriptural and commentarial precedent.",null,null],["n4051","vipaśyanā",1012,1,60,56,580,0,-141,125,["concept"],"Vipaśyanā. (\"Insight.\") An understanding of reality, conceptual or nonconceptual, sustained at a level of mental concentration equal to or exceeding śamatha — the feature that distinguishes the wisdom born of meditation from mere calm. This insight is what actually destroys the afflictions and opens the path to liberation from rebirth; calmness alone, however deep, cannot do it.",null,null],["n4066","viśuddhi",1015,1,36,26,1975,0,-101,394,["concept"],"Viśuddhi. (\"Purity.\") Distinguished into innate purity — the mind's natural luminosity, present from the start — and purity achieved by clearing away adventitious defilements through practice. Pāli tradition maps a sequence of seven such purities, from morality through mental purification, correct views, and overcoming doubt, to the final purity of knowledge and vision that yields liberation — a structure detailed enough that it supplies the entire outline for Buddhaghosa's Visuddhimagga.",null,null],["n4067","Visuddhimagga",1015,1,76,67,2016,0,0,301,["work"],"Visuddhimagga. (\"Path of Purity.\") Buddhaghosa's fifth-century compendium of Theravāda doctrine and practice, composed at the Mahāvihāra monastery in Anurādhapura, Sri Lanka, and organized around the three trainings of morality, concentration, and wisdom. Legend holds the monks tested him by having him write a commentary from scratch three times, after gods repeatedly hid the manuscript — all three versions came out word-for-word identical. Remains the closest Pāli equivalent to the Sarvāstivāda's own encyclopedic Abhidharmamahāvibhāṣā.",{"start":400,"end":500,"basis":"\"written by the exegete Buddhaghosa... in the fifth century CE\""},{"lat":8.3114,"lng":80.4037,"label":"Anurādhapura, Sri Lanka (Mahāvihāra — named directly in the entry)"}],["n4079","vyāpāda",1017,1,28,28,116,0,-161,149,["concept"],"Vyāpāda. (\"Malice\" or \"ill will.\") Ninth of the ten unwholesome courses of action (alongside killing, stealing, lying, and the rest), and elsewhere in Buddhist literature also counted among the five hindrances to meditative absorption, where it specifically blocks the physical rapture that absorption depends on. Its standard counteragent is the cultivation of loving-kindness, the divine abiding whose deliberate radiating outward is meant to directly dissolve ill will at its root.",null,null],["n4136","wu",1031,7,31,19,2219,0,-88,-254,["concept"],"Wu. (\"Awakening\" — a common Chinese rendering of bodhi, familiar in English via its Japanese pronunciation, satori.) Most associated in East Asia with Chan's \"sudden awakening,\" the view that the mind's buddha-nature is already complete and needs no gradual purification to be realized, against a rival \"gradual awakening\" model requiring lifetimes of purifying practice. Guifeng Zongmi and Pojo Chinul refined this into a two-stage model — an initial sudden understanding-awakening that one is already a buddha, followed by gradual cultivation, culminating in a final realization-awakening where one can fully act as one — a debate with real precedent outside East Asia in Tibet's own Bsam yas debate over gradual versus sudden enlightenment.",null,null],["n4142","wu jia qi zong",1033,7,27,18,1654,0,4,-377,["concept"],"Wu jia qi zong. (\"Five houses and seven schools.\") The traditional map of mature Chan's institutional development, tracing five \"houses\" — Guiyang, Linji, Caodong, Yunmen, and Fayan — back to the two great disciples of Huineng, Nanyue Huairang and Qingyuan Xingsi. The Linji house later split during the Song dynasty into the Huanglong and Yangqi lineages, whose addition to the original five produces the full count of \"seven schools\" — a framework historian Guifeng Zongmi traced back further still to earlier lineages eventually eclipsed by these flourishing later houses.",null,null],["n4149","wushi",1036,5,26,6,2471,0,-111,-64,["concept"],"Wushi. (\"Five periods.\") Tiantai's chronological classification of the Buddha's teaching career, explaining doctrinal inconsistency across scriptures by assigning each text to a stage in a deliberate pedagogical arc: the sublime but incomprehensible Avataṃsakasūtra immediately after enlightenment, simplified āgama teachings at the Deer Park to accommodate confused disciples, intermediate Mahāyāna-favoring vaipulya sūtras, the boundary-dissolving prajñāpāramitā literature, and finally the Lotus Sūtra and Nirvāṇa Sūtra as the \"consummate\" teaching revealing the Buddha's truest intention — a progression Tiantai further likened to the successive stages of refining milk into ghee.",null,null],["n4151","Wutaishan",1036,0,38,26,2632,0,52,-97,["place"],"Wutaishan. (\"Five-Terraces Mountain.\") One of China's four great Buddhist mountains, identified since the Northern Wei dynasty with the Avataṃsakasūtra's Mt. Qingliang, the perpetual preaching-ground of the bodhisattva Mañjuśrī — a status that drew pilgrims from across Asia, including Tibet and Korea, whose own Mt. Odaesan is named as its direct analogue. Home to China's first monastery, reputedly founded in the first century CE, and later a major center for Huayan studies under Chengguan and for Tang-dynasty esoteric Buddhism under Amoghavajra, it remained an important hub for Tibetan Buddhism in China as late as the Qing dynasty.",{"start":424,"end":532,"basis":"identified with the Avataṃsakasūtra's Mt. Qingliang \"during the Northern Wei dynasty (424–532)\""},{"lat":39.0175,"lng":113.5978,"label":"Wutaishan, Shanxi, China (named directly as the entry's subject)"}],["n4197","Xuanzang",1048,5,114,98,5254,0,-64,67,["person"],"Xuanzang. (600/602–664 CE.) Chinese monk and pilgrim who, defying an imperial travel ban, journeyed the Silk Road to India in 627, studied Sanskrit and Yogācāra for years at Nālandā, and returned to Chang'an in 645 with over six hundred manuscripts. Directed an eighteen-year imperial translation bureau that produced seventy-six works in 1,347 rolls — nearly four times Kumārajīva's output — inaugurating Chinese Buddhism's rigorously philological \"new translation\" era. Patriarch of the Chinese Yogācāra (Faxiang) school; his pagoda, the Dayan Ta, still stands in Xi'an.",{"start":602,"end":664,"basis":"given directly in the entry"},{"lat":34.27,"lng":108.95,"label":"Chang'an (Xi'an), China — named directly as where he built the Dayan Ta pagoda"}],["n4206","yakṣa",1051,6,35,32,960,0,199,-27,["concept"],"Yakṣa. A class of nature spirits guarding the earth, trees, and buried treasure, wielding powers of flight, shapeshifting, and invisibility for good or ill. Often benevolent protectors of the Buddha and his community — Vajrapāṇi, his personal bodyguard, is the most famous example — yakṣas also have a fearsome female counterpart, the corpse- and infant-devouring yakṣiṇī, who required subjugation by a buddha, arhat, or bodhisattva; Sri Lanka and the mythical continent of Uttarakuru were both considered their traditional homelands.",null,null],["n4209","Yama",1051,6,30,21,1438,0,30,-50,["deity"],"Yama. Lord of death and king of hell, whose messengers — birth, old age, sickness, and punishment — are sent among the living as reminders to abstain from wrongdoing. Though karma is supposed to operate as an impersonal natural law needing no judge, Indian sources nonetheless cast Yama as an active interrogator of the dead, a role China expanded dramatically into an entire bureaucratic underworld of ten infernal courts, each presided over by one of the \"ten kings of hell\" — a system detailed in the indigenous Chinese apocryphon devoted to them.",null,null],["n4214","Yamāntaka",1053,3,25,12,3282,0,-250,-85,["deity"],"Yamāntaka. (\"Destroyer of Death.\") One of the Dge lugs sect's three principal tantric deities, a fully enlightened buddha who appears exclusively in wrathful form — by legend, the bodhisattva Mañjuśrī's own transformation into a terrifying bull-headed figure in order to defeat Yama, Lord of Death, who was ravaging the land. His nine heads, thirty-four arms, and sixteen legs are each loaded with symbolic meaning, mapping onto everything from the two truths of Madhyamaka to the thirty-seven factors of enlightenment to the sixteen forms of emptiness, and his three root tantras — Black, Red, and the \"Three Summaries\" — define the three main Tibetan variants of his practice.",null,null],["n4215","yāna",1053,5,24,6,2156,0,-159,-7,["concept"],"Yāna. (\"Vehicle\" or \"conveyance.\") A literal term for transportation repurposed by Mahāyāna literature into a defining metaphor for the entire tradition — a mode of conveyance along the path to enlightenment, sorted polemically into two or three rival vehicles (bodhisattva, pratyekabuddha, śrāvaka; or simply Mahāyāna versus the dismissively named Hīnayāna). The Lotus Sūtra's parable of the burning house, where a father promises three different carriages but delivers only one magnificent one, remains yāna-rhetoric's most celebrated expression; tantric Buddhism later split the Mahāyāna itself into the sūtra-based \"perfection vehicle\" and the tantra-based \"mantra vehicle,\" better known as the vajrayāna.",null,null],["n4219","Yangqi pai",1054,7,31,13,3003,0,38,-431,["school"],"Yangqi pai. One of the two major branches of the Linji Chan lineage, rising to dominance in Song-dynasty Buddhism through Yuanwu Keqin and especially his disciple Dahui Zonggao, who championed kanhua Chan and turned gong'an practice into a tool for realizing innate enlightenment rather than an exercise in literary cleverness — pointedly criticizing rival \"lettered Chan\" stylists for prizing elegant repartee over genuine breakthrough. Transmitted to Korea by T'aego Pou and to Japan in the thirteenth century, the lineage remains the sole ancestor of every Linji tradition practiced in Japan today.",{"start":995,"end":1049,"basis":"founder Yangqi Fanghui's dates, \"(995–1049)\""},{"lat":27.8,"lng":114.4,"label":"Mt. Yangqi, Yuanzhou, China (named directly as the founder's teaching base)"}],["n4249","Yijing",1061,5,28,18,1976,0,-1,-18,["person"],"Yijing. (635–713.) A Chinese pilgrim inspired by Faxian and Xuanzang, who sailed to India by the southern sea route in 671, studied a decade at Nālandā, then spent roughly thirty years based in Śrīvijaya (Palembang), composing his invaluable travel record and beginning his massive translation of the Mūlasarvāstivāda vinaya. Returning to China in 695 with some four hundred Sanskrit manuscripts and relics, he was welcomed by Empress Wu Zetian and spent his remaining years translating Yogācāra texts and tantras, as well as compiling biographies of fellow East Asian pilgrims to India.",{"start":635,"end":713,"basis":"\"(635–713)\", given directly"},{"lat":-2.9761,"lng":104.7754,"label":"Śrīvijaya (Palembang, Sumatra) — where he composed his travel record and translated for decades"}],["n4268","Yogācāra",1066,5,278,255,5520,0,-213,124,["school"],"Yogācāra. (\"Practice of yoga.\") One of the two great Mahāyāna philosophical schools of India, alongside Madhyamaka — founded in the fourth to fifth century CE by the half-brothers Asaṅga and Vasubandhu. Teaches that experience is \"representation-only\": what seems like an external world is produced by a foundational storehouse consciousness carrying the imprints of past action. Liberation reprograms this consciousness into a buddha's mirrorlike wisdom. Widely influential in Tibet and East Asia, shaping Huayan and even Chan.",{"start":400,"end":500,"basis":"\"Indian scholastics of the fourth to fifth centuries CE\" (Asaṅga and Vasubandhu)"},{"lat":25.61,"lng":85.14,"label":"India (general placeholder — Magadha; entry says \"in India\" but names no city)"}],["n4269","Yogācārabhūmiśāstra",1067,5,42,28,2388,0,-174,108,["work"],"Yogācārabhūmiśāstra. (\"Treatise on the Stages of Yogic Practice.\") The encyclopedic master treatise of Indian Yogācāra, traditionally credited to Asaṅga though likely a multi-author compilation, structured in five sections covering the entire path across all three vehicles. Its longest section on the \"multiple stages\" includes two of Buddhist literature's most influential standalone texts, the Śrāvakabhūmi and Bodhisattvabhūmi, and its later sections work syst
