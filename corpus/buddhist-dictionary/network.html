\"essence\" underlying both nirvāṇa and saṃsāra was later adapted and popularized by the Huayan patriarch Fazang.",{"start":523,"end":592,"basis":"\"(523–592)\", given directly"},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (site of Daxingshansi and his own toponym monastery Jingyingsi)"}],["n1642","jñāna",428,0,54,34,1965,0,-106,40,["concept"],"Jñāna. (\"Gnosis,\" \"knowledge,\" or \"understanding.\") A cognitive grasp of an object's specific nature, following perception and related to but more general than perfected wisdom (prajñā) — jñāna covers the ordinary knowledge proper to a śrāvaka, pratyekabuddha, or buddha alike. Yogācāra maps four or five such knowledges onto transformations of the eight consciousnesses upon enlightenment: mirror-like knowledge, the knowledge of equality, discerning knowledge, the knowledge that one's task is done, and the knowledge of the dharma-realm's true nature — each in turn personified as one of the five buddha-families.",null,null],["n1643","jñānadarśana",429,1,26,5,1957,0,-132,207,["concept"],"Jñānadarśana. (\"Knowledge and vision.\") Direct insight into impermanence, suffering, and nonself, marking the culmination of a stock meditative sequence: having suffused the mind with concentration and purity through the four absorptions, the meditator turns toward this vision, recognizes the self as merely a physical body bound to a dependent mentality, releases attachment to both, and thereby gains the knowledge of freedom from further rebirth. In Mahāyāna usage, the \"perfection of knowledge and vision\" serves as an alternate name for the perfection of wisdom itself.",null,null],["n1649","Jñānaprasthāna",430,1,47,17,4444,0,-100,284,["work"],"Jñānaprasthāna. (\"Foundations of Knowledge.\") The central canonical text of Sarvāstivāda abhidharma, attributed to Kātyāyanīputra, around which the school's six other treatises are organized as supporting \"feet.\" Its systematic eight-section structure — covering afflictions, knowledge, karma, elements, faculties, meditative absorption, and vision — set out doctrines that came to define mature Sarvāstivāda, including the claim that factors exist across all three time periods, and later drew a massive commentary, the Abhidharmamahāvibhāṣā, whose adherents named themselves \"Vaibhāṣika\" after it. Distinctively focused on advanced stages of the path rather than the preliminary ethical training emphasized in Pāli abhidhamma.",{"start":-50,"end":-1,"basis":"\"probably composed around the last half of the first-century BCE\""},null],["n1659","Jōdo Shinshū",432,0,51,40,3404,0,236,-134,["school"],"Jōdo Shinshū. (\"True Pure Land school.\") The tradition founded on the teachings of Shinran, distinguished from earlier Jōdoshū by permitting clergy to marry and eat meat, and by teaching complete reliance on Amitābha's grace rather than one's own effort — Shinran held that a single sincere invocation of Amitābha's name sufficed, against rivals who urged continuous recitation. Consolidated under the monastery Honganji, particularly through Rennyo's leadership in the fifteenth century, before splitting into the Nishi and Higashi Honganji branches that still anchor the tradition's two main lineages today.",{"start":1173,"end":1262,"basis":"founder Shinran's dates, \"(1173–1262)\""},{"lat":35.0116,"lng":135.7681,"label":"Kyōto, Japan (Honganji, the school's central monastery)"}],["n1660","Jōdoshū",432,0,47,34,2892,0,148,-86,["school"],"Jōdoshū. (\"Pure Land school.\") The first indigenous Japanese Buddhist school founded outside imperial court sponsorship, built on Hōnen's teaching that reciting the nenbutsu alone opens an \"easy path\" to rebirth in Amitābha's pure land. His disciples split over how often that recitation needed repeating — from Shōkū's reported sixty thousand times daily down to Kōsai and Shinran's radical claim that a single sincere invocation would suffice — factional splits that produced the Chinzei and Seizan branches, with Chinzei eventually dominant under Tokugawa patronage. Shinran's more radical single-recitation position later broke off entirely as its own school, Jōdo Shinshū.",{"start":1133,"end":1212,"basis":"founder Hōnen's dates, \"(1133–1212)\""},{"lat":35.0116,"lng":135.7681,"label":"Kyōto, Japan (Chion'in, built at Hōnen's grave site and the branch's eventual headquarters)"}],["n1661","Jo khang",433,3,24,17,4621,0,-220,-212,["place"],"Jo khang. (\"House of the Lord.\") Tibet's earliest and most sacred temple, built around 640 CE by King Srong btsan sgam po and his two queens directly atop the heart of a demoness the Tibetan landscape was believed to embody — a foundational act in Tibet's own Buddhist origin myth. Home to the Jo bo Śākyamuni statue, said to have been sculpted during the Buddha's own lifetime and brought from China by Princess Wencheng, it anchors Lhasa's central pilgrimage circuit and gave the city itself its name, having survived Cultural Revolution-era desecration — including use as a pigsty — to be restored and named a UNESCO World Heritage Site in 2000.",{"start":640,"end":640,"basis":"\"established by the Tibetan king Srong btsan sgam po... around 640 CE\""},{"lat":29.6538,"lng":91.1322,"label":"Lhasa, Tibet (named directly as the entry's subject)"}],["n1681","Kālacakratantra",439,3,41,22,5723,0,-182,-107,["work"],"Kālacakratantra. (\"Wheel of Time Tantra.\") A late, highly elaborate anuttarayogatantra composed in northern India during the Muslim invasions of Mahmud of Ghazni, whose apocalyptic vision of a future Buddhist army sweeping out of the mythical kingdom of Śambhala to defeat the invaders directly reflects that historical trauma. Distinctively organized into outer (cosmology and astrology), inner (embryology and physiology), and \"other\" (initiation and practice) sections, it culminates in a unique six-branched yoga producing a body of \"empty form\" — and its 1027 calendar system still underlies the Tibetan calendar used today, while its public initiation has been bestowed by the fourteenth Dalai Lama around the world as a peace ritual.",{"start":1025,"end":1040,"basis":"\"internal evidence... makes it possible to date the composition of the tantra rather precisely to between the dates 1025 and 1040 CE\""},{"lat":30,"lng":75,"label":"Northern India (general placeholder — text specifies composition there, coinciding with Mahmud of Ghazni's invasions)"}],["n1691","kalpa",442,1,26,20,1625,0,33,169,["concept"],"Kalpa. (\"Eon\" or \"age.\") Buddhism's unit of cosmological time, layered into nested scales: an \"intermediate\" kalpa spans a full decline in human lifespan from near-immortality down to ten years, eighty of these make a \"great\" kalpa cycling through creation, abiding, dissolution, and nothingness, and the almost incomprehensibly vast \"incalculable\" kalpa — a great kalpa raised to the sixtieth power — measures out the three full eons the bodhisattva path to buddhahood is said to require. A kalpa graced by an actual buddha's appearance earns the special designation \"fortunate.\"",null,null],["n1701","kāmadhātu",444,6,68,60,1294,0,66,199,["concept"],"Kāmadhātu. (\"Sensuous realm\" or \"desire realm.\") The lowest of Buddhism's three cosmological realms, encompassing six rebirth destinies from hell through hungry ghosts, animals, humans, demigods, and lesser divinities — all bound by sensuality and possessing a comparatively coarse physical body. Rebirth here, at whatever level, reflects a specific mix of past unwholesome and wholesome deeds. Above it sit the subtler realm of form (rūpadhātu) and the formless realm (ārūpyadhātu), where the pull of desire progressively loosens.",null,null],["n1703","Kamalaśīla",444,5,54,26,4668,0,-241,-19,["person"],"Kamalaśīla. (c. 740–795.) A leading late Indian Madhyamaka author and disciple of Śāntarakṣita, invited to Tibet to debate the Chinese Chan monk Heshang Moheyan after his teacher's death — the celebrated Bsam yas debate, in which the Tibetan king judged Kamalaśīla's gradual path victorious and banished the Chinese faction (Chinese sources tell it the other way). His three Bhāvanākrama treatises, composed in response, set out a step-by-step cultivation of bodhicitta, calmness, and insight toward buddhahood, sharply opposed to Chan's sudden-awakening model. His independent masterwork, the Madhyamakāloka, argues that Yogācāra's mind-only doctrine is merely a provisional teaching en route to the Madhyamaka view — and Kamalaśīla is said to have been assassinated in Tibet by partisans of the Chinese side he had defeated.",{"start":740,"end":795,"basis":"\"(c. 740–795)\", given directly"},{"lat":29.3167,"lng":91.5333,"label":"Bsam yas, Tibet (site of the famous debate central to this entry, and where he later died)"}],["n1707","kammaṭṭhāna",446,1,36,20,3508,0,0,265,["concept"],"Kammaṭṭhāna. (\"Working ground\" — meditative topic.) The Visuddhimagga's catalogue of forty meditation objects, ranging from ten elemental \"visualization devices\" and ten \"loathsome\" corpse-decay topics through ten recollections, four immaterial spheres, and four \"divine abidings.\" Different topics were traditionally matched to different temperaments — loathsome topics for the lustful, loving-kindness for the hateful — a diagnostic skill the Buddha himself was said to possess; as later generations lost that ability, the repertoire in active use narrowed dramatically, leaving mindfulness of breathing as by far the most commonly practiced topic today.",null,null],["n1715","kanhua Chan",448,7,49,40,4678,0,19,-329,["concept"],"Kanhua Chan. (\"Chan of investigating the topic of inquiry.\") A meditative technique systematized by the Song-dynasty master Dahui Zonggao out of the growing practice of studying old \"public case\" anecdotes (gong'an), using a single fragment — a \"topic of inquiry\" or huatou — as an object of concentrated doubt rather than intellectual puzzle-solving. The most famous example is Zhaozhou's one-word answer \"no\" to whether a dog has buddha-nature; sustained investigation builds an intensifying doubt that eventually \"explodes,\" dissolving conceptual thought and the boundary between self and other. Transmitted to Korea by Pojo Chinul as kanhwa Sŏn, where it remains the dominant contemplative method, and popularized in Japanese Rinzai Zen through Hakuin Ekaku's elaborate kōan curriculum.",null,null],["n1724","Kapilavastu",451,2,36,27,1137,0,224,194,["place"],"Kapilavastu. Capital of the Śākya tribe and hometown of the Buddha, where he was raised as a prince before renunciation and later returned often as a teacher, converting his cousins Ānanda and Devadatta, his half-brother Nanda, and his own son Rāhula. It was here, after the Buddha ordained the seven-year-old Rāhula without parental consent, that a new rule was created requiring parental permission for ordination — and here that his foster mother Mahāprajāpatī's request to join the saṃgha initiated the order of nuns.",{"start":-560,"end":-524,"basis":"where Siddhārtha \"was raised and lived as a prince until he renounced worldly life\"; chronology convention"},{"lat":27.5667,"lng":83.05,"label":"Kapilavastu, on the modern Nepal-India border (named directly as the entry's subject)"}],["n1730","Karma Bka’ brgyud",452,3,24,18,777,0,-397,-229,["school"],"Karma Bka' brgyud. The oldest and most politically prominent of the Bka' brgyud sect's four subsects, headed by the succession of incarnate lamas known as the Karma pa and wielding major political power from the late fourteenth century until the Dge lugs sect's ascendancy under the fifth Dalai Lama. Distinctive for placing equal weight on scriptural study and meditative practice, especially mahāmudrā, it remains a vigorous tradition in exile and is sometimes mistakenly called the \"Black Hats\" in the West, after the Karma pa's distinctive ceremonial crown.",{"start":1110,"end":1193,"basis":"\"dates to the first Karma pa, Dus gsum mkhyen pa\", whose dates are given elsewhere as \"(1110–1193)\""},{"lat":29.7667,"lng":90.4833,"label":"Mtshur phu Monastery, Tibet (the sect's traditional seat)"}],["n1736","karman",453,1,151,139,5299,0,-59,206,["concept"],"Karman. (\"Action.\") The doctrine that virtuous and nonvirtuous deeds of body, speech, and mind ripen into future happiness or suffering — potentially lifetimes later, but never lost, the way energy is conserved in a physical process. Originally a Vedic term for ritual action, redefined by the Buddha as intention itself: \"having intended, one acts through body, speech, and mind.\" Crucially, the person who experiences a karman's fruit is neither identical to nor entirely different from the person who performed it — a middle position meant to preserve moral cause-and-effect without smuggling back in a permanent self.",null,null],["n1737","karman",453,1,149,139,1653,0,-6,220,["concept"],"Karman. (\"Action.\") The doctrine that virtuous and nonvirtuous deeds of body, speech, and mind ripen into future happiness or suffering — potentially lifetimes later, but never lost, the way energy is conserved in a physical process. Originally a Vedic term for ritual action, redefined by the Buddha as intention itself: \"having intended, one acts through body, speech, and mind.\" Crucially, the person who experiences a karman's fruit is neither identical to nor entirely different from the person who performed it — a middle position meant to preserve moral cause-and-effect without smuggling back in a permanent self.",null,null],["n1738","Karma pa",454,3,45,26,7539,0,-259,-114,["person","concept"],"Karma pa. A title held by the incarnate lama heading the Karma Bka' brgyud subsect — the first lineage in Tibetan history to institutionalize succession by incarnation, a model every other sect later adopted. Each Karma pa is said to leave a letter predicting the time and place of his own rebirth; the line's black crown, reputedly woven from a hundred thousand ḍākinīs' hair and invisible to the unmeritorious, was physically replicated for the fifth Karma pa by the Ming Yongle emperor. Regarded, like the Dalai Lamas, as emanations of Avalokiteśvara, the seventeen recognized Karma pas have included major scholars, yogins, and — at times, through Mongol and Chinese court ties — political power players, occasionally in tension with the rising Dge lugs sect.",{"start":1110,"end":1193,"basis":"\"the line of Karma pas originated... with Dus gsum mkhyen pa (1110–1193)\""},{"lat":29.7667,"lng":90.4833,"label":"Mtshur phu Monastery, Tibet (named directly as the lineage's main seat)"}],["n1744","karuṇā",457,1,29,24,1752,0,-79,110,["concept"],"Karuṇā. (\"Compassion.\") The wish that others be free from suffering, distinguished from loving-kindness's wish for others' happiness, and cultivated by radiating it outward across all directions of space as a tranquility meditation. Mainstream Buddhist compassion is explicitly distinguished from a bodhisattva's \"great compassion,\" which extends to all sentient beings without exception and actively motivates the practitioner to endure three incalculable eons of practice in order to personally end others' suffering, not merely wish it away.",null,null],["n1754","Kāśyapīya",459,1,31,7,3822,0,7,238,["school"],"Kāśyapīya. (\"Followers of Kāśyapa.\") One of the eighteen mainstream schools, its founder's identity genuinely disputed among traditional sources — variously Mahākāśyapa himself or a later, unrelated monk of the same name. Doctrinally distinctive for rejecting the Sarvāstivāda claim that factors exist across all three time periods, holding instead that only unfructified past karma, the present, and part of the future actually exist — a position closely allied with, though formally distinct from, the neighboring Dharmaguptaka and Mahīśāsaka schools with which it likely shared a common Vibhajyavāda origin.",{"start":-180,"end":-180,"basis":"split from the Sarvāstivāda school \"about three hundred years after the Buddha's death\" (chronology convention)"},{"lat":34.0151,"lng":71.5249,"label":"Northwestern India (Peshawar placeholder — inscriptional evidence attested there)"}],["n1798","Khri srong lde btsan",467,3,31,23,2969,0,-286,-234,["person"],"Khri srong lde btsan. (r. 754–799.) The second of Tibet's three great religious kings, who expanded the empire enough to briefly occupy the Tang capital Chang'an in 763, but is remembered chiefly for founding Bsam yas, Tibet's first monastery, with Śāntarakṣita as preceptor and, after hostile local spirits stalled construction, Padmasambhava's intervention to subdue them. Presided as judge over the pivotal Bsam yas debate between Kamalaśīla and the Chinese monk Heshang Moheyan, ultimately declaring Kamalaśīla victorious and formally establishing Madhyamaka as his kingdom's official philosophy — a ruling that tilted Tibetan Buddhism decisively toward Indian rather than Chinese models.",{"start":754,"end":799,"basis":"\"(r. 754–799)\", given directly"},{"lat":29.3167,"lng":91.5333,"label":"Bsam yas, Tibet (the monastery he founded, central to his legacy)"}],["n1801","Khuddakanikāya",468,2,37,34,1252,0,150,344,["concept","work"],"Khuddakanikāya. (\"Miscellaneous Collection.\") The fifth and final division of the Pāli sutta collection, a fifteen-book miscellany mixing some of the canon's oldest material with relatively late compositions, including the Dhammapada, Udāna, and Jātaka. Similar \"mixed baskets\" are known to have existed in other mainstream schools, but none survive and no equivalent appears among the Chinese āgama translations — making the Pāli Khuddakanikāya, expanded to nineteen books in the Burmese recension, a uniquely preserved genre.",null,null],["n1816","kleśa",471,1,158,136,1747,0,-99,186,["concept"],"Kleśa. (\"Afflictions\" or \"defilements.\") Mental factors — greed, hatred, delusion at the core, expanding into fuller lists depending on the school — that disturb the mind and drive unwholesome action, and that must be eliminated to escape rebirth. Sarvāstivāda counts six \"fundamental afflictions\" universal to all defiled thought plus ten of \"limited extent\"; Yogācāra instead names six root kleśas — including the five wrong views — plus twenty derivative ones. The taxonomies differ, but the target is the same: uproot these, and the actions they incite stop generating karman.",null,null],["n1821","Klong chen rab ’byams",472,3,24,11,2619,0,-286,-250,["person"],"Klong chen rab 'byams. (1308–1364.) The Rnying ma sect's foremost systematizer of rdzogs chen, believed to be the reincarnation of two figures central to that teaching's transmission, who trained widely across Rnying ma, Sa skya, and Bka' brgyud traditions before abandoning institutional scholarship in disillusionment to become a wandering ascetic. Received the core rdzogs chen teachings from the yogin Kumārarāja at Bsam yas, later composing his most celebrated works — including the \"Seven Treasuries\" — partly during a decade of political exile in Bhutan, where he also founded eight monasteries; his elegant, poetic writing later inspired the Rnying ma revival led by the treasure-revealer 'Jigs med gling pa.",{"start":1308,"end":1364,"basis":"\"(1308–1364)\", given directly"},{"lat":29.3,"lng":91,"label":"G.yo ru, central Tibet (birthplace, named directly)"}],["n1833","kongōkai",474,0,32,15,4849,0,67,-186,["concept"],"Kongōkai. (\"Diamond realm.\") One of the two principal maṇḍalas of Japanese esoteric Buddhism, paired with the taizōkai \"womb realm,\" and used by Kūkai to found Shingon's core initiatory rituals. Structured as nine interlocking assemblies spiraling outward from a central image of the cosmic buddha Mahāvairocana surrounded by the four directional buddhas, it visually demonstrates that the entire universe is coextensive with Mahāvairocana's own dharma-body — a teaching relying on no known textual blueprint, evidently having developed through pictorial tradition rather than scriptural prescription.",null,null],["n1839","Kośala",476,2,24,20,870,0,202,233,["place"],"Kośala. One of the two most powerful kingdoms in India during the Buddha's lifetime, alongside Magadha, ruling over the smaller neighboring Śākya tribe from its capital Śrāvastī, where the Buddha spent much of his teaching career at the Jetavana monastery. Eventually conquered by King Ajātaśatru of Magadha, absorbing it into the larger kingdom's growing power, and later counted among the twenty-four sacred sites associated with the Cakrasaṃvaratantra.",{"start":-560,"end":-480,"basis":"\"an important Indian kingdom during the Buddha's time\"; chronology convention"},{"lat":27.5167,"lng":82.05,"label":"Śrāvastī (its capital, named directly)"}],["n1857","kṣānti",479,1,29,21,1926,0,-76,190,["concept"],"Kṣānti. (\"Patience,\" \"forbearance,\" or \"acceptance.\") The third of the six perfections, covering a bodhisattva's endurance of abuse and hardship without losing commitment to liberating all beings, but also, in a more technical sense, the receptive acceptance of a hard truth — as in the \"acceptance of the fact of suffering,\" the very first moment of realizing the four noble truths that opens entry into the path of vision. As the third of the four \"aids to penetration,\" it marks an understanding of the four noble truths still slightly less complete than the final, fourth stage that immediately precedes it.",null,null],["n1865","Kṣitigarbha",481,0,24,18,3441,0,116,-120,["deity"],"Kṣitigarbha. (\"Earth Store.\") A bodhisattva devoted to rescuing beings trapped in the hell realms, largely overlooked in India and Tibet but transformed in China, from the fifth century onward, into a full-fledged Lord of Hell counterbalancing the Jade Emperor of native Chinese cosmology — a role reinforced by his prior-birth legend as a filial daughter who saved her mother from the Avīci hell. Uniquely depicted as an unadorned, shaven-headed monk rather than in bodhisattva finery, he became known in Japan as Jizō, protector of children, travelers, and community boundaries, with statues of him still dressed in bibs today in memory of stillborn and aborted children.",{"start":400,"end":500,"basis":"the cult of Kṣitigarbha \"gained popularity by at least the fifth century\" in China"},{"lat":30.4667,"lng":117.8,"label":"Jiuhuashan, Anhui, China (where Chinese tradition places his monk-form residence)"}],["n1873","Kūkai",483,0,42,23,4105,0,75,-170,["person"],"Kūkai. (774–835.) Founder of Japan's Shingon esoteric tradition, who abandoned a path toward government office to pursue Buddhism, traveled to Tang China in 804 alongside Saichō, and studied tantric ritual and Sanskrit under masters in Chang'an before returning in 806 with the two-realm maṇḍala lineage. Built his teaching around the claim that all acts of body, speech, and mind are direct expressions of the cosmic buddha Mahāvairocana, secured Mt. Kōya and Tōji as twin institutional centers, and is said to remain in eternal meditation in his mountain mausoleum, awaiting the future buddha Maitreya — alongside his other legacies as calligrapher, engineer, and, by tradition, inventor of the kana syllabary.",{"start":774,"end":835,"basis":"\"(774–835)\", given directly"},{"lat":34.2125,"lng":135.5858,"label":"Mt. Kōya (Kōyasan), Japan (site of his mausoleum, where he is said to remain in meditation)"}],["n1884","Kumārajīva",485,5,54,41,2683,0,-126,-15,["person"],"Kumārajīva. (344–409/413.) The single most influential translator of Buddhist texts into Chinese, born into the royal family of the Central Asian kingdom of Kucha, converted from Sarvāstivāda to Mahāyāna at Kashgar, then held hostage for eighteen years by Chinese warlords — time he used to master fluent Chinese. Installed at Chang'an in 402 to head an imperial translation bureau, he produced around seventy-four texts in 384 rolls, including the Lotus Sūtra, Vimalakīrtinirdeśa, Diamond Sūtra, and Nāgārjuna's Root Verses — translations so clear and readable that they remain, to this day, the versions still read across East Asia wherever a rival translation exists.",{"start":344,"end":409,"basis":"\"(344–409/413)\", given directly"},{"lat":41.7166,"lng":82.9425,"label":"Kucha (birthplace and royal-family connection, named directly)"}],["n1889","Kŭmgangsan",487,0,27,15,4026,0,40,-203,["place"],"Kŭmgangsan. (\"Diamond Mountains.\") Korea's most celebrated Buddhist sacred mountains, identified since the Silla dynasty with the Avataṃsakasūtra's description of a mountain where the bodhisattva Dharmodgata perpetually preaches — a connection the Huayan exegete Chengguan explicitly drew to Korea. Once home to some 108 monasteries before the devastation of the Korean War, including Ŭisang's 676 foundation Mahayŏnsa, it remains an active pilgrimage site today, though continued access has been repeatedly disrupted by the volatile politics of the divided peninsula.",{"start":676,"end":676,"basis":"Mahayŏnsa, one of its primary monasteries, \"built by Ŭisang in 676\""},{"lat":38.68,"lng":128.09,"label":"Kŭmgangsan (Diamond Mountains), Kangwŏn Province, North Korea (named directly as the entry's subject)"}],["n1900","kuśala",489,1,49,39,1494,0,-131,282,["concept"],"Kuśala. (\"Wholesome\" or \"virtuous.\") Actions of body, speech, and mind — enumerated as ten — free of greed, hatred, or delusion, that lead to favorable rebirths as humans or divinities. The ten wholesome courses invert their unwholesome counterparts point for point: sustaining life instead of killing, giving instead of stealing, truthful and harmonious speech instead of lying and slander, and unselfishness, goodwill, and right views in place of their opposites.",null,null],["n1902","kuśalamūla",490,1,35,16,2414,0,-117,204,["concept"],"Kuśalamūla. (\"Wholesome faculties\" or \"roots of virtue.\") The cumulative store of merit-generating qualities built up across past lives, most simply enumerated as nongreed, nonhatred, and nondelusion — the direct inverse of the three unwholesome roots. Vaibhāṣika abhidharma further sorts wholesome roots by where they lead: some toward favorable rebirth, some toward eventual liberation, and a distinct fourfold set toward the direct \"spiritual penetration\" that opens the path of vision itself, marking the actual attainment of stream-entry.",null,null],["n1905","Kuśinagarī",491,2,24,18,1706,0,211,185,["place"],"Kuśinagarī. The town where the Buddha passed into parinirvāṇa beneath twin śāla trees, having earlier declined — after his attendant Ānanda failed to catch the hint — an offer to extend his own life for a full eon. When Ānanda protested that such an obscure \"back-woods\" town seemed unworthy of the Buddha's death, the Buddha reminded him it had once been the splendid capital of an earlier cakravartin king; after cremation, the brāhmaṇa Droṇa divided the Buddha's relics into eight shares for rival claimant kingdoms, building a stūpa at Kuśinagarī itself to house the vessel that had briefly held them — making the site one of Buddhism's four great pilgrimage destinations.",{"start":-480,"end":-480,"basis":"site of the Buddha's parinirvāṇa; chronology convention"},{"lat":26.7477,"lng":83.8864,"label":"Kuśinagar, Uttar Pradesh, India (named directly as the entry's subject)"}],["n1913","Kyo",492,7,36,33,3177,0,-101,-242,["concept"],"Kyo. (\"Doctrine\" or \"teaching.\") The Korean designation for scripturally oriented Buddhist schools, paired against meditation-focused Sŏn as the tradition's two great institutional strands — a distinction sharp enough that Korea's Chosŏn-dynasty state formally recognized only these two categories. Centuries of attempts to reconcile them, from Ŭichŏn's \"cultivation of scriptural study and contemplation\" to Pojo Chinul's \"concentration and wisdom in tandem,\" eventually collapsed into a simple \"Two Traditions, Sŏn and Kyo\" designation under King Sejong — a synthesis the modern Chogye order still claims as its own founding premise.",null,null],["n1921","lakṣaṇa",496,1,39,11,2703,0,-246,194,["concept"],"Lakṣaṇa. (\"Mark,\" \"characteristic,\" or \"sign.\") A term covering a striking range of Buddhist ideas: the defining feature of any factor, the three or four marks shared by all conditioned things (impermanence, suffering, nonself, and sometimes the four stages of arising, enduring, decaying, and ceasing), the thirty-two physical marks of a great man on a buddha's body, Yogācāra's three intrinsic natures, and — in Madhyamaka — the falsely perceived \"signs\" of intrinsic existence that ignorance projects onto things that have none. In epistemology, it narrows further into the specific/particular mark known only through direct nonconceptual perception versus the general/shared mark that appears whenever one merely thinks about something.",null,null],["n1931","lam rim",498,3,25,20,2557,0,-291,-131,["concept"],"Lam rim. (\"Stages of the path.\") A major Tibetan literary genre and study framework tracing back to Atiśa's Bodhipathapradīpa, organizing the entire Buddhist path around three progressively broader levels of spiritual motivation — seeking merely a better rebirth, then personal liberation, then full buddhahood to benefit all beings. Though most associated with the Dge lugs sect, which counts eight canonical lam rim treatises headlined by Tsong kha pa's massive Lam rim chen mo, the genre appears across every major Tibetan Buddhist tradition.",null,null],["n1939","Laṅkāvatārasūtra",499,5,38,30,2565,0,-166,-50,["work"],"Laṅkāvatārasūtra. (\"Scripture on the Descent into Lanka.\") A seminal Mahāyāna sūtra staged as the bodhisattva Mahāmati's wide-ranging questions to the Buddha on behalf of Rāvaṇa, king of Lanka, touching on storehouse consciousness, tathāgatagarbha, and mind-only doctrine — themes central to Yogācāra even though neither Asaṅga nor Vasubandhu ever quote it directly. Also notable for one of Buddhist literature's earliest sustained condemnations of meat-eating, and later claimed retrospectively by the Chan school as scriptural authority for its own lineage, with some accounts even ranking its first translator above Bodhidharma among the Chan patriarchs.",{"start":300,"end":400,"basis":"\"probably dates from around the fourth century CE\""},null],["n1946","laukikāgradharma",501,1,29,9,2652,0,-204,240,["concept"],"Laukikāgradharma. (\"Highest worldly factors.\") The fourth and final \"aid to penetration,\" naming the single highest possible mundane mental state directly before the noble path of vision begins — the last moment of being an ordinary person before becoming a stream-enterer. Even the exact composition of this stage was disputed among Vaibhāṣika teachers themselves, though the dominant Kashmiri view held it to be the mental factors that directly trigger irreversible access to eventual liberation.",null,null],["n1962","Lha sa",505,3,83,80,2470,0,-353,-234,["place"],"Lha sa. (\"Place of the gods.\") Capital of Tibet and its religious center, founded as Srong btsan sgam po's new capital in 637 around the original Potala Palace and Jokhang temple. The area was first called Ra sa (\"place of the goats,\" for the pack animals used in construction) before being renamed following the Jokhang's consecration in 647. Ringed by pilgrimage circuits and the three great Dge lugs monasteries — Dga' ldan, 'Bras spungs, Se ra — it became the seat of the Dalai Lamas' government after the seventeenth century.",{"start":637,"end":637,"basis":"\"founded the original edifice underlying the Po ta la Palace in 637\""},{"lat":29.65,"lng":91.1,"label":"Lhasa, Tibet (the entry itself)"}],["n1965","li",506,5,27,12,2929,0,-192,-135,["concept"],"Li. (\"Principle\" or \"pattern.\") Originally a term for the natural grain in a piece of jade, extended by early Chinese philosophy into a general concept of the underlying pattern governing reality — taken up by Wang Bi as synonymous with metaphysical nonbeing, then absorbed into Chinese Buddhist thought by Daosheng as a synonym for buddha-nature. Huayan philosophy gave the term its most sophisticated development: Dushun used it for the proposition that phenomena are empty, Fazang identified it with the mind of suchness, and Chengguan extended it into the essential quality pervading all four realms of reality — a trajectory that would later feed directly into Song-dynasty Neo-Confucian metaphysics.",null,null],["n1977","Linji zong",509,7,80,72,1754,0,59,-432,["school"],"Linji zong. One of the Five Houses and Seven Schools of mature Chinese Chan, tracing to the Tang-dynasty master Linji Yixuan and consolidated by Song-dynasty successors including Shishuang Chuyuan, whose two disciples founded the lineage's two enduring branches, the Huanglong and Yangqi. Dahui Zonggao, in the Yangqi line, developed the practice of fixating on a single gong'an's \"keyword\" into what became kanhua Chan; his branch also sparred publicly with the rival Caodong lineage over meditation method. Survives today as the ancestor of Japan's Rinzai and Korea's Imje traditions.",{"start":900,"end":1000,"basis":"Song-dynasty consolidation by named successors (e.g. Fengxue Yanzhao, b. 896); Linji Yixuan's own Tang-dynasty dates aren't given in this entry"},{"lat":34.27,"lng":108.95,"label":"China (general placeholder — no specific site named)"}],["n1983","Liuzu tan jing",511,7,34,21,2766,0,-50,-225,["work"],"Liuzu tan jing. (\"Platform Sūtra of the Sixth Patriarch.\") The transcribed sermons of Huineng, containing the famous poetry contest that won him the Chan patriarchy over his rival Shenxiu and cemented the distinction between Huineng's \"sudden\" Southern school and Shenxiu's \"gradual\" Northern school. Central teachings include the identity of concentration and wisdom as essence and function, and \"no-thought\" as not-thinking even while engaged in thought — doctrines that, despite the text's traditional billing as the Southern school's founding scripture, show clear influence from Northern and Oxhead-school teachings as well. Sir Marc Aurel Stein's discovery of a starkly different mid-ninth-century Dunhuang recension upended the traditional narrative of Chan's early history and launched its modern scholarly reassessment.",{"start":800,"end":850,"basis":"the earliest surviving recension, from Dunhuang, \"dating to the mid-ninth century\""},{"lat":24.8,"lng":113.6,"label":"Dafansi monastery, Shaozhou (Guangdong), China (setting of the sermons, named directly)"}],["n1984","lobha",511,1,49,34,1951,0,-182,181,["concept"],"Lobha. (\"Craving\" or \"greed.\") One of Buddhism's most pervasive defilements, appearing on nearly every standard list of afflictions and counted among the core mental factors in every major abhidharma system. Arises when sensory contact occurs without proper introspection, and can target virtually anything — sensual pleasure, possessions, loved ones, fame, even one's own future existence or nonexistence — functioning, per the āgamas, as a self-imposed yoking of mind to object that leaves the mind \"mired\" and \"burdened\" by desire.",null,null],["n1994","lokapāla",513,6,30,13,1766,0,243,-16,["concept"],"Lokapāla. (\"World guardians.\") The four great heavenly kings — Dhṛtarāṣṭra, Virūḍhaka, Virūpākṣa, and Vaiśravaṇa — converted by the Buddha and stationed at the four cardinal gates of Mount Sumeru to protect the world, each commanding his own retinue of demigods (gandharvas, nāgas, yakṣas, and others). Originally indigenous Indian or Central Asian deities absorbed into the Buddhist pantheon, their roots in warrior-caste lineages surface visibly in the suits of armor they acquire as their cult spreads eastward into China, Korea, and Japan.",null,null],["n2000","lokottara",514,1,29,13,1911,0,-87,147,["concept"],"Lokottara. (\"Beyond the world\" — supramundane.) A term for anything connected to liberation from saṃsāra, contrasted with \"mundane\" ordinary experience — in the fifty-two-stage bodhisattva path, roughly the difference between practitioners still at the preparatory ten faiths/understandings/practices stages versus those who have reached the ten bodhisattva grounds proper. The Lokottaravāda subschool of Mahāsāṃghika took its very name from insisting the Buddha's seemingly ordinary acts — eating, sleeping, walking — were only apparent, since he in fact remained perpetually in meditative absorption, entirely free of worldly need.",null,null],["n2022","Madhyamāgama",519,2,55,51,1235,0,117,371,["work"],"Madhyamāgama. (\"Medium [Length] Scriptures.\") The Sanskrit sūtra collection corresponding to, but substantially larger than, the Pāli Majjhimanikāya — no longer extant in an Indic language but preserved whole in a Chinese translation completed in 397–398, with scattered Sanskrit fragments recovered at Turfan. Ascribed to the Sarvāstivāda school on the strength of those surviving fragments, its 222 sūtras overlap heavily not just with the Majjhimanikāya but with suttas scattered across all four other Pāli nikāyas.",{"start":397,"end":398,"basis":"\"Chinese translation made by Gautama Saṃghadeva between 397 and 398\""},null],["n2023","Madhyamaka",520,5,175,162,5084,0,-278,72,["school"],"Madhyamaka. (\"Middle Way.\") Mahāyāna philosophical school founded on the works of the second-century philosopher Nāgārjuna, charting a middle way between the extremes of eternalism and annihilationism through the doctrine of emptiness — the claim that all phenomena, being dependently arisen, lack any independent, intrinsic nature. Tibetan exegetes later split it into Prāsaṅgika (Buddhapālita, Candrakīrti) and Svātantrika (Bhāvaviveka, Śāntarakṣita) branches; in East Asia its texts founded the \"Three Treatises\" school. Traditionally ranked in Tibet as the highest of the four Indian philosophical schools.",{"start":100,"end":250,"basis":"Nāgārjuna, its founder, \"c. second century CE\" per this entry"},{"lat":16.5,"lng":80.6,"label":"South India (general — per the Nāgārjuna entry, not stated here directly)"}],["n2030","Madhyamakāvatāra",522,5,29,10,3291,0,-303,32,["work"],"Madhyamakāvatāra. (\"Entrance to the Middle Way.\") Candrakīrti's independent verse treatise and primer to Nāgārjuna's Root Verses, organized around the ten bodhisattva stages and their perfections, with an enormous sixth chapter on the perfection of wisdom that became one of Indian Madhyamaka's most influential works. There Candrakīrti extends Nāgārjuna's refutation of a personal self into a celebrated sevenfold analysis — famously applied to a chariot, findable in none of its parts — and mounts one of Madhyamaka's most detailed refutations of Yogācāra's \"mind-only\" doctrine. Preserved only in Tibetan, it became a core text of the Dge lugs curriculum.",{"start":600,"end":650,"basis":"\"major independent work of the seventh-century Indian master Candrakīrti\", whose dates are given elsewhere as \"(c. 600–650)\""},null],["n2033","Madhyāntika",523,7,32,5,2464,0,98,-25,["person"],"Madhyāntika. Third in the traditional line of five teachers succeeding the Buddha, sent by his own teacher Ānanda to establish Buddhism in Kashmir, where he is said to have subdued a malevolent nāga and ordained a thousand novice monks. Xuanzang's travel account credits him with commissioning a hundred-foot wooden image of Maitreya, modeled with the aid of a sculptor Madhyāntika sent directly to Tuṣita heaven to study the bodhisattva's actual appearance. Later Chan lineage histories quietly dropped him from the patriarchal roster after the early ninth century, promoting Śāṇakavāsin to third patriarch in his place.",{"start":-380,"end":-380,"basis":"\"lived a hundred years after the Buddha's death\", per the Aśokāvadāna; chronology convention"},{"lat":34.0837,"lng":74.7973,"label":"Kashmir (where he was sent to disseminate the dharma, named directly)"}],["n2036","Magadha",524,2,37,34,1760,0,193,119,["place"],"Magadha. The largest and, over time, most dominant of ancient northern India's sixteen great states, ruled during the Buddha's lifetime by his patrons Bimbisāra and Ajātaśatru from the capital Rājagṛha before the seat of power shifted to Pāṭaliputra and became the heart of the Mauryan Empire. Often called the birthplace of Buddhism, its regional dialect reputedly the language the Buddha himself spoke, Magadha reached its imperial peak under Aśoka in the third century BCE, when its authority stretched from Bengal to Afghanistan.",{"start":-600,"end":-300,"basis":"the largest of the sixteen states that \"flourished in northern India between the sixth and third centuries BCE\""},{"lat":25.61,"lng":85.14,"label":"Magadha, northern India (named directly as the entry's subject)"}],["n2044","mahābhūta",526,1,24,21,800,0,-108,299,["concept"],"Mahābhūta. (\"Great elements.\") The four fundamental physical qualities composing the material world in abhidharma analysis: earth providing solidity, water providing cohesion, fire providing heat, and wind providing mobility. Every physical object is understood to contain all four elements simultaneously, simply in differing proportions, rather than being made of just one.",null,null],["n2065","Mahākāśyapa",530,7,50,29,5418,0,59,-37,["person"],"Mahākāśyapa. Foremost among the Buddha's disciples in ascetic practice, born Pipphali to a brāhmaṇa family in Magadha, who married only reluctantly and, with his equally renunciation-minded wife Bhaddā, abandoned a shared estate after both were separately moved to pity by insects killed in ordinary farm work. Ordained on the road to Rājagṛha, he exchanged robes with the Buddha himself — a gesture read as marking him successor — and presided over the first Buddhist council after the Buddha's death, sharply interrogating Ānanda over his conduct. Revered in Chan tradition as the first patriarch, the sole disciple who understood the Buddha's silent \"flower sermon\" and thus received the first mind-to-mind transmission.",{"start":-560,"end":-480,"basis":"contemporary of the Buddha, presiding over the first council after the Buddha's death; no specific dates given, chronology convention used"},{"lat":25.61,"lng":85.14,"label":"Magadha (general placeholder — birthplace, named directly)"}],["n2068","Mahāmaudgalyāyana",531,2,27,21,1470,0,141,219,["person"],"Mahāmaudgalyāyana. The Buddha's other chief disciple alongside his childhood friend Śāriputra, unmatched among the saṃgha in supranormal powers. Born to a wealthy family and moved to renounce the world after a shared moment of existential disillusionment at a public performance, he and Śāriputra first studied under the skeptic teacher Sañjaya before parting ways in search of a satisfying teacher — each vowing to inform the other first if either succeeded. When Śāriputra achieved stream-entry on hearing a brief verse of the Buddha's teaching from the monk Aśvajit, he immediately shared it with Mahāmaudgalyāyana, who attained the same realization just as quickly.",{"start":-570,"end":-480,"basis":"contemporary and elder of the Buddha (\"he was older than the Buddha\"); chronology convention"},{"lat":25.61,"lng":85.14,"label":"Magadha (general placeholder — childhood region shared with Śāriputra)"}],["n2073","mahāmudrā",533,3,41,33,1918,0,-242,-153,["concept"],"Mahāmudrā. (\"Great seal.\") The crowning tantric realization in the Bka' brgyud sect's Tilopa-to-Mi la ras pa lineage, in which phenomenal appearance and emptiness are recognized as already unified — a state reached not by rejecting the ordinary mind but by recognizing that its natural lucidity was there all along, underneath even its most deluded thoughts. Structured around the classic threefold rubric of basis, path, and fruition, it remains debated in Tibet as either an exclusively tantric attainment or one with a parallel sūtra-based route tied to tathāgatagarbha teachings, and ranks as the highest of tantra's four \"seals.\"",null,null],["n2076","Mahānāman",534,2,24,6,3128,0,112,269,["person"],"Mahānāman. A name shared by at least two, and by some accounts three, distinct early Buddhist figures. One was among the five ascetic companions who first heard the Buddha's inaugural sermon and quickly attained arhatship; the other, the Buddha's cousin and Aniruddha's elder brother, was declared foremost among generous lay almsgivers — but whose prideful deception, marrying off a slave-born daughter to King Prasenajit under false pretenses of pure lineage, was discovered a generation later and triggered the eventual massacre of the entire Śākya clan by the resulting grandson's vengeance. A third, unrelated Mahānāma is credited as the fifth-century author of the Pāli chronicle Mahāvaṃsa.",{"start":-560,"end":-480,"basis":"contemporaries of the Buddha; chronology convention"},{"lat":27.5667,"lng":83.05,"label":"Kapilavastu (associated with the Buddha's cousin Mahānāman and the Śākya clan's destruction)"}],["n2085","Mahāparinirvāṇasūtra",537,5,61,41,6243,0,-35,11,["work"],"Mahāparinirvāṇasūtra. (\"Discourse on the Great Decease.\") The Mahāyāna retelling of the Buddha's final teachings and passage into parinirvāṇa, compiled in Kashmir by the third century CE and radically different in content from its mainstream counterpart. Its central, provocative claim is that all beings — even \"incorrigibles\" in the longer recension — possess buddha-nature, and that the Buddha's own nirvāṇa is not annihilation but an eternal, blissful, pure state endowed with a \"great self,\" directly inverting the standard no-self teaching by recasting it as a merely conventional truth. Survives complete only in Chinese and Tibetan translation, in versions differing enough that scholars believe Mahāyāna material was progressively layered onto a shorter, non-Mahāyāna original.",{"start":200,"end":300,"basis":"the earliest Sanskrit version \"was likely compiled in Kashmir... in the third century CE\""},{"lat":34.0837,"lng":74.7973,"label":"Kashmir (compilation site of the earliest Sanskrit version, per this entry)"}],["n2091","mahāpuruṣalakṣaṇa",539,2,24,22,2803,0,23,111,["concept"],"Mahāpuruṣalakṣaṇa. (\"Marks of a great man.\") Thirty-two physical marks — golden skin, webbed hands, a protrusion atop the head, a white tuft between the eyebrows, forty perfectly even teeth — shared by both buddhas and wheel-turning emperors, each understood as the specific karmic fruit of a particular virtue cultivated over countless past lives. Accompanied by a further eighty minor marks and most fully manifest on a buddha's resplendent enjoyment-body, this list functioned as a kind of physiognomic checklist for recognizing extraordinary beings on sight, with individual marks like the cranial protrusion and the brow-tuft attracting entire traditions of their own elaborate commentary.",null,null],["n2097","Mahāsāṃghika",540,2,58,50,2687,0,65,178,["school"],"Mahāsāṃghika. (\"Great Congregation.\") A major mainstream school that split from the Sthaviranikāya at the second Buddhist council in Vaiśālī, roughly a century after the Buddha's death, over ten disputed points of monastic conduct — including handling money, drinking unfermented wine, and holding incomplete assemblies — which the larger faction judged not to be violations at all. Emphasized the supramundane nature of the Buddha, treating his career as Śākyamuni as mere display, and taught a \"root consciousness\" underlying the six senses that likely anticipated the Yogācāra storehouse consciousness. Its Lokottaravāda branch produced the celebrated Buddha biography, the Mahāvastu; the school spread across India and Afghanistan before dying out as an ordination lineage.",{"start":-380,"end":-380,"basis":"arose \"about a century after the Buddha's death, at the so-called second Buddhist council\" (chronology convention: Buddha's death c. 480 BCE)"},{"lat":26.0281,"lng":85.1214,"label":"Vaiśālī (site of the second Buddhist council, named directly)"}],["n2104","mahāsiddha",541,3,32,26,2265,0,-220,-175,["concept"],"Mahāsiddha. (\"Great adept.\") Tantric Buddhism's ideal practitioner — paralleling the arhat's role in mainstream Buddhism and the bodhisattva's in the Mahāyāna — drawn not from monastic elites but often from society's most despised trades: butchers, fishermen, leatherworkers. Their power comes precisely from transgressing purity codes that ordinary monastic virtue depends on — eating meat, meditating atop corpses, breaking caste taboos — reframing acts that would otherwise lead to hell as the very deeds of a buddha, alongside prodigious magical feats like flying or transmuting metal into gold.",{"start":600,"end":1200,"basis":"historical mahāsiddhas \"dating from between the seventh and twelfth centuries CE\""},null],["n2109","mahāsthāna",543,2,26,15,1147,0,183,107,["concept"],"Mahāsthāna. (\"Great site.\") The canonical list of four (or, expanded, eight) Indian pilgrimage sites tied to pivotal moments in the Buddha's life — birth at Lumbinī, enlightenment at Bodhgayā, first sermon at Sārnāth, and final nirvāṇa at Kuśinagarī, with the expanded list adding sites of specific miracles at Śrāvastī, Sāṃkāśya, Rājagṛha, and Vaiśālī. These eight sites recur constantly in Pāla-period Indian sculpture and were essential stops for Chinese and Korean pilgrims like Xuanzang traveling the subcontinent.",null,null],["n2116","Mahāvagga",544,2,31,12,1821,0,185,184,["work"],"Mahāvagga. (\"Great Chapter.\") The first half of the vinaya's Khandhaka division and the earliest systematic narrative of the saṃgha's founding — covering the Buddha's earliest teachings and conversions after enlightenment, the institution of ordination through the threefold refuge, and practical matters like the rains retreat and monastic robes. Its historical account continues directly into the companion Cūḷavagga, which picks up the saṃgha's story after the Buddha's death.",null,null],["n2117","Mahāvairocanābhisaṃbodhisūtra",544,0,31,19,1956,0,20,-138,["work"],"Mahāvairocanābhisaṃbodhisūtra. An early Buddhist tantra staged as a dialogue between Vajrapāṇi and the cosmic buddha Mahāvairocana, composed around the time the Mantrayāna was first emerging as its own distinct Mahāyāna strand. Centered on bodhicitta, compassion, and skillful means as the cause, root, and culmination of Mahāvairocana's omniscience, it became — alongside the Sarvatathāgatatattvasaṃgraha — one of the two most important tantras for East Asian esoteric Buddhism, reaching China in a 724–725 translation and Tibet with an additional seven chapters not found in the Chinese version.",{"start":550,"end":700,"basis":"\"probably composed sometime between the mid-sixth and seventh centuries\""},null],["n2118","Mahāvaṃsa",545,2,25,24,683,0,336,252,["work"],"Mahāvaṃsa. (\"Great Chronicle.\") Sri Lanka's most celebrated Pāli chronicle, expanding on the earlier Dīpavaṃsa's outline with a more elaborate and coherent narrative running from Buddhism's origins through the three Indian councils to Mahinda's mission and the reign of Mahāsena — though it drops some material found in its source, such as the lineage of nuns.",{"start":400,"end":500,"basis":"\"written most probably in the fifth century CE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Mahāvihāra tradition, source of the chronicle)"}],["n2119","Mahāvastu",545,2,30,17,2523,0,57,110,["work"],"Mahāvastu. (\"Great Chapter.\") The earliest surviving Sanskrit biography of the Buddha, embedded within the vinaya of the Lokottaravāda branch of the Mahāsāṃghika — a placement suggesting Buddha-biography as a genre began life as vinaya introduction before becoming independent literature. Structured in three parts covering the bodhisattva's past lives, his final descent from Tuṣita through enlightenment, and the saṃgha's founding, the text breaks off before the Buddha's death and is packed with interpolated teachings, duplicate narrative episodes, and proto-Mahāyāna elements — like an extended account of the ten bodhisattva grounds — whose relationship to later Mahāyāna doctrine remains genuinely debated.",{"start":-200,"end":-200,"basis":"\"linguistic elements suggest that portions of the text may date to as early as the second century BCE\""},null],["n2121","Mahāvihāra",545,2,25,23,1326,0,277,342,["place"],"Mahāvihāra. (\"Great Monastery.\") The headquarters of orthodox Theravāda in Sri Lanka, built for Mahinda at Anurādhapura following King Devānaṃpiyatissa's conversion, and site of the first-ever commitment of a Buddhist canon to writing, undertaken by five hundred of its monks in the late first century BCE. Its authority was twice challenged by breakaway fraternities and its buildings vacated for nine years under a hostile royal decree, but it remained influential enough that Buddhaghosa composed his sutta commentaries there before it finally declined after the Sri Lankan capital relocated in the ninth century.",{"start":-300,"end":-200,"basis":"\"built in the third century BCE\""},{"lat":8.3114,"lng":80.4037,"label":"Anurādhapura, Sri Lanka (named directly as the entry's subject)"}],["n2125","Mahāyāna",546,5,372,365,6472,0,-78,24,["concept","school"],"Mahāyāna. (\"Great Vehicle.\") Movement emerging roughly four centuries after the Buddha's death around new sūtras claiming to be his actual word, each proclaiming its own supremacy through the doctrine of skillful means. Sets the bodhisattva path — not personal arhatship — as the ideal, teaching perfection of wisdom, buddha-nature, and pure lands. Despite becoming the dominant form of Buddhism in China, Korea, Japan, Tibet, and Mongolia, Chinese pilgrims report it remained a minority movement within India itself.",{"start":-100,"end":100,"basis":"\"roughly four centuries after the Buddha's death\" (chronology convention), widened per the entry's own hedge that firm epigraphic evidence is five centuries after the first sūtras"},{"lat":25.61,"lng":85.14,"label":"India (general placeholder — Magadha; no specific origin site named)"}],["n2126","Mahāyānasaṃgraha",547,5,28,20,1214,0,-245,35,["work"],"Mahāyānasaṃgraha. (\"Summary of the Great Vehicle.\") Asaṅga's most complete presentation of Yogācāra theory and practice, detailing the three natures, the storehouse consciousness and its seeds, and the threefold wisdom of hearing, reflection, and meditation through which that consciousness is ultimately dismantled and enlightenment achieved. Lost in the original Sanskrit but preserved in Tibetan and multiple Chinese translations, including by Paramārtha and Xuanzang, it became the founding text of China's She lun zong.",{"start":320,"end":390,"basis":"\"composed by the fourth-century master Asaṅga\", whose dates are given elsewhere as \"c. 320–c. 390 CE\""},null],["n2127","Mahāyānasūtrālaṃkāra",547,5,38,23,1957,0,-220,20,["work"],"Mahāyānasūtrālaṃkāra. (\"Ornament for the Mahāyāna Sūtras.\") One of five treatises tradition holds were delivered to Asaṅga by the bodhisattva Maitreya in Tuṣita heaven, offering a systematic, twenty-one-chapter verse account of the entire bodhisattva path from a Yogācāra standpoint — opening with a defense of the Mahāyāna sūtras' authenticity and closing with the consummation of buddhahood. Covers everything from taking refuge and generating bodhicitta through the six perfections to the methods of teaching the dharma, and remains anchored by Vasubandhu's commentary and Sthiramati's subcommentary as one of Indian Mahāyāna's most important treatises.",null,null],["n2130","Mahinda",548,2,27,15,2993,0,285,204,["person"],"Mahinda. Aśoka's son, ordained at twenty and immediately attaining arahantship, who led the Buddhist mission that converted the Sinhalese king Devānaṃpiyatissa and inaugurated Buddhism in Sri Lanka. After preaching successive sermons that made the king's court stream-enterers and then once-returners, he arranged for his sister Saṅghamittā to travel to the island (bringing a Bodhi tree cutting) since he himself, as a monk, could not ordain the women requesting entry into the order. He established the Mahāvihāra monastery in a royal garden gifted by the king, which became Theravāda's headquarters on the island, and died at sixty, his ashes enshrined near the great stūpa he had helped found.",{"start":-268,"end":-232,"basis":"son of Aśoka, active during his reign, \"(r. c. 268–232 BCE)\" per the Aśoka entry; converted Sri Lanka \"in the third century BCE\""},{"lat":8.3114,"lng":80.4037,"label":"Anurādhapura, Sri Lanka (where he established the Mahāvihāra monastery)"}],["n2132","Mahīśāsaka",549,2,26,11,1945,0,45,175,["school"],"Mahīśāsaka. One of the eighteen mainstream schools, likely named after its brāhmaṇa founder — a former district governor turned arhat — and classed, alongside its likely offshoot the Dharmaguptaka, within the broader Sthaviranikāya lineage descending from the Sarvāstivāda. Distinctive doctrines include denying any intermediate state between death and rebirth (holding instead that a subtle form of the aggregates carries forward directly) and classifying the Buddha as, in fact, a member of the saṃgha — a position with real consequences for how monastic property and alms were divided. Its vinaya recension was recorded by the Chinese pilgrim Faxian in Sri Lanka, and Asaṅga himself is said to have first been ordained within this school.",{"start":-180,"end":-180,"basis":"\"probably emerged some three centuries after the demise of the Buddha\" (chronology convention)"},null],["n2137","mainstream Buddhist schools",549,5,32,25,783,0,-52,86,["concept"],"Mainstream Buddhist schools. A modern scholarly coinage for the eighteen (or, by full historical count, over thirty) non-Mahāyāna traditions of Indian Buddhism — Dharmagupta, Mahāsāṃghika, Sarvāstivāda, and the rest — deliberately chosen to replace the polemical Mahāyāna-coined label \"Hīnayāna.\" A neutral, retrospective umbrella term rather than a self-designation any of these schools would have used for themselves.",null,null],["n2139","Maitreya",550,5,106,88,8194,0,-14,-2,["deity"],"Maitreya. (\"The Benevolent One.\") The next buddha, currently awaiting his final rebirth in Tuṣita heaven until the dharma has been forgotten entirely — traditionally calculated at 5.67 billion years after Śākyamuni's death. A minor figure in early Indian Buddhism, his cult grew into one of the most popular in Asia during the early centuries of the Common Era, the first bodhisattva to become an object of worship in his own right and the model for later cults of Avalokiteśvara and Mañjuśrī. In China and Japan he later merged with the folk figure Budai, becoming the pot-bellied \"laughing Buddha.\"",{"start":0,"end":300,"basis":"the cult's rise, \"during the early centuries of the Common Era\""},null],["n2140","Maitreyanātha",551,5,25,20,660,0,-266,4,["person"],"Maitreyanātha. (\"Protector Maitreya.\") The name scholars have given to a possibly historical Indian teacher, contemporary with Asaṅga, credited with authoring some or all of the \"five books of Maitreya\" — including the Abhisamayālaṃkāra and Mahāyānasūtrālaṃkāra — texts that tradition instead says were delivered directly to Asaṅga by the bodhisattva Maitreya in Tuṣita heaven. The name itself is ambiguous between \"Protector Maitreya\" and \"Protected by Maitreya,\" reflecting the genuine uncertainty over whether a real human author stands behind the attribution.",{"start":320,"end":390,"basis":"presumed contemporary of Asaṅga, \"fourth century CE\" (Asaṅga's dates given elsewhere as \"c. 320–c. 390 CE\")"},null],["n2142","maitrī",551,1,33,25,1363,0,-39,220,["concept"],"Maitrī. (\"Loving-kindness.\") One of the four divine abidings and four immeasurables, defined simply as the wish for others' happiness, capable of producing the first three meditative absorptions but not the fourth, which only equanimity can reach. Buddhaghosa's recommended practice starts self-directed — wishing oneself happiness first — before radiating outward to others, and the cultivation of maitrī is counted among the motivations driving a bodhisattva to work for the liberation of all beings.",null,null],["n2144","Majjhimanikāya",552,2,93,83,2104,0,100,325,["work"],"Majjhimanikāya. (\"Collection of Middle-Length Discourses.\") The second of five divisions of the Pāli Suttapiṭaka, containing 152 discourses across three parts. Preserves some of the earliest versions of the Buddha's enlightenment narrative — its account of his renunciation, unlike later embellished versions, is a spare first-person statement with no chariot rides or four sights. Its Sarvāstivāda Sanskrit counterpart, the Madhyamāgama, overlaps substantially but not completely with it, sharing 98 of its 222 sūtras.",null,null],["n2168","maṇḍala",556,3,91,88,3339,0,-70,-189,["concept"],"Maṇḍala. (\"Circle.\") A structured diagram — imagined, painted, or built — in which significance increases toward the center, typically the residence of a primary deity surrounded by an assembly of attendants. Functions simultaneously as cosmological map, meditative visualization, and ritual space that initiates are said to \"enter.\" Scaled up, entire monuments, monasteries, and even mountains (Borobudur, Bsam yas, Wutaishan) are understood as maṇḍalas; scaled into the West, Carl Jung adopted the maṇḍala as a model of psychological wholeness.",null,null],["n2178","Mañjuśrī",559,0,65,54,3198,0,-27,-116,["deity"],"Mañjuśrī. (\"Gentle Glory.\") The bodhisattva of wisdom, one of Mahāyāna's two most important bodhisattvas alongside Avalokiteśvara — first prominent in the Vimalakīrtinirdeśa (by the first century CE), the only figure with courage enough to debate the wise layman Vimalakīrti. Wields a flaming sword of wisdom and a lotus-borne volume of the Prajñāpāramitā; some texts claim he inspired Śākyamuni, and every past buddha, to set out on the bodhisattva path in the first place. Closely tied to Wutaishan in China, a pilgrimage site drawing seekers of his visionary presence from across Asia since at least the Northern Wei dynasty.",{"start":-100,"end":100,"basis":"\"first comes to prominence in the Vimalakīrtinirdeśa, which probably dates no later than the first century CE\""},{"lat":39.0175,"lng":113.5978,"label":"Wutaishan, China (named directly and extensively in the entry as his associated site)"}],["n2185","manomayakāya",561,1,28,12,2732,0,5,131,["concept"],"Manomayakāya. (\"Mind-made body.\") A subtle body acquired through advanced meditation, capable of flight and passing through solid matter, drawn from the physical body the way a sword is drawn from its scabbard upon mastering the fourth meditative absorption. The Laṅkāvatārasūtra distinguishes three bodhisattva versions tied to different stages of the path, and the concept closely parallels the \"transitional being\" occupying the intermediate state between death and rebirth — both are bodies sustained by joy rather than solid food, invisible to ordinary sight.",null,null],["n2190","mantra",562,0,92,89,1430,0,-4,-158,["concept"],"Mantra. (\"Spell\" or \"charm.\") A syllable or string of syllables, often semantically meaningless, whose recitation is held to be efficacious — folk-etymologized by Indian exegetes as \"mind protector.\" Appears in sūtras as well as tantras, most famously in the Heart Sūtra, and is central to tantric visualization practice, where its letters are imagined within the meditator's own body. The most widely recited of all is Avalokiteśvara's six-syllable Oṃ maṇi padme hūṃ; Japan's Shingon school takes its very name from the term's Sinitic translation, \"true word.\"",null,null],["n2194","Māra",563,2,42,30,3569,0,107,128,["deity"],"Māra. (\"Maker of Death.\") Buddhism's personification of evil, a genuine divinity of the sensuous realm devoted to blocking beings' escape from death and rebirth. His defining defeat comes on the night of the Buddha's enlightenment: unable to dissuade the meditating bodhisattva with armies, seductive daughters, or the challenge of who could vouch for his accumulated merit, Māra is routed when the earth goddess herself is called to testify, quaking the ground in confirmation. Scholastic literature later expands him into four metaphorical forms — the aggregates, the afflictions, death itself, and the literal deity — a comprehensive taxonomy of everything standing between a being and liberation.",null,null],["n2199","mārga",565,1,96,77,2687,0,-89,127,["concept"],"Mārga. (\"Path.\") The route from suffering to liberation — a road the Buddha claims to have rediscovered, not invented, since every past buddha found and then lost the same path before the next one reopens it. Introduced in the first sermon at Sarnath as the fourth noble truth, the eightfold path between self-indulgence and self-mortification. Elsewhere elaborated as the three trainings of morality, concentration, and wisdom, or as five sequential paths shared by the śrāvaka, pratyekabuddha, and bodhisattva vehicles alike, each ending in a different fruit.",{"start":-525,"end":-525,"basis":"\"the term mārga occurs in the Buddha's first sermon\"; converted via chronology convention"},{"lat":25.3805,"lng":83.0221,"label":"Sarnath (site of first sermon; not restated in this entry, cross-referenced from saṃgha/four noble truths)"}],["n2205","Mar pa Chos kyi blo gros",566,3,28,16,3200,0,-283,-144,["person"],"Mar pa Chos kyi blo gros. (1012–1097.) Tibetan founder of the Bka' brgyud sect, who made three arduous journeys to India seeking tantric instruction, eventually studying under the siddha Nāropa at the forest retreat of Pullahari and receiving mahāmudrā teachings from Maitrīpa — though contemporary Tibetan sources note Nāropa had likely already died before Mar pa's actual visit, complicating the traditional account. A farmer and family man rather than a monk, he passed his accumulated instructions to four principal disciples, most famously the poet-yogin Mi la ras pa, after his own son and intended heir died in a riding accident.",{"start":1012,"end":1097,"basis":"\"(1012–1097)\", given directly"},{"lat":28.85,"lng":90.6,"label":"Lho brag, southern Tibet (birthplace, named directly)"}],["n2216","Māyā",568,2,32,21,3638,0,77,121,["person"],"Māyā. (\"Illusion.\") Mother of the Buddha, who at forty to fifty years old dreamed of a white elephant entering her side on the night of his conception and gave birth standing beneath a tree at Lumbinī, dying seven days later — a death tradition attributes to the unsuitability of any other child ever being conceived in a womb that had held a future buddha. Reborn as a male divinity in Tuṣita heaven, she later descended to hear her son teach the abhidharma in the heaven of the thirty-three; in the Gaṇḍavyūha, she reveals to the pilgrim Sudhana that she is, in fact, mother to all buddhas of past, present, and future alike, Maitreya included.",{"start":-560,"end":-560,"basis":"died shortly after giving birth to the future Buddha; chronology convention"},{"lat":27.6667,"lng":83.2833,"label":"Lumbinī grove (named directly as her son's birthplace)"}],["n2221","Mazu Daoyi",570,7,31,25,2199,0,-23,-318,["person"],"Mazu Daoyi. (709–788.) Retrospective patriarch of the Hongzhou lineage of Chan, awakened under Nanyue Huairang after being told that sitting meditation, like polishing a roof tile, could never by itself produce a mirror or buddhahood. His radical extension of \"original enlightenment\" doctrine — declaring \"everyday mind is the way\" and \"mind itself is the Buddha\" — insisted sentient beings were never actually deluded at all, a position that drew sharp criticism from Guifeng Zongmi for seemingly excusing practitioners from any need for practice or ethical restraint.",{"start":709,"end":788,"basis":"\"(709–788)\", given directly"},{"lat":32.9711,"lng":119.4551,"label":"Zhongling, Jiangsu, China (site of Kaiyuansi, where he taught for decades)"}],["n2240","mikkyō",573,0,41,27,2411,0,92,-204,["concept"],"Mikkyō. (\"Esoteric teachings.\") The body of esoteric ritual, text, and iconography Saichō and Kūkai brought back from Tang China in 804 and 806, rooted in late Indian tantric Buddhism transmitted through Central Asia and China. Kūkai's Shingon strand (Tōmitsu) and the Tendai school's own parallel esoteric tradition (Taimitsu) both centered worship on the cosmic buddha Mahāvairocana and promised concrete this-worldly goals — political power, protection, buddhahood in one's own body — gaining rapid favor with the Heian court and eventually shaping Shugendō and local Shintō ritual as well.",{"start":804,"end":806,"basis":"introduced to Japan via Saichō's and Kūkai's returns from China, \"804\" and \"806\" respectively"},{"lat":35.0116,"lng":135.7681,"label":"Kyōto, Japan (Heian capital, center of its early court patronage)"}],["n2242","Mi la ras pa",574,3,39,28,4315,0,-289,-198,["person"],"Mi la ras pa. (\"Milarepa,\" 1028/40–1111/23.) Tibet's most beloved yogin, whose life story — practicing black magic to avenge his family's stolen inheritance, then seeking redemption through grueling trials imposed by his guru Mar pa, including single-handedly building and dismantling stone towers — became a foundational template for the possibility of attaining buddhahood in one lifetime despite a troubled past. Renowned for spontaneous songs of realization rather than philosophical discourse, often mocking scholarly pretension, he transmitted Mar pa's tantric teachings, especially mahāmudrā and inner-heat practice, to disciples including Sgam po pa, founder of the Bka' brgyud sect's monastic tradition. Poisoned by a jealous rival monk, he is said to have allowed himself to die despite having already achieved buddhahood, leaving no relics behind.",{"start":1028,"end":1123,"basis":"\"(1028/40–1111/23)\" — dates disputed among biographies, given directly"},{"lat":28.6,"lng":85.8,"label":"Gung thang, southwestern Tibet (birthplace, named directly)"}],["n2252","mithyādṛṣṭi",576,1,30,22,1785,0,-137,392,["concept"],"Mithyādṛṣṭi. (\"Wrong view.\") Broadly, any mistaken philosophical position such as eternalism or annihilationism; more narrowly, the last of the ten unwholesome actions — specifically, denying that actions have consequences or that rebirth occurs — considered especially dangerous because it removes any deterrent against further unwholesome conduct. Also counted as the most severe of the five root-affliction views, alongside self-view, extremism, attachment to one's own opinions, and misplaced faith in ritual efficacy.",null,null],["n2262","mofa",578,0,39,32,2086,0,171,-68,["concept"],"Mofa. (\"Final dharma.\") The last of a three-stage East Asian scheme of Buddhism's eschatological decline — true dharma, semblance dharma, and final dharma — a framework original to China rather than inherited from India, its onset variously calculated but generally assumed to have already begun soon after Buddhism reached East Asia. The doctrine supplied ready justification for \"easier\" practices suited to a degenerate age unable to follow the Buddha's original path, fueling devotion to Amitābha's pure land and the cult of the future buddha Maitreya, and shaping entire traditions including Pure Land, Jōdoshū, and Nichirenshū.",null,null],["n2263","Moggaliputtatissa",578,2,24,16,1670,0,228,269,["person"],"Moggaliputtatissa. The monk who presided over the third Buddhist council at Pāṭaliputra, called in by Aśoka to resolve a seven-year crisis in which non-Buddhist mendicants had donned monastic robes purely for livelihood, forcing a suspension of the ordination ceremony until Aśoka personally interrogated the saṃgha and defrocked the pretenders. With the saṃgha purified, Moggaliputtatissa convened the council to rehearse the canon and composed the Kathāvatthu, the abhidhamma's seventh and final book, specifically to refute heretical views.",{"start":-268,"end":-232,"basis":"led the third council during Aśoka's reign, \"(r. c. 268–232 BCE)\" per the Aśoka entry"},{"lat":25.6127,"lng":85.1228,"label":"Pāṭaliputra (site of the third Buddhist council, named directly)"}],["n2265","moha",579,1,48,37,1288,0,-182,258,["concept"],"Moha. (\"Delusion\" or \"confusion.\") A synonym for ignorance denoting basic confusion about the true nature of the person and the world, counted among the \"three poisons\" alongside greed and hatred and, in Sarvāstivāda abhidharma, first among six fundamental afflictions tainting every defiled thought. Its opposite, nondelusion, is one of the eleven wholesome factors in the Yogācāra hundred-dharma list — delusion and clarity treated as the two poles around which a mind's entire moral character turns.",null,null],["n2266","Mohe zhiguan",579,5,24,15,2976,0,-194,-64,["work"],"Mohe zhiguan. (\"The Great Calming and Contemplation.\") Tiantai Zhiyi's magnum opus on meditative theory and practice, transcribed from his 594 lectures by his disciple Guanding, balancing \"calming\" (śamatha) and \"observation\" (vipaśyanā) across three complementary readings of each term. Its most celebrated doctrine, \"the trichiliocosm in a single instant of thought,\" holds that any single moment of mind perfectly encompasses the entirety of reality — though the text itself breaks off incomplete partway through its seventh of ten planned chapters.",{"start":594,"end":594,"basis":"\"based on a series of lectures Zhiyi delivered in 594\""},null],["n2269","mokṣabhāgīya",580,1,34,2,2631,0,-130,192,["concept"],"Mokṣabhāgīya. (\"Aids to liberation.\") The second of three Vaibhāṣika wholesome-faculty categories, involving the intent to listen to and reflect on Buddhist teaching until one's actions align with the prospect of liberation — the \"remote\" path of preparation, built from learning and reflection rather than meditative practice itself. Working by temporarily allaying greed, hatred, and ignorance through their positive counterparts, these faculties develop the first twelve of the thirty-seven factors of awakening, laying groundwork that the more advanced nirvedhabhāgīya factors will later complete.",null,null],["n2293","mudrā",584,0,44,37,1680,0,62,-157,["concept"],"Mudrā. (\"Seal,\" \"mark,\" or \"sign.\") Ritual hand and arm gestures performed in practice or depicted in Buddhist art, from the earliest \"fearlessness\" and \"earth-touching\" gestures of Śākyamuni images to the hundreds of mudrās that proliferated with Mahāyāna and Vajrayāna iconography. In tantric ritual mudrās become dynamic gestures symbolizing offerings or invoking visualized deities, and the term takes on a further, more literal meaning as a sexual consort — visualized or actual — with the \"great seal,\" mahāmudrā, naming the highest realization in certain tantric systems.",null,null],["n2303","Mūlamadhyamakakārikā",586,5,62,38,6935,0,-269,116,["work"],"Mūlamadhyamakakārikā. (\"Root Verses on the Middle Way.\") Nāgārjuna's second-century masterwork, 448 verses across twenty-seven chapters subjecting causation, motion, self, time, and nirvāṇa itself to a relentless four-cornered analysis that finds none of them possessing independent, intrinsic existence. Preserved complete only within Candrakīrti's Sanskrit commentary the Prasannapadā, and hugely influential in East Asia as one of the Three Treatises school's core texts. Its most quoted line — that there is not the slightest difference between saṃsāra and nirvāṇa — argues that emptiness doesn't negate causation but is precisely what makes change and transformation possible at all.",{"start":100,"end":200,"basis":"the \"magnum opus of the second-century Indian master Nāgārjuna\""},null],["n2306","Mūlasarvāstivāda",587,2,26,25,410,0,106,90,["school"],"Mūlasarvāstivāda. (\"Root Sarvāstivāda.\") A subsect of the Sarvāstivāda mainstream school whose precise doctrinal distinction from its parent tradition remains genuinely unclear even to modern scholarship — the name itself, claiming to be the \"root\" or original form, may reflect a polemical claim of institutional priority rather than a settled historical fact. Its monastic code, the Mūlasarvāstivāda vinaya, survives as by far the longest of the extant vinayas and remains the disciplinary code still followed in Tibetan Buddhism today.",null,null],["n2307","Mūlasarvāstivāda vinaya",588,2,35,21,2877,0,148,93,["work"],"Mūlasarvāstivāda vinaya. By far the longest of the surviving monastic codes — some four times the length of its counterparts — preserved complete only in Tibetan translation, with a massive but partial Chinese rendering by Yijing. Its sheer bulk comes from including far more than bare rules: origin stories for every regulation, extensive narrative material, one of the earliest Sanskrit lives of the Buddha, and practical guidance on matters like escorting images in procession or lending the saṃgha's money at interest — content eclectic enough that it functions almost as a proto-canon in its own right. It remains the monastic code followed in Tibetan Buddhism today.",{"start":0,"end":200,"basis":"\"composed in Sanskrit in the first or second centuries CE\""},null],["n2332","nāga",594,6,48,46,1558,0,162,-42,["concept"],"Nāga. Serpent-bodied beings — human-headed and torsoed but tailed and hooded like a cobra — said to inhabit an underwater kingdom of treasure and magnificent palaces, appearing in Buddhist literature as both allies and adversaries. A nāga princess's instant transformation into a buddha in the Lotus Sūtra is cited as proof that women can attain enlightenment; the nāga Mucilinda sheltered the newly enlightened Buddha from a storm; and Nāgārjuna is said to have recovered the massive Perfection of Wisdom in One Hundred Thousand Lines from safekeeping among the nāgas at the bottom of the sea.",null,null],["n2336","Nāgārjuna",594,5,104,87,6762,0,-250,77,["person"],"Nāgārjuna. (c. 2nd century CE.) Indian philosopher traditionally credited as founder of the Madhyamaka school, active in South India — almost nothing else about his life is secure, though two verse letters of advice to a king suggest real contemporary renown. His Mūlamadhyamakakārikā systematizes the poetic, paradoxical emptiness-talk of the perfection-of-wisdom sūtras into rigorous philosophy: emptiness is not nonexistence but the absence of independent, intrinsic existence (svabhāva), inseparable from dependent origination. Also compiled a sūtra anthology used by scholars to help date which Mahāyāna texts existed in his lifetime.",{"start":100,"end":200,"basis":"given directly in the entry"},{"lat":16.5,"lng":80.6,"label":"South India (general placeholder — Andhra Pradesh; entry says only \"South India,\" no city named)"}],["n2348","Nālandā",598,5,50,38,2814,0,-201,18,["place"],"Nālandā. India's most renowned Buddhist monastic university, founded near Rājagṛha under Gupta patronage and flourishing from the sixth to twelfth centuries CE, hosting as many as ten thousand students and fifteen hundred teachers at its height, supported by the tax revenue of a hundred neighboring villages. Nearly every major figure of late Indian Mahāyāna and Madhyamaka philosophy — Asaṅga, Vasubandhu, Dharmakīrti, Candrakīrti, Śāntideva — is said to have taught or studied there, and its curriculum spanned Buddhist philosophy alongside Hindu thought, mathematics, and medicine. Sacked by Turkic troops in 1192, its library reportedly smoldered for months, and the institution never recovered.",{"start":415,"end":455,"basis":"founded by King Śakrāditya, \"sometimes identified as the fifth-century ruler Kumāragupta I (r. 415–455)\""},{"lat":25.136,"lng":85.4434,"label":"Nālandā, Bihar, India (named directly as the entry's subject)"}],["n2350","nāmarūpa",599,1,27,22,1818,0,-206,348,["concept"],"Nāmarūpa. (\"Name-and-form\" — mentality and materiality.) The fourth link of dependent origination, where \"name\" covers the four mental aggregates and \"form\" the physical body — read by some traditions as marking the exact moment consciousness from a prior life enters the womb to inhabit a new embryo. The two are said to depend on each other completely, like a lame man riding on a blind man's shoulders: without form there is nothing for consciousness to inhabit, and without consciousness the embryo cannot develop, so neither can exist without the other, like two bundles of reeds propped against
