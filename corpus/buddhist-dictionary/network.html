 each other.",null,null],["n2384","nāraka",608,6,49,38,2475,0,181,-6,["concept"],"Nāraka. (\"Hell denizen.\") The lowest of the six rebirth destinies, inhabiting an elaborate cosmography of eight burning hot hells and eight freezing cold hells beneath the earth, each successively more agonizing, plus four neighboring hells of embers, corpses, razors, and a river impossible to ford. Crucially, Buddhist hells are temporary places of rebirth, not eternal damnation — however long a sentence, once a hell denizen's karmic lifespan expires, rebirth continues elsewhere, a point vividly illustrated in Chinese cave art showing tormented sinners finally served a cup of tea before moving on.",null,null],["n2388","Nāropa",609,3,28,23,2136,0,-353,-213,["person"],"Nāropa. (1016–1100.) A Bengali-born scholar who rose to abbot of Nālandā under the name Abhayakīrti before an encounter with a ḍākinī convinced him he grasped his texts' words but not their inner meaning, sending him in search of the master Tilopa. Subjected to twelve greater and twelve lesser trials involving genuine physical suffering, he finally received Tilopa's realization through a blow from his guru's own shoe, and his compiled instructions — the \"six doctrines of Nāropa\" — became central to the Bka' brgyud lineage, transmitted (at least by tradition, since the chronology doesn't quite hold up) through Mar pa to Mi la ras pa.",{"start":1016,"end":1100,"basis":"\"(1016–1100)\", given directly"},{"lat":25.136,"lng":85.4434,"label":"Nālandā, India (where he served as abbot and had his pivotal encounter with a ḍākinī)"}],["n2401","Ngag dbang blo bzang rgya mtsho",612,3,37,9,4874,0,-303,-247,["person"],"Ngag dbang blo bzang rgya mtsho. (The fifth Dalai Lama, 1617–1682.) The first Dalai Lama to unify religious and secular rule over Tibet, consolidating power with Mongol military backing after a bitter struggle against the Bka' brgyud-aligned kings of Gtsang. A gifted scholar, tantric practitioner, and treasure-revealer despite his Dge lugs training, he built the Potala Palace on the site of Srong btsan sgam po's ancient residence, forced doctrinally suspect monasteries into Dge lugs allegiance while still patronizing new Rnying ma institutions, and navigated a fraught relationship with the Qing court that resented being treated as an equal rather than a vassal — a political and religious legacy still felt in Tibet today.",{"start":1617,"end":1682,"basis":"\"(1617–1682)\", given directly"},{"lat":29.05,"lng":91.75,"label":"'Phyong rgyas (Chongye), Tibet (birthplace, named directly)"}],["n2405","nianfo",613,0,86,64,3775,0,115,-87,["concept"],"Nianfo. (\"Recollection... of the Buddha.\") A Chinese translation of buddhānusmṛti, an early meditative practice of recalling the Buddha's qualities that evolved, in East Asia, into reciting his name outright — most often \"Homage to Amitābha Buddha.\" Widely practiced across schools and social classes in China and Korea, not confined to any single pure land tradition, though later exegetes retroactively cast certain monks as its patriarchs. In Japan, became the central, sometimes exclusive practice of Hōnen and Shinran's Jōdoshū and Jōdo Shinshū — which debated whether one sincere recitation sufficed, or many were required.",null,null],["n2409","Nichiren",614,0,27,22,3044,0,193,-166,["person"],"Nichiren. (1222–1282.) Founder of Nichirenshū, who broke decisively with Hōnen's pure land nenbutsu practice after concluding the Lotus Sūtra alone contained the Buddha's ultimate, definitive teaching — proclaiming in 1253 that reciting its title, Namu Myōhōrengekyō, sufficed for liberation in the current degenerate age. His confrontational lobbying of the Kamakura government to suppress rival schools and adopt the Lotus Sūtra led to repeated arrest and exile, including a period on Sado Island where he composed several major treatises, before retiring to Mt. Minobu to write and teach until his death, leaving behind fierce disputes over his succession.",{"start":1222,"end":1282,"basis":"\"(1222–1282)\", given directly"},{"lat":35.3667,"lng":138.4333,"label":"Mt. Minobu, Yamanashi, Japan (where he retired and wrote his major later works)"}],["n2413","Nidānakathā",616,2,24,7,2880,0,148,193,["work"],"Nidānakathā. (\"Account of Origins.\") The introduction to the Jātaka collection and the earliest continuous narrative biography of the Buddha in Pāli sources, running in three sections from the ascetic Sumedha's vow before the buddha Dīpaṃkara, through the descent from Tuṣita and enlightenment, to the donation of Jetavana in the Buddha's early ministry. Deliberately incomplete as a life story — it skips over the intervening jātaka births entirely and ends well before the Buddha's death — it nonetheless became the template for later, more expansive Buddha biographies.",{"start":400,"end":500,"basis":"traditionally attributed to \"the great fifth-century Pāli scholar Buddhaghosa\""},null],["n2422","niḥsvabhāva",618,5,27,19,1560,0,-318,169,["concept"],"Niḥsvabhāva. (\"Lack of self-nature\" or \"absence of intrinsic existence.\") Madhyamaka's core diagnosis: the root of all suffering is mistakenly believing that persons and phenomena possess an independent, autonomous identity, when in fact none do — a synonym for emptiness so central that Madhyamaka is sometimes called niḥsvabhāvavāda, \"proponents of no intrinsic existence.\" Yogācāra repurposes the term across its three natures, describing each as lacking self-nature in a different way: the imaginary lacks defining characteristics, the dependent lacks independent production, and the consummate lacks any ultimate difference between subject and object.",null,null],["n2423","nikāya",618,2,41,33,1331,0,93,168,["concept"],"Nikāya. (\"Group\" or \"collection.\") A term with two distinct senses: the sūtra collections of the Pāli canon (paralleled in Sanskrit by \"āgama\"), and, separately, any of the mainstream non-Mahāyāna schools of Indian Buddhism — traditionally counted at eighteen, though inscriptions and texts actually attest to thirty-four. \"Nikāya Buddhism\" specifically denotes monastic Buddhism after the Mahāsāṃghika–Sthaviranikāya split, and is sometimes used as a more neutral substitute for the pejorative \"Hīnayāna.\"",null,null],["n2431","nirmāṇakāya",620,13,41,36,2101,0,38,-36,["concept"],"Nirmāṇakāya. (\"Emanation body.\") One of a buddha's three bodies, the only one visible to ordinary beings — meaning, in Mahāyāna logic, that the entire \"historical Buddha,\" hunger, pain, and all, was itself just a display staged to inspire the world rather than a literal embodied experience. Capable of appearing as a divinity, human, animal, or even an inanimate object like a bridge, nirmāṇakāya splits into three types: the \"supreme\" emanation exemplified by Śākyamuni himself, the \"birth\" emanation that simply benefits beings, and the \"artisan\" emanation appearing as a craftsman or work of art — rendered in Tibetan as sprul sku, the root of \"tulku.\"",null,null],["n2434","nirodha",621,1,24,12,1365,0,-128,263,["concept"],"Nirodha. (\"Cessation,\" \"extinction,\" or \"suppression.\") The extinction of a specific affliction or group of afflictions — nirvāṇa itself counts as a form of nirodha, since it is the cessation of all action and affliction entirely. Abhidharma distinguishes an \"analytical cessation\" achieved through meditative insight from a \"nonanalytical cessation,\" a mere absence (like hunger fading after a meal) or a permanent block on certain factors ever arising again.",null,null],["n2435","nirodhasamāpatti",621,1,25,14,1671,0,-220,313,["concept"],"Nirodhasamāpatti. (\"Equipoise of cessation.\") The highest meditative attainment recognized in mainstream Buddhism, transcending even the four immaterial absorptions — a state of suspended animation where the meditator remains technically alive while all physical and mental activity, including basic mentality, completely stops for a fixed period. Because even thought itself is absent, it's classified as a \"conditioned force dissociated from thought\" in both Sarvāstivāda and Yogācāra systems, with Yogācāra crediting the storehouse consciousness alone with keeping the meditator's body alive throughout.",null,null],["n2436","nirodhasatya",621,1,25,9,1922,0,-11,253,["concept"],"Nirodhasatya. (\"Truth of cessation.\") The third of the four noble truths, referring in its fullest sense to nirvāṇa — the permanent cessation of action, affliction, and the suffering they generate — and, in abhidharma's finer analysis, to the specific, permanent destruction of each affliction tied to each of the three realms of existence. Despite completing the causal chain as an \"effect\" of the fourth truth (the path), cessation isn't an ordinary effect at all: it's classified as a \"disconnection fruition,\" since the path doesn't produce nirodha so much as simply uncover it by removing what obscured it.",null,null],["n2440","nirvāṇa",622,1,216,188,7866,0,-64,142,["concept"],"Nirvāṇa. (\"Extinction.\") The soteriological goal of the Buddhist path — literally the blowing-out of the flame of craving, hatred, and delusion, and with it the causes of future rebirth. Achieved in life as \"nirvāṇa with remainder,\" while mind and body persist; achieved finally at death as \"nirvāṇa without remainder,\" ending rebirth altogether. Not a place or a state of existence, since either would still belong to saṃsāra — traditions describe it only apophatically, by what it is not. Mahāyāna texts later locate the Buddha in an \"unlocated nirvāṇa,\" neither in saṃsāra nor apart from it.",{"start":-525,"end":-525,"basis":"the Buddha's enlightenment, age thirty-five, per this entry; converted via chronology convention"},{"lat":24.6961,"lng":84.9911,"label":"Bodhgayā, India (named directly in this entry)"}],["n2466","nīvaraṇa",629,1,43,24,2246,0,-78,318,["concept"],"Nīvaraṇa. (\"Hindrance.\") Five obstacles blocking the first meditative absorption, each undermining a specific component of concentration: sensual desire, ill will, sloth and torpor, restlessness and worry, and skeptical doubt. Each has its own prescribed antidote — contemplating bodily decay against desire, loving-kindness against ill will, recollecting death against sloth — and each is permanently uprooted at a specific stage of the noble path, worry and doubt vanishing at stream-entry, desire and ill will at nonreturning, and the rest only at arhatship.",null,null],["n2525","Padmasambhava",641,3,81,73,4304,0,-225,-254,["person","deity"],"Padmasambhava. (fl. 8th century.) Indian tantric master revered in Tibet as \"Guru Rinpoche,\" the \"Precious Guru,\" and honored by the Rnying ma sect as its founder and a \"second buddha.\" Traditional accounts place his miraculous lotus-birth in Oḍḍiyāna, a region some scholars locate in Pakistan's Swat Valley; historically, he's credited with subduing Tibet's indigenous deities and helping establish Bsam yas, the country's first monastery, alongside Śāntarakṣita and King Khri srong lde btsan. Said to have hidden teachings as \"treasures\" for future discovery, and believed by devotees to still reside in a paradise he never truly left.",{"start":700,"end":800,"basis":"\"fl. eighth century,\" given directly"},{"lat":35.2227,"lng":72.4258,"label":"Swat Valley, Pakistan (Oḍḍiyāna — \"a region some scholars associate with the Swat Valley,\" per this entry)"}],["n2544","pañcabala",646,1,24,2,1947,0,-137,298,["concept"],"Pañcabala. (\"Five powers.\") Faith, effort, mindfulness, concentration, and wisdom — the same five spiritual faculties matured into full \"powers,\" each serving as the specific antidote to one of the five hindrances blocking meditative absorption: faith against ill will, effort against sloth, mindfulness against sensual desire, concentration against restlessness, wisdom against doubt. Counted among the thirty-seven factors of enlightenment, with prajñāpāramitā literature placing their fuller development at the more advanced \"forbearance\" and \"highest worldly dharmas\" stages of the path of preparation.",null,null],["n2548","pañcajñāna",647,0,25,5,1188,0,-17,17,["concept"],"Pañcajñāna. (\"Five wisdoms.\") Five facets of a buddha's perfect enlightenment — the wisdom of the dharma-realm, mirror-like wisdom, the wisdom of equality, discerning wisdom, and the wisdom of accomplished action — mapped in Yogācāra onto the transformation of each of the eight consciousnesses once purified. In tantric practice, each wisdom corresponds to one of the five buddha families, and the entire path is framed as the deliberate transmutation of the five root afflictions into these five wisdoms in exact, one-to-one correspondence.",null,null],["n2553","pañcamārga",648,1,43,19,4408,0,-150,208,["concept"],"Pañcamārga. (\"Five paths.\") The standard Sanskrit Buddhist map of the road to enlightenment: accumulation, preparation, vision, cultivation, and the adept path where nothing more remains to be learned. The path of vision marks the pivotal transition from ordinary person to noble one, corresponding to stream-entry in abhidharma models and to the first bodhisattva ground in Mahāyāna ones; the final adept path culminates in an \"adamantine-like concentration\" that permanently destroys even the subtlest fetters, whether the destination is arhatship or buddhahood.",null,null],["n2558","pañcaśīla",649,2,37,20,3503,0,131,172,["concept"],"Pañcaśīla. (\"Five precepts.\") The foundational moral code for lay and monastic Buddhists alike: abstaining from killing, stealing, sexual misconduct, lying, and intoxicants, formally undertaken as part of the refuge ceremony that marks becoming a Buddhist. These same five, with celibacy substituted for sexual restraint, form the base layer for progressively stricter codes — the eight lay retreat precepts observed on fasting days, the ten novice precepts, and ultimately the hundreds of specific rules binding fully ordained monks and nuns.",null,null],["n2560","pañcatathāgata",650,0,37,30,1736,0,6,-127,["concept"],"Pañcatathāgata. (\"Five tathāgatas\" or \"five conquerors.\") A tantric grouping of five buddhas — Vairocana, Akṣobhya, Amitābha, Ratnasambhava, and Amoghasiddhi — each heading his own buddha \"family\" and mapped onto a rich set of homologies: the five aggregates, five poisons, five wisdoms, five colors, and the cardinal-plus-center layout of the maṇḍala itself. Developing out of earlier, simpler threefold groupings as Mahāyāna doctrine matured, the five tathāgatas were later folded into the separate concept of a single primordial buddha, especially influential in Newari Buddhism.",null,null],["n2561","pañcavargika",650,2,33,21,2856,0,107,204,["concept"],"Pañcavargika. (\"Group of five.\") The five ascetics — Ājñātakauṇḍinya, Aśvajit, Vāṣpa, Mahānāman, and Bhadrika — who practiced austerities alongside the bodhisattva and abandoned him in disgust when he accepted a meal, only to become his first disciples after his enlightenment. Their two founding sermons, on the four noble truths and on nonself, brought each of them first to stream-entry and then to arhatship, making them, together with the Buddha, the first six liberated beings in the world — with their long-running karmic ties to him traced back across numerous jātaka tales of his previous lives.",null,null],["n2576","pārājika",654,2,27,23,1566,0,271,212,["concept"],"Pārājika. (\"Defeat.\") The gravest category of monastic offense, triggering automatic and — in the Pāli tradition — permanent expulsion from the saṃgha: sexual intercourse, theft, killing a human being, or falsely claiming spiritual attainment for monks, with nuns bound by an additional four rules concerning physical contact and complicity. Pāli tradition compares the offender to a severed head or a stone split in two, beyond any possibility of repair, though other traditions like the Mūlasarvāstivāda allow a diminished but still-monastic status of \"pārājika penitent\" rather than total exile.",null,null],["n2580","Paramārtha",655,5,30,23,1602,0,-251,108,["person"],"Paramārtha. (499–569.) An Indian monk-translator who found imperial patronage in Liang-dynasty China, translating a substantial body of Yogācāra texts even as political upheaval — a rebellion that killed his patron emperor — forced him to relocate south and keep working under local rulers. His controversial claim of an immaculate \"ninth consciousness\" beyond the storehouse consciousness, developed further by his She lun zong followers, marked a distinctive interpretive path within Chinese Yogācāra; he died in 569 mid-translation of the Abhidharmakośabhāṣya.",{"start":499,"end":569,"basis":"\"(499–569)\", given directly"},{"lat":23.1765,"lng":75.7885,"label":"Ujjayinī, western India (native place, named directly)"}],["n2582","paramārthasatya",656,5,32,29,1470,0,-319,115,["concept"],"Paramārthasatya. (\"Ultimate truth.\") One half of the two truths, paired against conventional truth, and defined variously across schools rather than as a single fixed doctrine — Vaibhāṣika identifies it with indivisible, momentary particles, while Madhyamaka identifies it with emptiness itself. In every formulation, ultimate truth is whatever object, correctly perceived, does not appear falsely and whose understanding actually leads to liberation, making \"ultimate truths\" properly plural across Buddhist philosophy rather than a single shared referent.",null,null],["n2589","pāramitā",657,1,88,77,2423,0,-106,62,["concept"],"Pāramitā. (\"Perfection.\") A virtue cultivated by a bodhisattva on the path to buddhahood — canonically a set of six (giving, morality, patience, effort, concentration, wisdom), expanded to ten in the Daśabhūmikasūtra by adding method, vow, power, and knowledge, one perfected per stage of the ten bodhisattva grounds. Some Madhyamaka commentators insist these only count as true perfections when practiced with an understanding of emptiness — giving a gift, for instance, without clinging to any notion of giver, gift, or recipient.",null,null],["n2597","paratantra",659,5,29,21,1921,0,-303,118,["concept"],"Paratantra. (\"Other-powered\" or \"dependent.\") The second of Yogācāra's three natures, covering all impermanent phenomena that arise dependent on causes and conditions — specifically, karmic seeds ripening within the storehouse consciousness into states of consciousness. Ordinary beings fail to see this dependent nature clearly because ignorance distorts it into a false subject-object split, the \"imaginary\" nature; recognizing the absence of that false split within the dependent nature is what constitutes the third, \"consummate\" nature.",null,null],["n2602","parikalpita",660,5,29,20,1866,0,-339,131,["concept"],"Parikalpita. (\"Imputed\" or \"imaginary.\") The first of Yogācāra's three natures — the falsely perceived existence of objects as separate, external entities distinct from the consciousness perceiving them. Since Yogācāra denies that external objects exist independently at all, everything an ordinary person takes to be a mind-independent external world counts as parikalpita: a projection generated when karmic seeds ripen into both a perceiving consciousness and its perceived object, which ignorance then mistakes for two genuinely separate things.",null,null],["n2610","parinirvāṇa",661,2,82,79,1744,0,85,150,["concept"],"Parinirvāṇa. (\"Final nirvāṇa.\") The last passage into nirvāṇa at the death of a buddha or arhat, distinguished from the \"nirvāṇa with remainder\" attained earlier at enlightenment, when the causes of future rebirth end but the current body and mind live on to complete their natural term. At parinirvāṇa, that remainder itself is extinguished — no physical or mental constituents remain to be reborn. The term is used above all for Śākyamuni's own death, one of the most depicted scenes in Buddhist art, conventionally shown as the Buddha reclining.",{"start":-480,"end":-480,"basis":"the Buddha's death, via chronology convention"},{"lat":26.7385,"lng":83.8882,"label":"Kuśinagarī (not restated in this entry, cross-referenced from the stūpa entry's account of the Buddha's death)"}],["n2611","pariniṣpanna",662,5,24,20,1265,0,-354,96,["concept"],"Pariniṣpanna. (\"Perfected\" or \"consummate.\") The third and highest of Yogācāra's three natures — the recognition that no object exists as something materially separate from the consciousness perceiving it, once the false imaginary overlay has been stripped from the dependent nature underneath. Described in the Saṃdhinirmocanasūtra as the ultimate lack of intrinsic nature, this consummate nature is Yogācāra's candidate for the highest reality accessible to a purified mind.",null,null],["n2636","Pāṭaliputra",667,2,28,22,1944,0,235,222,["place"],"Pāṭaliputra. Capital of Magadha and later the entire Mauryan empire, prophesied for greatness by the Buddha himself when it was still the humble village of Pāṭaligāma, and reaching its imperial peak under Aśoka, whose realm stretched from Afghanistan to Bengal. Site of the third Buddhist council according to Pāli chronicles, from which missions were reportedly dispatched to nine neighboring lands — a claim partially corroborated by Aśoka's own inscriptions describing diplomatic outreach. Known to the Greeks as Palibothra and described firsthand by the envoy Megasthenes, it later served again as Gupta imperial capital before falling to ruin, finally destroyed in the Muslim invasions of the twelfth century.",{"start":-268,"end":-232,"basis":"\"reached its greatest glory during the reign of the third Mauryan emperor, Aśoka\""},{"lat":25.6127,"lng":85.1228,"label":"Pāṭaliputra, near modern Patna, Bihar, India (named directly as the entry's subject)"}],["n2662","phala",673,1,42,23,2422,0,-139,222,["concept"],"Phala. (\"Fruition,\" \"effect,\" or \"result.\") A term spanning three registers: the physical or mental effect of any cause, the fruition of the four supramundane paths from stream-enterer to arhat, and the specific \"retributive fruition\" of a ripened karmic deed. Sarvāstivāda and Yogācāra abhidharma sort effects into five distinct types — correlative, retributive, disconnective, virile, and predominant — a granular taxonomy of exactly how causes translate into consequences; tantra itself is sometimes called the \"fruition vehicle\" for building the fruit of buddhahood directly into its practice.",null,null],["n2685","phyi dar",677,3,36,24,1714,0,-308,-183,["concept"],"Phyi dar. (\"Later dissemination.\") The second great wave of Buddhist transmission to Tibet, beginning in the eleventh century after a near two-century \"dark period\" following the earlier dissemination's collapse — marked by Rin chen bzang po's translation expeditions to India and capped by Atiśa's arrival in 1042. Its fresh \"new\" translations of tantras became foundational to the Bka' gdams, Sa skya, Bka' brgyud, and later Dge lugs sects, in deliberate contrast to the Rnying ma sect's continued reliance on \"old\" translations from the earlier dissemination.",{"start":1000,"end":1100,"basis":"the \"later dissemination\" \"commenced in earnest in the eleventh century\""},{"lat":29.6467,"lng":91.117,"label":"Tibet (general placeholder — the dissemination spans the whole region)"}],["n2699","Pojo Chinul",680,7,56,40,3748,0,-74,-212,["person"],"Pojo Chinul. (1158–1210.) The premier Sŏn master of the Koryŏ dynasty, alongside Wŏnhyo one of the two most influential monks in Korean Buddhist history, who preferred his own cognomen \"Oxherder.\" After ordination and a series of awakening experiences reading the Platform Sūtra, Li Tongxuan's Huayan commentary, and the recorded sayings of Chan master Dahui Zonggao, he founded the Samādhi and Prajñā Retreat Society, later renamed Susŏnsa. Renowned for reconciling scriptural study with Sŏn practice through a scheme of sudden awakening followed by gradual cultivation, and for introducing \"questioning meditation\" (kanhwa Sŏn) into Korea, where it has held pride of place ever since.",{"start":1158,"end":1210,"basis":"\"(1158–1210)\", given directly"},{"lat":37.9706,"lng":126.5645,"label":"Kaesŏng, Korea (birthplace region, named directly in the entry)"}],["n2706","ponsa",682,7,27,27,2193,0,76,-286,["concept"],"Ponsa. (\"Foundational monastery.\") Korea's district-level head monasteries, an institution the state used repeatedly to exert administrative control over Buddhism — first consolidated under Chosŏn king T'aejong in 1407, discontinued when the Kyo and Sŏn schools were abolished, then revived under Japanese colonial administration in 1911 with thirty-one designated districts. The modern Chogye order inherited and adapted the system, organizing today's twenty-five ponsa (including Chogyesa, Haeinsa, and Pulguksa) each overseeing a network of smaller affiliated branch monasteries in its region.",null,null],["n2730","prajñā",688,1,120,111,2301,0,-127,82,["concept"],"Prajñā. (\"Wisdom,\" closer to \"gnosis\" or \"awareness.\") Accurate discernment of reality that goes beyond ordinary understanding — one of five mental factors accompanying all virtuous states of mind, and the third of the three trainings alongside morality and concentration, likened to a sword cutting through the web of ignorance. Distinguished into three grades: wisdom from hearing teachings, from one's own reflection on them, and from meditative cultivation — the last being the deepest. Compounds with pāramitā to form prajñāpāramitā, the perfection of wisdom that yields buddhahood itself.",null,null],["n2736","prajñāpāramitā",689,5,132,126,3442,0,-171,17,["concept","work"],"Prajñāpāramitā. (\"Perfection of wisdom.\") Both the wisdom of buddhahood — understanding that no agent, object, or action is ultimately real — and the genre of sūtras expounding it, among the earliest Mahāyāna scriptures, appearing between the first century BCE and first century CE. Individual sūtras are named simply for their length in verses: eight thousand lines, twenty-five thousand, a hundred thousand. Its central figure is paradoxically gendered female in Sanskrit, giving rise to Prajñāpāramitā as a goddess venerated as the mother of all buddhas.",{"start":-100,"end":100,"basis":"\"first texts appearing sometime between the first century BCE and the first century CE\""},null],["n2737","Prajñāpāramitāhṛdayasūtra",690,5,37,15,4354,0,-142,-5,["work"],"Prajñāpāramitāhṛdayasūtra. (\"Heart Sūtra.\") The most widely recited of all Mahāyāna sūtras despite its extreme brevity, staging the bodhisattva Avalokiteśvara's answer to Śāriputra on how to train in the perfection of wisdom as a systematic negation of Buddhism's own core categories — culminating in the celebrated line \"form is emptiness, emptiness is form\" and the mantra gate gate pāragate pārasaṃgate bodhi svāhā. Genuinely disputed among scholars is whether the shorter, more widely used version is an original Indian composition or actually a Chinese digest of Xuanzang's own translation of the larger perfection-of-wisdom corpus, later back-translated into Sanskrit — which, if true, would make it the single most influential indigenous Chinese scripture ever produced.",null,null],["n2755","pramāṇa",693,3,38,34,1683,0,-384,-37,["concept"],"Pramāṇa. (\"Valid knowledge\" or \"means of knowledge.\") Technically, a consciousness not deceived about its object, with most Buddhist schools recognizing exactly two forms — direct perception and inference — a deliberately narrower list than rival Hindu schools, which also counted scriptural sound (the Vedas) as valid. Dignāga and Dharmakīrti's extensive elaboration of these two categories became hugely influential across medieval India and Tibet, far less so in East Asia, and the term itself came to stand more broadly for the entire discipline of Buddhist epistemology and logic.",null,null],["n2764","praṇidhāna",695,0,24,16,1599,0,45,-50,["concept"],"Praṇidhāna. (\"Vow\" or \"aspiration.\") A solemn statement of intent to achieve a specific aim, most famously the bodhisattva's vow to reach buddhahood for the sake of all beings — a \"prior vow\" whose eventual fulfillment is guaranteed once buddhahood is actually attained. The best-known example is Dharmākara's forty-eight vows before the buddha Lokeśvararāja, which culminated in his becoming Amitābha and creating the pure land Sukhāvatī, foundational to all of East Asian pure land practice.",null,null],["n2783","pratigha",699,1,32,17,1470,0,-264,175,["concept"],"Pratigha. (\"Aversion\" or \"hostility.\") A primary mental affliction closely synonymous with dveṣa, ranked second among the six fundamental afflictions in Vaibhāṣika abhidharma and generating a cluster of secondary afflictions — anger, enmity, agitation, envy, harmfulness — all rooted in the same basic repulsion toward a displeasing stimulus. Because it carries both cognitive and emotional weight, it can't be eliminated by insight alone at the path of vision; overcoming it requires the sustained, repeated training of the path of cultivation.",null,null],["n2786","prātimokṣa",699,2,63,63,611,0,203,137,["concept","work"],"Prātimokṣa. (\"Code\" or \"rules.\") The disciplinary code governing fully ordained monks and nuns, or the text setting it out — probably the oldest layer of the various Buddhist vinayas, recited communally to maintain monastic cohesion. Its pre-Buddhist meaning is uncertain, perhaps \"a promise to be redeemed\"; in Buddhist usage it comes to denote a binding obligation and, by extension, formal monastic regulation itself.",null,null],["n2799","pratītyasamutpāda",702,1,73,65,3753,0,-179,151,["concept"],"Pratītyasamutpāda. (\"Dependent origination.\") The principle that nothing arises except in dependence on something else — according to tradition, the Buddha's core insight on the seventh night after his enlightenment at Bodhgayā. Formalized as a twelvefold chain running from ignorance through to old age and death, each link conditioning the next; a shorter ten-link version in some texts suggests the standard twelve developed over time. Charts a genuine middle way between eternalism (a soul persists unchanged) and annihilationism (the person simply ends) — when asked \"who is reborn,\" the Buddha reframes the question entirely: not who, but what conditions what.",{"start":-525,"end":-525,"basis":"\"the fundamental insight on the night of his enlightenment\"; chronology convention"},{"lat":24.6961,"lng":84.9911,"label":"Bodhgayā (site of enlightenment; not restated in this entry, cross-referenced from nirvāṇa/Śākyamuni)"}],["n2804","pratyakṣa",704,1,28,21,1880,0,-328,213,["concept"],"Pratyakṣa. (\"Direct perception.\") One of only two forms of valid knowledge in Buddhist epistemology, alongside inference — cognition that correctly grasps its object without the conceptual mediation of an image. Four types exist: sensory perception through the five senses, a fleeting mental perception bridging sensory input into conceptual thought, self-knowing perception that makes memory possible by observing consciousness observing itself, and yogic perception, achieved only on the noble path through a union of calm and insight.",null,null],["n2809","pratyaya",705,1,37,24,9648,0,-244,297,["concept"],"Pratyaya. (\"Condition.\") The subsidiary factors that, alongside a primary cause, jointly produce an effect — heat and moisture supporting a seed's cause in producing a sprout. The Pāli abhidhamma's Paṭṭhāna elaborates an extraordinarily granular list of twenty-four distinct types of condition, from the \"root condition\" of greed, hatred, or delusion underlying unwholesome states to conditions defined purely by an event's mere presence or impending disappearance — a comprehensive attempt to map, with almost obsessive precision, every way one thing can causally support another.",null,null],["n2810","pratyekabuddha",706,5,69,63,1980,0,-147,94,["concept"],"Pratyekabuddha. (\"Solitary buddha.\") One who achieves arhatship through his own effort, without a teacher, but — unlike a fully enlightened buddha — declines to teach others, having never developed the requisite great compassion. Distinguished from a śrāvaka not just by self-sufficiency but by the sheer time required: a pratyekabuddha must accumulate enough merit across lifetimes to succeed entirely alone. Mahāyāna groups the pratyekabuddha and śrāvaka paths together as the \"lesser vehicle,\" contrasted with the bodhisattva's path to full buddhahood.",null,null],["n2816","pravrajita",708,2,37,22,2904,0,224,176,["concept"],"Pravrajita. (\"Going forth.\") The act of leaving lay life to enter the monastic community, technically referring to a novice's lower ordination as distinct from the higher ordination of full monkhood — a distinction introduced only after the Buddha's earliest days, when going forth and full ordination were originally a single unified ceremony performed with the simple refuge formula. Performed with a similarly minimal ritual of shaving, robing, and reciting the threefold refuge, the novice stage still carries the same lengthy list of disqualifying conditions found in full ordination, from criminal history to physical disability.",null,null],["n2817","prayoga",708,5,32,12,3172,0,-347,110,["concept"],"Prayoga. (\"Application\" or \"exertion.\") In logic, a formal three-part syllogism — subject, property to be proved, and reason — governed by strict rules about how reason and property must relate. In the Abhisamayālaṃkāra's exegetical scheme, prayoga instead names four progressive stages of meditative practice through which a bodhisattva masters, then stabilizes, then perfects, and finally instantaneously realizes every aspect of a buddha's omniscient knowledge — the last of the eight \"clear realizations\" standing just before omniscience itself is attained.",null,null],["n2818","prayogamārga",709,1,29,23,1173,0,-242,252,["concept"],"Prayogamārga. (\"Path of preparation.\") The second of the five paths, sitting between accumulation and vision, where a practitioner develops concentration equal to or surpassing calm abiding and moves through four increasingly refined levels — heat, peak, forbearance, and supreme worldly dharmas. Not yet a \"noble path\" since direct perception of reality hasn't occurred, its completion is what finally opens the door to the path of vision and the transition from ordinary being to noble person.",null,null],["n2820","preta",709,6,33,31,1960,0,180,23,["concept"],"Preta. (\"Hungry ghost.\") One of Buddhism's unfortunate rebirth realms, its inhabitants marked by distended bellies and needle-thin throats that make satisfying hunger permanently impossible — a punishment for greed and avarice in a past life. Water turns to blood, food turns to spears or molten iron the moment it's approached or swallowed, and feeding these wandering spirits ritually remains an important Buddhist monastic practice across many societies to this day.",null,null],["n2824","pṛthagjana",710,1,38,32,1005,0,-148,289,["concept"],"Pṛthagjana. (\"Ordinary being.\") Anyone still bound by the ten fetters who has not yet reached the path of vision or become a stream-enterer — persistently unfavorably contrasted with the noble person in Buddhist texts. One vivid simile captures the gap: the suffering inherent in mere conditioned existence is like a wisp of wool resting unnoticed in an ordinary person's palm, but like a wisp of wool lodged in a noble person's eye — impossible to ignore, demanding immediate action.",null,null],["n2826","pudgala",710,2,33,25,1996,0,-88,229,["concept"],"Pudgala. (\"Person.\") A provisional designation for personal identity that every Buddhist school accepts in some form while uniformly denying any permanent, autonomous self behind it — the real philosophical puzzle being how karmic continuity survives across lifetimes without one. The Vātsīputrīya and Sāṃmitīya schools proposed a controversial solution: an \"inexpressible\" person, neither identical to nor different from the aggregates, that carries karma forward — a position Vasubandhu attacked as a disguised, heretical self by another name.",null,null],["n2839","puṇya",714,1,39,32,1163,0,-16,102,["concept"],"Puṇya. (\"Merit.\") The store of wholesome karma generated by virtuous deeds, accumulated over lifetimes and deliberately dedicated toward chosen outcomes — a favorable rebirth, rebirth alongside the future buddha Maitreya, or buddhahood itself for the sake of all beings. Pāli sources name three grounds for generating it: giving, morality, and meditative practice, with charity to the saṃgha standing as one of Buddhism's most universally central practices across every culture it has reached.",null,null],["n2847","pure land",716,0,125,121,2177,0,148,-134,["concept"],"Pure land. An English umbrella term (no single Sanskrit equivalent) covering at least five related ideas: any buddha-field purified for rebirth; specifically Amitābha's Sukhāvatī; the broader Mahāyāna textual tradition describing such fields; the East Asian and Tibetan practice tradition aimed at rebirth there; and the Jōdoshū/Jōdo Shinshū schools of Japan. Notably, there was never an institutional \"pure land school\" in India itself — rebirth in Sukhāvatī was simply one widespread goal among many Mahāyāna practitioners, only later consolidating into distinct sectarian schools in Japan.",null,null],["n2853","pūrvanivāsānusmṛti",717,1,34,13,4196,0,0,177,["concept"],"Pūrvanivāsānusmṛti. (\"Recollection of former abodes\" — memory of past lives.) One of the six superknowledges and one of the three types of knowledge realized at enlightenment, achieved through deep meditative concentration and thus accessible even to non-Buddhist yogins. The Visuddhimagga ranks recall capacity by spiritual attainment — ordinary disciples reach back a thousand eons, the Buddha's chief disciples an incalculable age, buddhas themselves limitless past lives — while the Buddha's own enlightenment narrative places this recollection in the first watch of the awakening night, followed by the divine eye and finally the knowledge that ends all contamination.",null,null],["n2859","Pusa yingluo benye jing",719,5,26,6,4454,0,-79,-14,["work"],"Pusa yingluo benye jing. (\"Book of the Original Acts that Adorn the Bodhisattva.\") A Chinese apocryphal sūtra highly influential on Chan and Tiantai exegetes, best known for synthesizing competing path schemas into a comprehensive fifty-two-stage bodhisattva career — adding a preliminary \"ten faiths\" stage to the Avataṃsakasūtra's forty-two named stages — and for its widely cited threefold classification of bodhisattva morality into restraint, cultivation of virtue, and active service to other beings. Its attribution to the translator Zhu Fonian remains disputed, complicated by borrowed passages from other indigenous Chinese sūtras and its genuine but distinct namesake, the authentic third-century translation Pusa benye jing.",{"start":400,"end":500,"basis":"\"internal and external evidence... suggests that the Yingluo jing is a Chinese apocryphon from the fifth century\""},null],["n2887","rāga",726,1,39,33,1769,0,-140,178,["concept"],"Rāga. (\"Passion\" or \"desire.\") One of the three poisons alongside aversion and delusion, arising whenever contact with an object occurs without proper introspection — a pursuing, grasping reaction toward anything from sensual pleasure to abstract ideologies to the future continuation or annihilation of the self. Crucially, its object must be karmically \"contaminated\"; this technical restriction is what allows Buddhist texts to insist that the aspiration for enlightenment itself is not a form of desire, since nirvāṇa and buddhahood are, by definition, uncontaminated objects.",null,null],["n2889","Rājagṛha",727,2,57,48,2339,0,118,144,["place"],"Rājagṛha. Capital of the kingdom of Magadha under King Bimbisāra, the Buddha's first royal patron, and — together with Śrāvastī — one of the two most important centers of the Buddha's ministry. Site of the Veṇuvanavihāra (\"Bamboo Grove Monastery\") where the Buddha spent several rains retreats, of Vulture Peak where the Prajñāpāramitā sūtras were said to be delivered, and of the first Buddhist council held immediately after the Buddha's death. Also where the great monastic university of Nālandā later arose on its outskirts — though by the time the Chinese pilgrim Xuanzang visited in the seventh century CE, the city itself lay in ruins.",{"start":-560,"end":-480,"basis":"period of greatest prominence, as capital of Magadha during the Buddha's lifetime (chronology convention)"},{"lat":25.0268,"lng":85.4212,"label":"Rājagṛha (modern Rajgir, Bihar, India) — named directly as the entry's subject"}],["n2902","rang stong gzhan stong",731,5,27,6,4501,0,-335,-4,["concept"],"Rang stong gzhan stong. (\"Self-emptiness, other-emptiness.\") A fifteenth-century Tibetan doctrinal fault line pitting the Dge lugs, who hold that all phenomena — even a buddha's omniscient mind — are equally empty of any intrinsic nature whatsoever, against the Jo nang, who argue for a positive \"other-emptiness\": an eternal, self-arisen wisdom consciousness empty only of extraneous defilement, not of its own true nature. Both sides claim Candrakīrti and Nāgārjuna as authorities, with the Jo nang relegating Candrakīrti's negative dialectic to a \"one-sided\" reading and instead privileging Nāgārjuna's more positively worded devotional hymns as his truest final view.",{"start":1400,"end":1500,"basis":"\"an important and persistent philosophical debate in Tibetan Buddhism, dating to the fifteenth century\""},null],["n2921","Ratnakūṭasūtra",736,5,34,13,2109,0,-76,-29,["work"],"Ratnakūṭasūtra. (\"Jewel-Heap Sūtra.\") Despite its singular title, an early anthology of forty-nine independent Mahāyāna sūtras spanning emptiness, pure land practice, and the specifics of bodhisattva versus śrāvaka monastic discipline, with pieces on both Amitābha's and Akṣobhya's pure lands. Individual sections began reaching China as early as the second century CE, but the collection wasn't assembled into its best-known, massive 120-roll Chinese form until Bodhiruci's Tang-dynasty translation between 703 and 716, incorporating earlier renderings by Dharmarakṣa, Kumārajīva, and others along the way.",{"start":100,"end":200,"basis":"excerpts \"translated into Chinese as early as the second century CE\""},null],["n2926","ratnatraya",737,2,66,50,2996,0,53,77,["concept"],"Ratnatraya. (\"Three jewels\" — the triple gem.) The Buddha, dharma, and saṃgha, together the three objects of Buddhist veneration and the object of a formula — \"I go to the Buddha/dharma/saṃgha for refuge\" — that formally identifies someone as a Buddhist upon its threefold recitation. Each term admits multiple readings: \"Buddha\" can mean the historical Śākyamuni, any Mahāyāna buddha, or innate buddhahood itself; \"dharma\" in this specific context is often narrowed to just the third and fourth noble truths; \"saṃgha\" here technically means only its noble, awakened members, not the ordained at large.",null,null],["n2942","rdzogs chen",740,3,66,52,5693,0,-224,-231,["concept","work"],"Rdzogs chen. (\"Great perfection.\") A Tibetan meditative and philosophical tradition centered in the Rnying ma sect but embraced to varying degrees elsewhere, including the non-Buddhist Bon religion — despite legendary claims of a lineage running back through Padmasambhava and Vimalamitra to a primordial buddha, historically appears to be a genuine Tibetan innovation blending native belief with imported Chinese and Indian teachings. Its literature developed in three phases — mind, space, and instruction classes — with the eleventh-to-fourteenth-century instruction-class texts fully absorbing tantric technique into what had begun as a doctrine explicitly suspicious of formal practice.",{"start":1000,"end":1400,"basis":"the instruction-class literature, \"dating from the eleventh to fourteenth centuries\""},{"lat":29.6467,"lng":91.117,"label":"Tibet (general placeholder — Lhasa; entry describes it as \"a Tibetan innovation\" with no single site)"}],["n2946","rebirth",741,6,40,13,3970,0,28,154,["concept"],"Rebirth. A doctrine Buddhism inherited rather than invented, already widespread among the śramaṇa movements of ancient India, describing a beginningless process in which a mental continuum takes new form, lifetime after lifetime, across six possible realms driven entirely by the moral quality of past action. Reconciling this cycle with the denial of a perduring self has occupied Buddhist philosophy since its beginnings — most schools describe the person as simply a shifting sequence of mental and physical processes, transferred at death like a flame passed from one candle to the next, though the controversial Pudgalavāda posited an \"inexpressible person\" to carry karmic continuity instead.",null,null],["n2955","Renwang jing",743,5,31,10,4365,0,-65,-56,["work"],"Renwang jing. (\"Scripture for Humane Kings.\") An indigenous Chinese apocryphon central to \"state protection Buddhism,\" unusual for addressing kings rather than monks or bodhisattvas as its interlocutors — casting royal patronage and monastic virtue as mutually constitutive, so that serving the dharma turns a king into a bodhisattva just as a bodhisattva's vocation renders him a kind of king. Chinese scriptural cataloguers doubted its authenticity as early as 594, citing telltale errors only a Chinese author could make, such as listing two different Chinese translations of the same Indian sūtra as though they were separate texts — yet by 602 it had been officially reclassified as an authentic translation anyway, and has remained so listed ever since.",{"start":450,"end":450,"basis":"internal evidence leads scholars to date the composition \"to sometime around the middle of the fifth century\""},null],["n2974","Rinzaishū",748,7,67,55,4704,0,118,-419,["school"],"Rinzaishū. Japanese Zen school established in the early Kamakura period, tracing to the Chinese master Linji Yixuan via Myōan Eisai's two trips to China. Virtually the entire tradition descends from the Yangqi collateral line of the Linji lineage; twenty-four transmission lineages reached Japan, twenty-one of them Rinzai. Rose to prominence under shogunal and imperial patronage through the state-organized \"five mountains\" (gozan) temple system, declined by the Edo period, and was revitalized by Hakuin Ekaku, whose systematized kōan curriculum still structures Rinzai training today.",{"start":1150,"end":1250,"basis":"founder Myōan Eisai's dates (1141–1215) and the school's \"early Kamakura period\" establishment"},{"lat":35.6762,"lng":139.6503,"label":"Japan (general placeholder — Tokyo/Kantō; no specific site named)"}],["n2975","ris med",748,3,28,21,3526,0,-325,-136,["concept"],"Ris med. (\"Unbounded\" or \"impartial\" — nonsectarian.) A religious ideal, most associated with nineteenth-century eastern Tibet, promoting the study of multiple sects' teachings without erasing the distinctions between them — epitomized by 'Jam mgon kong sprul, a Bka' brgyud lama raised Bon and ordained Rnying ma, whose scholarship modeled genuine cross-sectarian engagement while carefully preserving each lineage's separate identity. Despite popular Western framing of this as an organized \"nonsectarian movement,\" historians note it was really a shared ideal expressed through a few towering individual careers rather than a coordinated institutional reform — though it has since become a durable symbol of unity for the Tibetan exile community.",{"start":1727,"end":1727,"basis":"origins \"traced to the founding of Dpal spungs monastery, established in 1727\""},{"lat":32.28,"lng":98.58,"label":"Sde dge, Kham, eastern Tibet (center of the movement's origin)"}],["n2989","Rnying ma",752,3,110,101,3429,0,-267,-260,["school"],"Rnying ma. (\"Ancient.\") Oldest of the four major Tibetan Buddhist schools, tracing its founding to the eighth-century arrival of Padmasambhava, who reportedly concealed teachings as \"treasures\" (gter ma) for later discovery. Named \"ancient\" only in retrospect, once the Bka' brgyud, Sa skya, and Dge lugs schools arose using newer translations from Tibet's later dissemination of Buddhism. Ranks the Great Perfection (rdzogs chen) as its highest teaching — an unmediated, non-conceptual recognition of the mind's own primordially pure nature — and, alone among the major schools, stayed largely outside state politics.",{"start":750,"end":800,"basis":"Padmasambhava \"visited Tibet during the eighth century\""},{"lat":29.6467,"lng":91.117,"label":"Tibet (general placeholder — Lhasa; no specific founding site named)"}],["n3001","rūpa",754,1,54,44,1575,0,-165,295,["concept"],"Rūpa. (\"Body,\" \"form,\" or \"materiality.\") Broadly, whatever has shape and is composed of matter — the objects of the five physical senses and the first of the five aggregates, covering all of a person's physical constituents. Narrowly, just the colors and shapes seen by visual consciousness specifically, the sense in which rūpa counts among the twelve sense-fields and eighteen elements. In the compound \"name and form,\" rūpa denotes the entire physical body set against the four mental aggregates grouped under \"name\" — and in some Mahāyāna sūtras, since form heads every standard list of factors, \"form and so on\" becomes shorthand for the emptiness of all dharmas whatsoever.",null,null],["n3002","rūpadhātu",755,1,76,64,3891,0,15,319,["concept"],"Rūpadhātu. (\"Realm of subtle materiality\" or \"form realm.\") The middle of Buddhist cosmology's three realms, between the sensuous realm below and the immaterial realm above — accessible only by mastering one of four meditative absorptions in a prior life. Its inhabitants, classed as Brahmā gods, retain only the barest trace of physicality: three senses instead of five, ever taller bodies and longer lifespans at each of seventeen ascending sublevels. Its fourth and subtlest heaven is considered an ideal springboard to nirvāṇa — the Buddha's own mind is said to have passed through it on the way to his final extinction.",null,null],["n3007","rūpāvacaradhyāna",756,1,28,20,2277,0,-69,389,["concept"],"Rūpāvacaradhyāna. Meditative absorption tied to the subtle-materiality realm, unfolding across four progressively subtler stages as five hindrances are allayed one by one and the five constituents of absorption fall away in sequence — from all five present in the first absorption down to only one-pointedness remaining in the fourth. Mastering the fourth stage is a prerequisite for developing supranormal powers and for advancing into the four still-subtler immaterial absorptions, and can itself result in rebirth as a Brahmā god within the corresponding heavenly plane.",null,null],["n3039","Saddharmapuṇḍarīkasūtra",762,5,142,127,7254,0,-3,-55,["work"],"Saddharmapuṇḍarīkasūtra. (\"Sūtra of the White Lotus of the True Dharma\" — the Lotus Sūtra.) Among the most influential Mahāyāna sūtras, composed in India from as early as the first or second century CE and later expanded with interpolated chapters. Its parable of the burning house recasts the Buddha's earlier teaching of three separate vehicles as mere skillful expedients — there is truly only one vehicle, leading all beings to buddhahood — while its parable of the dying father reveals the Buddha's apparent death as itself only a display. Became the founding scripture of Tiantai in China and Tendai in Japan, and the sole authoritative text for Nichiren Buddhism.",{"start":0,"end":200,"basis":"\"earliest portions... composed as early as the first or second centuries of the Common Era\""},{"lat":25.61,"lng":85.14,"label":"India (general placeholder — Magadha; no specific composition site named)"}],["n3043","sādhana",764,3,47,31,3886,0,-172,-79,["concept"],"Sādhana. (\"Method\" or \"technique.\") A tantric ritual for receiving attainments from a deity, performed either by inviting the deity to appear and be worshipped, or by the meditator directly visualizing themselves as the deity, already possessed of an enlightened body, speech, and mind. Elaborate sādhanas follow a set architecture: a sevenfold preliminary service of homage and confession, taking refuge and generating bodhicitta, meditation on emptiness, construction of a maṇḍala, and the invitation of actual \"wisdom beings\" to merge with their visualized \"pledge being\" doubles — ending, after the requested boons are sought, with the entire visualization dissolving back into emptiness.",null,null],["n3044","sādhana",765,3,35,31,1036,0,-244,-135,["concept"],"Sādhana. (\"Proof\" — in this sense, a logical syllogism.) In Indian logic, a formal proof statement, reduced by the Buddhist logician Dignāga from the Nyāya school's cumbersome five-step syllogism (proposition, reason, analogy, application, conclusion) down to a leaner three: thesis, reason, and exemplification — \"the mountain is on fire, because there is smoke, like a stove, unlike a lake.\" A distinct sense of the same word, referring to tantric ritual technique, is treated separately elsewhere in the dictionary.",null,null],["n3067","Saichō",770,0,29,13,3961,0,27,-155,["person"],"Saichō. (767–822.) Founder of Japanese Tendai, ordained at Tōdaiji before retreating to Mt. Hiei, where imperial attention followed once the capital moved to nearby Kyōto. His 804 trip to China to study Tiantai doctrine under Jingqi Zhanran's disciples secured imperial backing to found an independent Tendai sect; his later rivalry with Kūkai over tantric initiation, and his prolonged, only posthumously successful campaign to replace Hīnayāna monastic precepts with purely Mahāyāna bodhisattva ordination at Mt. Hiei, both shaped the distinctive institutional shape Japanese Tendai would take.",{"start":767,"end":822,"basis":"\"(767–822)\", given directly"},{"lat":35.0708,"lng":135.8408,"label":"Mt. Hiei, Japan (where he founded the Tendai tradition)"}],["n3077","Śakra",772,6,37,28,2267,0,218,49,["deity"],"Śakra. Buddhism's own, notably less warlike, version of the Vedic god Indra — chief of the gods of the heaven of the thirty-three and the divinity who appears more often in Buddhist scripture than any other. A devoted, recurring assistant to the Buddha across multiple lifetimes, he catches Prince Siddhārtha's cut-off royal locks and enshrines them in heaven, builds the jeweled ladder for the Buddha's celebrated descent from teaching his mother in the heaven of the thirty-three, and — in one of Buddhist literature's more disarmingly human details — personally carries the dying Buddha's chamber pot during his final illness.",null,null],["n3078","sakṛdāgāmin",773,1,58,38,2210,0,-36,340,["concept"],"Sakṛdāgāmin. (\"Once-returner.\") The second of the four grades of noble person, above the stream-enterer and below the nonreturner and arhat — one who has fully abandoned the first three of ten fetters binding beings to rebirth (self-view, doubt, and belief in the efficacy of rites) and substantially weakened the fourth and fifth (sensual craving and malice). Destined for at most one more rebirth in the sensuous realm, though possibly further rebirths in the higher realms of form or formlessness before reaching nirvāṇa — a status defined entirely by exactly how many of the nine levels of affliction have been eliminated.",null,null],["n3080","sakṛdāgāmiphalastha",773,1,29,13,3033,0,-86,370,["concept"],"Sakṛdāgāmiphalastha. (\"One who has reached the fruit of once-returner.\") The completed counterpart to the once-returner \"candidate\" (sakṛdāgāmiphalapratipannaka) — the candidate has traversed only the \"unimpeded path,\" while this figure has gone on to the \"path of freedom\" that actually secures the fruition. In Mahāyāna reinterpretation, the same term is repurposed to describe celestial bodhisattvas in their final life before Tuṣita heaven, on the verge of complete buddhahood rather than mere once-returning.",null,null],["n3083","Śākya",774,2,35,29,1827,0,96,103,["other"],"Śākya. The north Indian Kṣatriya-ruled tribe that produced the historical Buddha, ruled in his lifetime by his father Śuddhodana from the capital Kapilavastu, and claiming descent from the legendary solar king Ikṣvāku. Nominally self-governing but subject to the neighboring kingdom of Kośala, the tribe was annexed and largely massacred by the Kośalan king Virūḍhaka after his mother — provided to his father as a bride — was revealed to have been a servant, an invasion the Buddha himself reportedly tried, unsuccessfully in the end, to dissuade.",{"start":-560,"end":-480,"basis":"the tribe's period of greatest attestation, contemporary with the Buddha; chronology convention"},{"lat":27.5667,"lng":83.05,"label":"Kapilavastu region, Nepal-India border (the tribe's homeland, named directly)"}],["n3085","Śākyamuni",774,2,150,124,3531,0,92,-3,["person"],"Śākyamuni. (\"Sage of the Śākya clan.\") The most common Mahāyāna epithet for the historical Buddha, born Siddhārtha Gautama into the kṣatriya Śākya clan in the Himalayan foothills near today's Nepal-India border. The dictionary treats his biography deliberately non-linearly — the tradition itself didn't attempt a single connected life story until centuries after his death — scattering the birth, renunciation, enlightenment under the Bodhi tree, and forty-five years of teaching across separate entries rather than one continuous narrative.",{"start":-560,"end":-480,"basis":"traditional lifespan, corrected long chronology (see buddhavarṣa entry) — not restated in this entry itself"},{"lat":27.4833,"lng":83.2761,"label":"Lumbini area, Nepal-India border (per this entry: \"Śākya clan flourished in the foothills of the Himālayas, near the border between present-day Nepal and India\")"}],["n3092","samādhi",776,1,151,127,3506,0,-55,111,["concept"],"Samādhi. (\"Concentration.\") The capacity to fix and sustain one-pointed attention on a single object — one of five determinative mental factors in Abhidharma psychology, and the final step of the eightfold path. Distinguished from the stability of a merely calm mind by its power to cut through ignorance, samādhi ranges from the preparatory concentration of a session's start through to full absorption (dhyāna). Mahāyāna sūtras describe well over a hundred named samādhis attained by advanced bodhisattvas, each a distinct meditative state.",null,null],["n3100","Samantabhadra",778,0,47,29,1906,0,-46,-95,["deity"],"Samantabhadra. A principal Mahāyāna bodhisattva personifying the perfection of good works, standing at Śākyamuni's side opposite Mañjuśrī and serving, in the Gaṇḍavyūha, as the final and culminating teacher in Sudhana's long search for guidance — the one who sets forth the ten vows of the famous Bhadracarīpraṇidhāna. His Chinese cult centers on Emeishan in Sichuan, where legend has him arriving astride his signature white elephant. In the Rnying ma sect of Tibetan Buddhism he takes on an entirely different role as the primordial buddha, depicted naked and blue in union with his consort, embodying the eternal union of awareness and emptiness at the root of the Atiyoga teachings.",null,{"lat":29.5197,"lng":103.4325,"label":"Emeishan, Sichuan, China (named directly as the center of his worship)"}],["n3103","Samantapāsādikā",779,2,26,13,1439,0,238,185,["work"],"Samantapāsādikā. (\"Entirely Pleasing.\") Buddhaghosa's fifth-century commentary on the vinaya, opening with an extensive historical introduction running from the Buddha's death through the first three councils to the vinaya's recitation in Sri Lanka under King Devānaṃpiyatissa. Rich in historical and geographical detail on Indian monasteries, kings, and Aśoka's missionary dispatches across South and Southeast Asia, it also preserves an account of Moggaliputtatissa, compiler of the Kathāvatthu.",{"start":400,"end":450,"basis":"\"fifth-century commentary... written in Sri Lanka by... Buddhaghosa\", whose dates are given elsewhere as \"fl. c. 370–450 CE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Mahāvihāra tradition, where Buddhaghosa composed it)"}],["n3105","samāpatti",779,1,24,19,2293,0,-203,292,["concept"],"Samāpatti. (\"Attainment\" or \"trance.\") Eight levels of deep meditative concentration correlating with the eight absorptions of the subtle-materiality and immaterial realms, sometimes extended to a ninth — the attainment of the cessation of perception and sensation. Achieving any of these states through meditation while human determines rebirth into the corresponding cosmological level in the next life, a stratified attainment-scheme with parallels in non-Buddhist yogic systems as well.",null,null],["n3108","śamatha",780,1,61,45,3101,0,-144,157,["concept"],"Śamatha. (\"Calmness\" or \"serenity.\") One of the two chief branches of Buddhist meditative cultivation alongside insight — the specific degree of concentration needed to generate insight into reality and thereby destroy the afflictions. Cultivated across nine stages in which eight counteracting forces overcome five hindrances (laziness, forgetfulness, restlessness, under- and over-application of antidotes), moving from effortful desire and faith toward a self-sustaining stream of tranquility marked by physical rapture and mental ease. In monastic law the same word is also used technically for the formal settlement of disputes within the saṃgha.",null,null],["n3117","saṃbhāramārga",782,1,27,13,1940,0,-208,151,["concept"],"Saṃbhāramārga. (\"Path of accumulation.\") The first of the five paths, opening with either disgust for saṃsāra (for those seeking nirvāṇa) or the generation of bodhicitta (for those on the Mahāyāna path), and subdivided into small, middling, and large stages tied respectively to the four foundations of mindfulness, the four right efforts, and the four bases of psychic power. Like the path of preparation that follows it, it is not yet a \"noble path,\" since direct perception of reality has not yet occurred — Mahāyāna abhidharma likens its three stages to earth, gold, and finally the capacity to see a buddha's emanation body directly.",null,null],["n3119","saṃbhogakāya",782,13,34,28,1704,0,-18,-24,["concept"],"Saṃbhogakāya. (\"Enjoyment body\" or \"reward body.\") The second of a buddha's three bodies, simultaneously a body of personal enjoyment of the dharma and a resplendent body of \"others' enjoyment,\" visible only to advanced bodhisattvas dwelling in buddha-fields — ordinary humans can perceive only the lesser emanation body. Defined by five certainties: it always resides in an Akaniṣṭha heaven, always teaches Mahāyāna doctrine, lasts until saṃsāra ends, is surrounded exclusively by advanced bodhisattvas, and is adorned with the full complement of a great being's physical marks.",null,null],["n3122","Saṃdhinirmocanasūtra",783,5,43,23,3834,0,-205,75,["work"],"Saṃdhinirmocanasūtra. A foundational Yogācāra sūtra best known for its doctrine of the \"three turnings of the wheel of dharma\": a first turning at Sārnāth teaching the four noble truths to śrāvakas, a second teaching emptiness to bodhisattvas (understood as the perfection of wisdom sūtras), and a third and definitive turning — which the sūtra places itself within — clearly differentiating how things actually exist. By ranking its own teaching above even the perfection of wisdom literature as the Buddha's truest, most refined intention, the sūtra stakes an unusually bold claim to doctrinal supremacy, one hugely influential in shaping how later exegetes classified the entire corpus of Buddhist teaching.",null,null],["n3123","saṃgha",783,2,250,228,4837,0,131,115,["concept"],"Saṃgha. (\"Community.\") The order of Buddhist monks and nuns, one of the Three Jewels of refuge — founded at Sarnath with the ordination of the first five monks after the Buddha's first sermon. Formal ordination and the twice-monthly recitation of monastic rules developed as the order grew; a saṃgha proper requires at least ten monks in settled regions, five in remote ones. Narrower senses restrict the term to those who have reached one of eight or twenty levels of spiritual attainment, setting an \"ultimate\" saṃgha of the awakened apart from the ordinary ordained.",{"start":-525,"end":-525,"basis":"founding coincides with the first sermon, via chronology convention"},{"lat":25.3805,"lng":83.0221,"label":"Sarnath, India (named directly in the entry)"}],["n3131","saṃgīti",786,2,37,33,1430,0,183,262,["concept"],"Saṃgīti. (\"Recitation\" or \"council.\") Both the communal recitation of scripture and the assembly convened to perform it — the basis for calling the great post-Buddha gatherings \"councils,\" convened to resolve disputes over orthodoxy and to collectively rehearse, agree upon, and codify the canon. In Pāli tradition, a saṃgīti follows the successful purification of the dispensation, expelling false monks and healing schism, so that the newly unified saṃgha can publicly affirm a single, agreed canon; the term is also used more narrowly for the recitation of one specific text, as in the Mañjuśrīnāmasaṃgīti.",null,null],["n3137","saṃjñā",787,1,33,27,2245,0,-244,268,["concept"],"Saṃjñā. (\"Perception\" or \"conceptual identification.\") The mental function that differentiates and labels objects so they can be recognized again later, present in six varieties tied to each sense faculty and counted as the third of the five aggregates — the step where a mere sensation of pleasant or unpleasant becomes conceptually grasped, generating the attraction or aversion that drives further action. In the \"equipoise of nonperception,\" this faculty is deliberately suppressed, a state some traditions read as restful cessation and others warn is a false, nihilistic imitation of real liberation.",null,null],["n3154","saṃsāra",790,1,163,163,170,0,-58,175,["concept"],"Saṃsāra. (\"Wandering.\") The beginningless cycle of birth, death, and rebirth across all realms of existence, propelled by karman and craving — the condition nirvāṇa brings to an end. One of Buddhism's most foundational terms, so ubiquitous elsewhere in the tradition that the dictionary's own entry for it is a single line.",null,null],["n3155","saṃskāra",791,1,44,31,2086,0,-212,277,["concept"],"Saṃskāra. (\"Formation\" or \"conditioning factor.\") In its passive sense, anything brought into being by causes and conditions — the basis of the Buddha's famous seal that \"all conditioned things are impermanent.\" In its active sense, the latent mental imprint left by past action, equivalent to volition and functioning as the second link in dependent origination, perpetuating rebirth. As the fourth of the five aggregates, it also becomes a catch-all category for every mental and non-mental conditioning factor that doesn't fit neatly under materiality, sensation, perception, or consciousness.",null,null],["n3157","saṃskṛta",791,1,30,24,939,0,-163,233,["concept"],"Saṃskṛta. (\"Conditioned.\") The term for all impermanent phenomena produced through the coming-together of causes and conditions, subject to the four-stage cycle of origination, continuance, decay, and cessation. Its status as inherently unreliable and unstable is precisely the standard argument for why conditioned experience should be renounced in favor of seeking the unconditioned — namely nirvāṇa.",null,null],["n3159","saṃtāna",792,1,26,15,1725,0,-191,302,["concept"],"Saṃtāna. (\"Continuum.\") An uninterrupted sequence of cause and effect — especially mental moments — used to describe how mind and body persist across time despite containing nothing permanent, extending both within a single lifetime and across many. The concept does real philosophical work: it explains how karmic continuity and rebirth remain coherent even without a permanent self, breaking down only at an arhat's final thought-moment, when the continuum's next step shifts to the unconditioned realm and no further conditioned thought can ever arise again.",null,null],["n3170","saṃvṛtisatya",795,5,27,25,1867,0,-329,69,["concept"],"Saṃvṛtisatya. (\"Conventional truth.\") The half of the two truths carrying built-in connotations of deception and concealment — objects of ordinary experience, misperceived through ignorance, yet still possessing genuine conventional utility, unlike a purely nonexistent object like a permanent self. Some schools split it further into \"correct\" conventional truth (an actual face) versus \"incorrect\" conventional truth (its mirror reflection), based on whether the object can actually perform the function its appearance suggests.",null,null],["n3183","saṃyojana",797,1,51,32,2555,0,-93,307,["concept"],"Saṃyojana. (\"Fetter.\") Ten defilements binding beings to rebirth, eliminated in stages as one advances through the noble path: the first three (self-view, doubt, attachment to rites) vanish at stream-entry; craving for sensuality and malice weaken at once-returning; craving for existence in the realms of form and formlessness, pride, restlessness, and ignorance persist until arhatship finally dissolves them all. A precise checklist, in other words, of exactly what separates each stage of awakening from the next.",null,null],["n3187","Saṃyuttanikāya",799,2,32,24,1630,0,54,267,["work"],"Saṃyuttanikāya. (\"Collection of Related Discourses.\") The third of the Pāli sutta collection's five divisions, organized by subject matter into five major sections and fifty-six sub-collections covering everything from causation and the aggregates to the noble eightfold path and meditative absorption. Corresponds roughly to the Sarvāstivāda and Kāśyapīya Saṃyuktāgama, now known only through Chinese translation, though exact sutta counts vary wildly across recensions depending on how a single \"discourse\" is even defined.",null,null],["n3214","San lun zong",805,5,32,26,2256,0,-292,-31,["school"],"San lun zong. (\"Three Treatises school.\") The Chinese analogue of Indian Madhyamaka, built entirely around three texts translated by Kumārajīva — Nāgārjuna's Middle Treatise with Piṅgala's commentary, Āryadeva's Hundred [Verse] Treatise, and a further Nāgārjuna-attributed introductory manual — none of which survive in Sanskrit or Tibetan. Systematized above all by Jizang, who retrospectively traced the school's lineage to the early exegete Sengzhao and to the Korean-transmitted teacher Sŭngnang, whose \"three truths\" schema of emptiness, provisional reality, and their synthesis went on to shape both San lun and Tiantai philosophy.",{"start":404,"end":409,"basis":"Kumārajīva's translations of the school's core texts, dated 404 and 409"},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (Kumārajīva's translation base)"}],["n3218","Śāntarakṣita",806,5,41,34,3236,0,-316,-45,["person"],"Śāntarakṣita. (725–788.) Bengali-born scholar of Nālandā whose Yogācāra-Madhyamaka synthesis — asserting, with Yogācāra, that external objects are mind-only, but, with Madhyamaka, that consciousness itself lacks ultimate existence — became the most important philosophical development of late Indian Buddhism. Invited to Tibet by King Khri srong lde btsan, he retreated to Nepal after local deities seemed to resist Buddhism's arrival, advised summoning Padmasambhava to subdue them, then returned to found Bsam yas, Tibet's first monastery, and ordain its first monks. He died there in a riding accident around 788, having already predicted the doctrinal dispute that would summon his disciple Kamalaśīla to the famous Bsam yas debate.",{"start":725,"end":788,"basis":"\"(725–788)\", given directly"},{"lat":23.8103,"lng":90.4125,"label":"Zahor, Bengal (birthplace, named directly; modern Bangladesh placeholder)"}],["n3220","Śāntideva",807,5,24,15,1542,0,-308,-15,["person"],"Śāntideva. (Eighth century.) Author of the enormously influential Bodhicaryāvatāra and its companion Śikṣāsamuccaya, known at Nālandā monastery only as an apparently indolent monk until fellow monks, hoping to humiliate him, dared him to recite scripture before the assembly — whereupon he delivered the entire Bodhicaryāvatāra from memory and, on reaching its ninth chapter on wisdom, is said to have risen into the air and vanished, leaving real textual disputes over how that chapter actually ends. Tibetan doxographers classify him as Prāsaṅgika-Madhyamaka, and the Bka' gdams tradition counted his masterwork among its six foundational treatises.",{"start":700,"end":800,"basis":"\"Eighth-century Indian monk of Nālandā monastery\""},{"lat":25.136,"lng":85.4434,"label":"Nālandā, India (named directly as his monastic home)"}],["n3240","Śāriputra",810,2,74,55,5597,0,55,141,["person"],"Śāriputra. (\"Son of Śārī.\") The Buddha's first chief disciple, renowned above all for wisdom, paired with Mahāmaudgalyāyana (chief in supernormal powers) — the two became stream-enterers together on hearing a single four-line verse from the monk Aśvajit before either had even met the Buddha. Recognized as second only to the Buddha in his grasp of the dharma, and said to be the one who received and transmitted the abhidharma after the Buddha first taught it to his mother in heaven. In Mahāyāna sūtras he's repeatedly outmaneuvered — turned into a woman by a goddess, humbled by questions he can't answer — dramatizing that even the mainstream tradition's wisest arhat falls short of Mahāyāna insight. Died months before the Buddha, at Nālaka near Rājagṛha.",{"start":-560,"end":-480,"basis":"contemporary of the Buddha (died \"several months before the Buddha\"); no specific dates given in this entry, so chronology convention used"},{"lat":25.0268,"lng":85.4212,"label":"Rājagṛha (Nālaka nearby) — named directly in the entry as his birthplace"}],["n3241","śarīra",811,2,59,55,2525,0,158,50,["concept"],"Śarīra. (\"Body,\" and by extension, \"relic.\") A term for a corpse — especially the Buddha's or a monk's — before and after cremation, whose remains were divided by the brāhmaṇa Droṇa among north Indian kingdoms and later said to have been redistributed by Aśoka into eighty-four thousand stūpas. Relics are classed as whole-body (mummified remains of eminent masters) or partial-body (a finger bone, a tooth, crystalline residue from cremation believed to condense a sage's sanctity), and were venerated as an ongoing presence and power from the time of the Buddha's own parinirvāṇa onward. By extension, Buddhist scriptures themselves came to be enshrined and worshipped as \"relics of the dharma-body.\"",null,null],["n3242","Sārnāth",812,2,32,23,1560,0,132,156,["place"],"Sārnāth. The modern name for the Deer Park at Ṛṣipatana where the Buddha delivered his first sermon to his five former ascetic companions, converting Ājñātakauṇḍinya first and the rest shortly after — one of Buddhism's four great pilgrimage sites ever since. Aśoka later raised a stūpa and pillar here, including an edict against causing schism in the saṃgha; the site remained an active monastic center visited by both Faxian in the fifth century and Xuanzang in the seventh, and its Dhamek stūpa still stands today as the major surviving structure.",{"start":-525,"end":-525,"basis":"site of the Buddha's first sermon, delivered \"seven weeks after\" his enlightenment; chronology convention"},{"lat":25.381,"lng":83.0219,"label":"Sārnāth, near Vārāṇasī, India (named directly as the entry's subject)"}],["n3249","Sarvāstivāda",813,2,212,188,5871,0,-26,183,["school"],"Sarvāstivāda. (\"Teaching that all exists.\") One of the most influential mainstream (non-Mahāyāna) schools of Indian Buddhism, distinguished by the doctrine that all conditioned factors exist across past, present, and future alike. Built an elaborate seventy-five-category abhidharma that shaped both Nāgārjuna's critique of it and Yogācāra's own scholastic system. Split from the Sthaviranikāya by around the first century BCE–CE; became dominant in Kashmir, Gandhāra, and along the Silk Road, making it the mainstream school best known to East Asian Buddhism.",{"start":-200,"end":100,"basis":"split from Sthaviranikāya \"as early as a century or two following the first schism, but certainly no later than the first century CE\""},{"lat":34.0837,"lng":74.7973,"label":"Kashmir (Srinagar) — named directly in the entry as where the school became dominant"}],["n3250","Sarvatathāgatatattvasaṃgraha",814,0,29,19,3314,0,45,-112,["work"],"Sarvatathāgatatattvasaṃgraha. (\"Compendium of Principles of All the Tathāgatas.\") A hugely influential tantra recasting Śākyamuni's enlightenment as achieved not through meditation under the Bodhi tree but through ritual consecration in the Akaniṣṭha heaven — his physical body left behind while a mind-made body traveled to receive empowerment before returning to stage the familiar defeat of Māra as mere theater for the world. Featuring the violent subjugation of Śiva by Vajrapāṇi and formalizing the five buddha families, it became foundational to East Asian esoteric Buddhism via the Vajraśekhara tradition and remained influential in Tibet across both the earlier and later disseminations.",{"start":670,"end":700,"basis":"\"likely dating from the late seventh century\""},null],["n3258","Sa skya",815,3,66,56,2806,0,-304,-117,["school"],"Sa skya. (\"Gray earth.\") One of Tibet's four major Buddhist sects, founded with its namesake monastery in 1073 by Dkon mchog rgyal po, and built around tantric teachings — the Hevajratantra and \"path and result\" system — brought from India via the adept Virūpa. Politically dominant in the thirteenth and fourteenth centuries after Sa skya Paṇḍita struck a political alliance with the Mongol ruler Godan Khan, later extended by his nephew 'Phags pa with Qubilai Khan. Uniquely among the major sects, Sa skya's leadership passes hereditarily within the 'Khon family rather than through incarnation.",{"start":1073,"end":1073,"basis":"\"Dkon mchog rgyal po founded Sa skya monastery in 1073\""},{"lat":28.9,"lng":88.05,"label":"Sakya, Tsang, Tibet (named directly in the entry)"}],["n3264","sāsrava",817,1,25,3,2555,0,-179,229,["concept"],"Sāsrava. (\"With outflows\" — contaminated.) A term for anything, animate or not, that can serve as an occasion for the afflictions to increase — broader than mere \"defilement\" since even objects and wholesome states leading to future happiness still count as contaminated if that future state itself has further outflows. The Abhidharmakośabhāṣya names only four truly uncontaminated dharmas, three of them permanent (space and the two forms of cessation) and only the truth of the path itself impermanent yet uncontaminated — everything else that composes a person falls under the single sweeping category of the \"contaminated aggregates.\"",null,null],["n3267","śāstra",817,5,38,35,1119,0,-212,-12,["concept","work"],"Śāstra. (\"Treatise.\") Buddhist commentarial and exegetical literature attributed to named Indian masters, as distinguished from sūtra, the word of the Buddha himself — the basic split underlying the Tibetan canon's two great divisions. Encompassing everything from verse to prose, of any length, and spanning genres Sanskrit differentiates far more finely than English's single catch-all word \"commentary,\" śāstra typically functions to explain the Buddha's words or intent rather than to speak with independent authority in his voice.",null,null],["n3277","satkāyadṛṣṭi",820,1,37,27,1431,0,-167,364,["concept"],"Satkāyadṛṣṭi. (\"View of a real/existent body.\") The mistaken belief that the impermanent aggregates making up a person constitute a real, perduring self — the first of the ten fetters and sixth of the ten root afflictions. Pāli sources multiply this single wrong view into twenty variants, four for each of the five aggregates: believing the self is identical to an aggregate, contained within it, distinct from it, or its owner. Permanently eliminated the moment one becomes a stream-enterer, it is the very first delusion Buddhist practice is designed to dismantle.",null,null],["n3286","satyadvaya",821,5,29,19,1953,0,-308,102,["concept"],"Satyadvaya. (\"Two truths.\") The exhaustive
