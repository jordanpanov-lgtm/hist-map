the Sa skya, Bka' brgyud, and Dge lugs sects.",{"start":770,"end":800,"basis":"the tantra \"probably appeared toward the end of the eighth century\""},null],["n687","cakravartin",196,2,33,23,2899,0,132,88,["concept"],"Cakravartin. (\"Wheel-turning emperor.\") An ideal universal monarch who rules in accordance with the dharma, sharing with a buddha the thirty-two marks of a great man and the rule that only one can appear in a world system at a time — indeed, seers reportedly predicted the infant Buddha would become either a cakravartin or a buddha, depending on whether he stayed in the world or renounced it. Four grades exist depending on the metal of the ruler's conquering wheel, from a gold-wheeled ruler who commands the spontaneous surrender of rivals to an iron-wheeled ruler who must fight for every inch — with Aśoka standing as history's most celebrated approximation of the ideal.",null,null],["n696","Candrakīrti",198,5,53,37,3405,0,-312,16,["person"],"Candrakīrti. (c. 600–650.) A Madhyamaka master, probably a monk of Nālandā, whose commentaries on Nāgārjuna and Āryadeva later defined what Tibetan scholars would retrospectively call the Prāsaṅgika branch of Madhyamaka. In his Prasannapadā he argues that Madhyamaka should refute rivals only through drawing out absurd consequences, never through autonomous syllogisms — the very distinction Tibetans used to split Madhyamaka into Svātantrika and Prāsaṅgika camps. Barely read in the centuries after his death and untranslated into Chinese until the 1940s, his Madhyamakāvatāra was revived in eleventh-century Kashmir and went on to become the single most important Madhyamaka text studied in Tibet, a core text of the Dge lugs curriculum.",{"start":600,"end":650,"basis":"\"(c. 600–650)\", given directly"},{"lat":13.0827,"lng":80.2707,"label":"South India (general placeholder — entry states only \"he was from south India\", no city named)"}],["n700","Caodong zong",199,7,41,26,2737,0,6,-342,["school"],"Caodong zong. One of the \"five houses and seven schools\" of mature Chinese Chan, named by combining syllables from its two founding Tang-dynasty masters, Caoshan Benji and Dongshan Liangjie (the disciple's name placed first purely for euphony). Distinctive for Dongshan's \"five ranks,\" a compressed dialectical framework for the whole of Mahāyāna insight, and later for the \"silent illumination\" meditation revived by Hongzhi Zhengjue — a technique built on the premise that since enlightenment is already the mind's natural state, sitting quietly without striving is itself sufficient practice, a claim its Linji-school rival Dahui Zonggao attacked sharply. Transmitted to Japan by Dōgen as Sōtōshū, it barely registered in Korea, where Imje (Linji) lineages dominated instead.",null,null],["n706","Cariyāpiṭaka",201,2,25,4,1784,0,83,204,["work"],"Cariyāpiṭaka. (\"Basket of Conduct.\") The fifteenth and final book of the Khuddakanikāya, thirty-five verse stories of the Buddha's past lives illustrating seven of the ten Pāli perfections — generosity, morality, renunciation, truthfulness, resolution, loving-kindness, and equanimity — that parallel corresponding prose accounts found in the Jātaka. Tradition holds it was preached by the Buddha at Śāriputra's request and later used by the missionary Mahinda to convert thousands of Sri Lankans when he recited it at Anurādhapura.",null,null],["n710","Catuḥśataka",202,5,26,8,3072,0,-232,66,["work"],"Catuḥśataka. (\"Four Hundred [Stanzas].\") Āryadeva's sixteen-chapter Madhyamaka masterwork, opening with refutations of permanence, satisfaction, purity, and a substantial self before turning to the bodhisattva path, the three poisons, and a sustained series of arguments against rival Buddhist and non-Buddhist schools, all converging on emptiness as reality's fundamental nature. Its relationship to the shorter, similarly themed Śataśāstra remains debated — rather than one simply summarizing or expanding the other, the two are more likely independent works addressing overlapping ground, possibly reflecting different stages or interpretations of Āryadeva's own thought.",{"start":200,"end":300,"basis":"the magnum opus of \"Āryadeva, a third century CE Indian monk\""},null],["n738","Chan",207,7,391,381,4644,0,14,-296,["school"],"Chan. (J. Zen; K. Sŏn; V. Thiền.) Meditation lineage that crystallizes as a distinct Chinese school by the sixth or seventh century under six patriarchs starting with the legendary Indian monk Bodhidharma — ending in a bitter contest over the sixth patriarchy between Shenxiu's gradualist Northern school and Huineng's subitist Southern school. Splits into five houses, seven schools; spreads to Korea as Sŏn, Japan as Zen, Vietnam as Thiền, and briefly to the Tibetan court, where the monk Moheyan loses the Bsam yas debate.",{"start":550,"end":650,"basis":"\"perhaps sometime during the sixth or seventh centuries\" (formal community naming)"},{"lat":34.34,"lng":108.95,"label":"China (general placeholder — Xi'an/Chang'an; no specific city named for the community's origin)"}],["n757","Chengguan",212,5,37,16,2418,0,-114,-106,["person"],"Chengguan. (738–839.) Putative fourth patriarch of the Huayan tradition, whose massive commentary on Śikṣānanda's translation of the Avataṃsakasūtra came to rival, and perhaps surpass, Fazang's own earlier commentary in influence. Trained broadly across Prajñāpāramitā, Chan, and Vinaya before settling at Wutaishan, Mañjuśrī's earthly abode, he elaborated Dushun's concept of the \"realm of reality\" into four interlocking perspectives — phenomena, principle, and their mutual, and then their fully reciprocal, nonobstruction — and later collaborated on a new translation of the Gaṇḍavyūha at the Tang capital. His most famous disciple, Guifeng Zongmi, carried his synthesis of doctrine and practice into the next generation.",{"start":738,"end":839,"basis":"\"(738–839)\", given directly"},{"lat":39.0175,"lng":113.5978,"label":"Wutaishan, China (where he settled from 776 and composed his major works)"}],["n759","Cheng weishi lun",213,5,41,19,4058,0,-238,95,["work"],"Cheng weishi lun. (\"Demonstration of Consciousness-Only.\") The foundational text of Chinese Yogācāra, compiled by Xuanzang from ten Indian commentaries on Vasubandhu's Thirty Verses but built almost entirely around Dharmapāla's interpretation, which Xuanzang considered orthodox — a choice likely inherited from his own teacher Śīlabhadra, himself Dharmapāla's student. Its central claim is that consciousness always splits into a \"seeing part\" and \"seen part,\" both ultimately mere projections of mind, whose recognition triggers a fundamental \"transmutation of the basis\" ending the illusion of subject and object entirely — a text detailed enough that it doubles as the school's primer on Yogācāra's hundred-dharma taxonomy.",{"start":645,"end":645,"basis":"composed \"after his return to China in 645,\" when Xuanzang \"set to work translating\""},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (Xuanzang's translation base)"}],["n778","Chogye chong",218,7,44,36,2280,0,76,-336,["school"],"Chogye chong. Korea's largest Buddhist order, its name evoking Caoxishan, the mountain where Chan's sixth patriarch Huineng resided, to claim pedigree as a Sŏn-descended tradition while absorbing other strands of Korean Buddhism. Though its constitution traces roots to the ninth-century monk Toŭi and later Pojo Chinul, the order in its present form was founded in 1938 under Japanese colonial rule, and split decisively in the 1950s and 60s \"purification movement,\" when celibate monks broke from the married-clergy tradition imposed under Japanese influence to form the reconstituted, celibate Chogye chong of today.",{"start":1938,"end":1938,"basis":"\"formed in 1938 during the Japanese colonial administration of Korea\""},{"lat":37.5759,"lng":126.9832,"label":"Chogyesa, Seoul, Korea (the order's headquarters, named directly)"}],["n800","chuandeng lu",223,7,32,26,1639,0,-3,-358,["concept","work"],"Chuandeng lu. (\"Transmission of the lamplight record.\") A genre of Chan historical writing constructing genealogical maps of orthodox lineage back to Bodhidharma, using the metaphor of a flame passed lamp to lamp to represent wordless, mind-to-mind transmission of insight from master to disciple. Beyond establishing legitimacy for competing Chan lines, these texts doubled as the primary source for the master-student anecdotes later collected and contemplated as gong'an, making them foundational to both Chan's institutional self-image and its meditative literature alike.",null,null],["n819","citta",227,1,90,54,5051,0,-198,166,["concept"],"Citta. (\"Mind,\" \"mentality,\" or \"thought.\") General consciousness itself — synonymous with \"name\" as opposed to form, and present during any conscious activity at all. Sarvāstivāda abhidharma counts ten mental factors that accompany every single moment of citta; Yogācāra expands the concept to encompass all dharmas, not just mentality, giving that school its alternate name \"mind-only.\" At enlightenment, citta is said to be freed from its habitual identification with a self, becoming — per the Buddha's own words — inherently \"luminous.\"",null,null],["n820","Citta",227,1,59,52,2010,0,-121,221,["person"],"Citta. A lay treasurer of Macchikāsaṇḍa in the kingdom of Kāsī, named for the shower of colored flowers that reportedly fell at his birth, and celebrated in Pāli sources as foremost among laymen who preached the dharma. Converted on encountering the elder Mahānāma, he built him a monastery and attained nonreturner status while listening to a sermon on the six senses; his own recorded exchanges with monks and rival teachers, including Mahāvīra, fill an entire chapter of the Saṃyuttanikāya. On his deathbed he declined the gods' offer of heavenly rebirth as an unworthy, impermanent reward — preaching one last time to the assembled divinities and kin before he died.",{"start":-560,"end":-480,"basis":"contemporary of the Buddha (converted by the elder Mahānāma, later visited the Buddha in person); no specific dates given, chronology convention used"},{"lat":25.3176,"lng":82.9739,"label":"Kāsī (Varanasi region placeholder) — Citta was treasurer of Macchikāsaṇḍa in the kingdom of Kāsī, named directly"}],["n823","cittamātra",228,5,27,13,2574,0,-278,39,["concept"],"Cittamātra. (\"Mind-only.\") The Laṅkāvatārasūtra's doctrine that the external sensory world has no existence independent of mind, giving Yogācāra its alternate name. Built on an eight-consciousness model — the familiar six plus an afflicted mentality and a storehouse consciousness — the theory holds that mental states \"perfume\" the storehouse consciousness with residual impressions that later ripen into new experience; Vasubandhu, converted to the view by his brother Asaṅga, argued in his Thirty Verses that no atomic basis for external objects could exist, leaving mind-only as the only coherent explanation for both ordinary experience and its eventual purification.",null,null],["n826","cittaviprayuktasaṃskāra",229,1,32,24,3009,0,-206,308,["concept"],"Cittaviprayuktasaṃskāra. (\"Conditioned forces dissociated from thought.\") A catch-all abhidharma category for factors belonging to neither matter nor mind, invented to explain otherwise awkward phenomena — how a trance state can temporarily suspend both physicality and mentality, or how mere speech sounds manage to convey meaning. Sarvāstivāda's standard list runs to sixteen items, later abhidharma texts trim or expand it, and Yogācāra's hundred-dharma system stretches the category to twenty-four — evidence that this was always a deliberately open, flexible bucket for solving whatever doctrinal puzzle arose next, not a fixed and settled inventory.",null,null],["n870","Dahui Zonggao",239,7,41,33,2592,0,15,-360,["person"],"Dahui Zonggao. (1089–1163.) The most influential Song-dynasty Linji Chan master, who inherited Yuanwu Keqin's lineage, revived Linji Yixuan's teachings, and championed \"investigating the topic\" (kanhua Chan) meditation in sharp public opposition to Hongzhi Zhengjue's rival \"silent illumination\" method — even while the two remained personally cordial. Exiled for years on a false charge of collaborating with the invading Jin dynasty, he used the time to compose his magnum opus, the Zhengfayanzang, before returning to favor as teacher to Emperor Xiaozong and receiving the posthumous title \"Chan Master Pujue.\"",{"start":1089,"end":1163,"basis":"\"(1089–1163)\", given directly"},{"lat":30.63,"lng":118.75,"label":"Ningguo, Xuanzhou (Anhui), China (native place, named directly)"}],["n882","ḍākinī",242,3,41,23,2549,0,-194,-189,["concept"],"Ḍākinī. A class of female tantric beings evolving from cannibalistic demons and local shamanic figures into guardians of secret tantric doctrine, and eventually into fully enlightened goddesses embodying both fearsome power and the highest beauty. Classed as outer (ordinary yoginīs), inner (visualized meditation deities), and secret (nondual wisdom itself), and mapped onto the three buddha-bodies, they form the third of Vajrayāna's \"inner\" three jewels alongside the guru and one's chosen tantric deity — with the consort of Padmasambhava, Ye shes mtsho rgyal, standing as the archetypal Tibetan wisdom ḍākinī.",{"start":300,"end":400,"basis":"the ḍākinī \"first appears in Indian sources during the fourth century CE\""},null],["n883","Dalai Lama",242,3,67,65,2354,0,-269,-224,["person","concept"],"Dalai Lama. (\"Ocean teacher\" — a Mongolian-Tibetan hybrid title.) An incarnation lineage within the Dge lugs sect, its holders traditionally revered as manifestations of the bodhisattva Avalokiteśvara. The name itself dates only to the sixteenth century, when the Mongol ruler Altan Khan translated the name of the Dge lugs teacher Bsod nams rgya mtsho — literally \"ocean\" — into Mongolian; he became the third Dalai Lama, with his two predecessors recognized only posthumously. Despite the common assumption abroad, the Dalai Lama has never held the formal headship of the Dge lugs sect — that position belongs to a separate office, the \"Throneholder of Ganden Monastery.\"",{"start":1500,"end":1600,"basis":"the title \"originated during the sixteenth century when Altan Khan... bestowed the title\""},{"lat":29.6467,"lng":91.117,"label":"Tibet (general placeholder — Lhasa; no single site names the institution)"}],["n889","dāna",244,2,52,40,2781,0,64,94,["concept"],"Dāna. (\"Giving\" or \"generosity.\") The foundational lay virtue, prized for weaning practitioners from attachment to possessions while materially sustaining the saṃgha — exemplified in legend by Prince Viśvantara, who gave away his kingdom, his wife, and his children. Generates merit accruing to both this life and future ones, and is ranked among three types by object (material goods, freedom from fear, or the dharma itself, held to be the greatest gift of all) and heads both the Mahāyāna's six perfections and the Pāli tradition's ten. Someone incapable of even minimal generosity is, in some schools, considered to have severed their wholesome roots entirely.",null,null],["n912","darśana",249,1,28,5,2491,0,-75,222,["concept"],"Darśana. (\"Seeing\" — vision, insight, understanding.) A term spanning ordinary visual perception through to the five graduated \"eyes\" of Buddhist literature — physical, divine, wisdom, dharma, and buddha — with the highest subsuming all the others. In its more technical sense as direct insight into the three marks of existence, darśana names the third of the five paths, the pivotal darśanamārga, and is closely related to (though more neutral than) dṛṣṭi, \"view,\" which more often carries pejorative connotations of dogma or wrong belief.",null,null],["n913","darśanamārga",250,1,96,78,4308,0,-170,213,["concept"],"Darśanamārga. (\"Path of vision.\") The third of the five paths to liberation, following the paths of accumulation and preparation — the adept's first direct, unmediated perception of reality, severing the first three of the ten fetters binding one to rebirth. In the Sarvāstivāda system, it unfolds across sixteen precisely sequenced moments of realizing the four noble truths; Yogācāra reframes it as dissolving the false subject-object split, while Madhyamaka treats it as the first direct realization of emptiness. Marks the technical threshold at which a practitioner becomes a \"noble person.\"",null,null],["n915","daśabhūmi",251,1,98,23,15743,0,-126,109,["concept"],"Daśabhūmi. (\"Ten grounds\" or \"ten stages.\") The ten highest stages of the bodhisattva path to buddhahood, most systematically laid out in the Daśabhūmikasūtra — each stage paired with mastery of one of ten perfections, from giving on the first ground through knowledge on the tenth. As the bodhisattva ascends, his powers multiply by orders of magnitude: on the first ground he can see a hundred buddhas at once, by the tenth a number equal to the specks of dust in countless universes. Competing traditions (Yogācāra's five-path system, Tiantai's vehicle correlations) map their own schemas onto the same ten stages, producing genuinely different accounts of what happens at each one.",null,null],["n916","Daśabhūmikasūtra",253,1,29,27,677,0,-186,97,["work"],"Daśabhūmikasūtra. (\"Scripture of the Ten Stages.\") The definitive scriptural source for the ten bodhisattva grounds at the path's upper reaches, correlating each stage with both a core mainstream Buddhist doctrine and mastery of one of the ten perfections. Circulated independently before being absorbed as a chapter of the Avataṃsakasūtra, it became the standard reference point against which rival stage-schemes, such as Asaṅga's seven-stage Bodhisattvabhūmi system, were later measured and reconciled.",null,null],["n923","Dasheng qixin lun",254,5,52,32,4680,0,-199,-48,["work"],"Dasheng qixin lun. (\"Awakening of Faith According to the Mahāyāna.\") A Chinese treatise nominally attributed to the Indian Aśvaghoṣa but now generally regarded as an indigenous Chinese apocryphon, seeking to reconcile two seemingly incompatible Mahāyāna doctrines: tathāgatagarbha (innate enlightenment) and ālayavijñāna (a storehouse consciousness that explains why enlightened minds still become deluded). Its solution splits the mind into \"true thusness\" and \"production-and-cessation\" aspects, permanently grounded in each other, so the mind is simultaneously always enlightened and always in need of actualizing that enlightenment through practice. One of the most influential texts in all of East Asian Buddhism, it later drew major commentaries from Wŏnhyo, Fazang, and Jingying Huiyuan.",{"start":500,"end":600,"basis":"\"widely assumed to be an indigenous Chinese text... composed in the sixth century\""},null],["n939","dazangjing",258,5,44,25,3701,0,-65,-3,["concept","work"],"Dazangjing. (\"Scriptures of the great repository.\") The Chinese term that replaced the Indian \"tripiṭaka\" once the Chinese canon grew to include not just translated Indian texts but indigenous commentaries, treatises, biographies, and dictionaries composed directly in literary Chinese. Organized by court-library-style shelf categories rather than the Indian threefold division, the earliest complete canons date to the fifth century; by the tenth, woodblock printing enabled full printed editions, of which Korea's meticulously accurate Koryŏ canon — 1,514 texts on over 81,000 woodblocks, still housed at Haeinsa — is especially renowned.",{"start":400,"end":500,"basis":"\"the earliest complete Buddhist canons in China date from the fifth century\""},null],["n940","Dazhidu lun",260,5,43,15,3108,0,-142,12,["work"],"Dazhidu lun. (\"Treatise on the Great Perfection of Wisdom.\") A massive commentary on the Pañcaviṃśatisāhasrikāprajñāpāramitāsūtra, attributed to Nāgārjuna but surviving only in Kumārajīva's Chinese translation — no Sanskrit or Tibetan version, nor any reference to it in Indian sources, has ever surfaced, fueling speculation it may actually be the work of a Central Asian Sarvāstivāda convert to Madhyamaka, possibly Kumārajīva himself. An encyclopedic compendium of Buddhist doctrine, legend, history, and geography padded with Kumārajīva's own interlinear glosses for Chinese readers, it became so authoritative that Chinese canon compilers placed it first among all treatise literature.",{"start":402,"end":406,"basis":"translated by Kumārajīva \"between 402 and 406\""},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (site of Kumārajīva's translation activity)"}],["n944","dbu ma chen po",261,5,27,1,3633,0,-330,12,["concept"],"Dbu ma chen po. (\"Great Madhyamaka.\") A term central to Tibet's \"self-empty, other-empty\" debate over which Indian thinkers count as Madhyamaka's true representatives. Dge lugs orthodoxy holds Candrakīrti's reading of Nāgārjuna as the definitive account of a purely negative emptiness; the Jo nang pa and allied thinkers instead elevate a positive \"other-emptiness\" — an eternal, self-arisen wisdom consciousness empty only of extraneous defilement, not of its own true nature — relegating Candrakīrti's negative dialectic to a lesser, \"one-sided\" Madhyamaka in favor of Nāgārjuna's devotional hymns and thinkers the Dge lugs classify as Yogācāra.",null,null],["n955","deva",263,6,102,96,1688,0,77,75,["concept"],"Deva. (\"Radiant\" or \"shining one.\") A divinity or god — one of the rebirth destinies of saṃsāra, and the reason Buddhism is said to have gods but no God. Rebirth as a deva rewards past virtue but remains temporary, not eternal: even the highest heavens are way stations within saṃsāra, not final escape from it. Twenty-seven categories of devas populate three cosmological realms; the six heavens of the sensuous realm alone are stacked from the slopes of Mount Sumeru up into the sky above its summit.",null,null],["n956","Devadatta",266,2,37,15,4886,0,157,107,["person"],"Devadatta. The Buddha's cousin and Buddhism's archetypal villain, ordained alongside Ānanda but consumed by jealousy after attaining meditative powers without ever reaching enlightenment. Having failed to have the aging Buddha cede him leadership of the saṃgha, he orchestrated a series of assassination attempts — hired archers, a hurled boulder, a maddened elephant — all foiled by the Buddha's own powers, before splitting the saṃgha entirely by demanding stricter ascetic rules the Buddha refused to mandate. Tradition consigns him to the deepest hell for shedding a buddha's blood and causing schism, though even he is promised eventual buddhahood in the Lotus Sūtra — proof, to later exegetes, that no one is beyond redemption.",{"start":-560,"end":-480,"basis":"cousin and contemporary of the Buddha; chronology convention"},{"lat":24.7955,"lng":85.0002,"label":"Gayāśīrṣa, near Gaya, India (site of the monastery built for him, named directly)"}],["n973","dge bshes",270,3,33,12,2859,0,-324,-89,["concept"],"Dge bshes. (\"Geshe\" — spiritual friend.) Originally a general honorific for a saintly Bka' gdams teacher, the term evolved in the Dge lugs sect into a formal academic degree awarded after decades of study at one of Lhasa's three great monasteries, working through five core Indian śāstras via memorization, textbook study, and formal debate. Four grades exist in descending rank, with the top lha rams pa degree restricted to just sixteen candidates a year and serving as the gateway to the highest offices in the Dge lugs religious hierarchy.",null,null],["n976","Dge lugs",271,3,95,91,2997,0,-340,-150,["school"],"Dge lugs. (\"System of Virtue.\") Youngest and eventually most powerful of Tibet's four major Buddhist sects, founded by Tsong kha pa with his 1409 monastery at Ganden. Three more foundational monasteries followed within decades, and Tsong kha pa's disciple Dge 'dun grub was later recognized as the first Dalai Lama. After 1642, the fifth Dalai Lama's government made the Dge lugs Tibet's de facto ruling party, backed by a rigorous scholastic examination system that still produces its abbots and incarnate lamas today.",{"start":1409,"end":1409,"basis":"Tsong kha pa \"founded Ri bo Dga' ldan monastery in 1409\""},{"lat":29.7975,"lng":91.4756,"label":"Ganden Monastery, Tibet (named directly in the entry)"}],["n980","Dhammacakkappavattanasutta",272,2,45,28,2623,0,35,221,["work"],"Dhammacakkappavattanasutta. (\"Discourse on Turning the Wheel of the Dharma.\") The Buddha's first sermon, delivered at the Deer Park near Sārnāth to the five ascetics who had abandoned him for giving up self-mortification. Setting out a middle way between indulgence and asceticism — the noble eightfold path — followed by the four noble truths, the sermon converts its first listener, Ājñātakauṇḍinya, into a stream-enterer and the first ordained monk, admitted with the simple formula \"come, monk.\" The site of its delivery became one of Buddhism's four great pilgrimage destinations.",{"start":-525,"end":-525,"basis":"the Buddha's \"first sermon\" after his enlightenment; chronology convention"},{"lat":25.381,"lng":83.0219,"label":"Deer Park, Ṛṣipatana, Sārnāth (named directly as the site of delivery)"}],["n990","dhāraṇī",274,0,55,47,1404,0,48,-66,["concept"],"Dhāraṇī. (\"Mnemonic device,\" \"code\" — from √dhṛ, \"to hold.\") A verbal formula, meaningful or not, believed to encapsulate and let its user retain the fuller doctrine it condenses. The sixth-century Chinese exegete Jingying Huiyuan classified dhāraṇī into four types tied to teachings, meaning, spells, and acquiescence, the first two functioning essentially as memory codes for Buddhist doctrine. In Prajñāpāramitā literature a single letter of the alphabet could serve as a dhāraṇī, standing in for an entire technical term.",null,null],["n991","dharma",275,1,218,200,5397,0,-89,86,["concept"],"Dharma. A term with as many as ten meanings in Buddhist literature, from the Sanskrit root \"to hold.\" Most often it means the Buddha's teaching itself — the second of the Three Jewels, first \"turned\" at his inaugural sermon. Just as often it means the opposite: not a teaching about reality but reality's own constituent building blocks, the individual \"factors\" analyzed by abhidharma. A third sense denotes a quality or characteristic, as in dharmakāya, the Buddha's \"body\" of transcendent qualities.",null,null],["n995","dharmacakrapravartana",276,2,38,23,2305,0,-17,70,["concept"],"Dharmacakrapravartana. (\"Turning the wheel of the dharma.\") A general term for the Buddha's teaching activity, rooted in his first sermon at Sārnāth, but expanded by later exegetes into a framework for explaining why different sūtras present seemingly contradictory doctrines — as if the Buddha had \"turned the wheel\" multiple times for different audiences. The Saṃdhinirmocanasūtra's influential three-turnings scheme (four truths, then emptiness, then Yogācāra's three natures) became a major hermeneutical battleground, with Madhyamaka partisans insisting the second turning was the truly definitive one against the sūtra's own claim that the third was.",null,null],["n999","dharmadhātu",277,5,65,46,2535,0,-95,-25,["concept"],"Dharmadhātu. (\"Dharma realm.\") In Abhidharma, one of the eighteen elements — the category of whatever can be an object of cognition. In Mahāyāna, something far grander: the infinite domain in which all phenomena occur, a virtual synonym for ultimate reality itself. Huayan philosophy elaborates it into four ascending levels of realization, from the mundane realm of phenomena up to their unimpeded, mutual interpenetration with one another — the same vision, framed differently, that animates the entire Huayan system.",null,null],["n1004","Dharmaguptaka",278,2,77,56,3208,0,84,186,["school"],"Dharmaguptaka. One of the eighteen traditional mainstream schools of early Indian Buddhism, splitting off — by one account — from the Mahīśāsaka school around the late second or early first century BCE, and most active in Kashmir-Gandhāra and Sri Lanka. Distinctively held that the Buddha stands apart from the saṃgha altogether, so that gifts to him outrank gifts to the community — a view that fueled its emphasis on stūpa veneration. Its vinaya, the \"Four-Part Vinaya,\" translated into Chinese in 405, remains the monastic code still followed across East Asia today.",{"start":-200,"end":-100,"basis":"split from Mahīśāsaka \"probably sometime around the late second or early first centuries BCE\""},{"lat":34.0151,"lng":71.5249,"label":"Kashmir-Gandhāra (Peshawar placeholder) — named as where the school was \"most active\""}],["n1006","dharmakāya",279,13,69,63,1370,0,-20,-75,["concept"],"Dharmakāya. (\"Truth body.\") One of the two or three bodies of a buddha — originally referring simply to the collected auspicious qualities and teachings that make up the Buddha's legacy, later evolving in Mahāyāna into a cosmic principle: the true nature of the Buddha from which all his other forms derive. Perfection-of-wisdom commentators split over whether it names an ultimate \"own-nature body\" or divides further into a \"knowledge truth body\" distinct from that own-nature — a technical dispute with real consequences for how Tibetan and Indian exegetes understood what, exactly, becomes enlightened.",null,null],["n1007","Dharmakīrti",279,5,46,38,2122,0,-350,34,["person"],"Dharmakīrti. (c. 600–670 CE.) The most influential logician in Buddhist philosophical history, building on his predecessor Dignāga's epistemology through a series of seven treatises defending Buddhist theories of valid knowledge against Brahmanical critics. His key innovation grounds reliable perception in a causal link between sense object and sensory awareness, closing a gap in Dignāga's system, and his works provoked a long line of Indian commentary before becoming the focus of intense, competing interpretive traditions in Tibet — one line descending from Rngog Blo ldan shes rab, the other, more faithful to Dharmakīrti's own text, initiated by Sa skya Paṇḍita's critique of it.",{"start":600,"end":670,"basis":"\"(c. 600–670 CE)\", given directly"},null],["n1014","dharmānusārin",282,1,31,10,5182,0,-39,278,["concept"],"Dharmānusārin. (\"Follower of the dharma.\") One who reaches realization through personal analysis of the teachings rather than through trust in what others report — contrasted with the \"follower of faith,\" and ranked higher among the seven types of noble ones for exactly that reason. Vaibhāṣika abhidharma holds this distinction has real stakes: a faith-grounded arhat can backslide from that attainment, while a dharma-follower's realization, grounded in the irreversible \"knowledge of nonproduction,\" cannot.",null,null],["n1015","dharmapāla",282,6,49,40,1290,0,9,-90,["concept"],"Dharmapāla. (\"Protector of the dharma.\") Wrathful divinities, often originally local deities converted into Buddhist service, tasked with defending the teachings and guarding practitioners from harm. Tibetan tradition credits Padmasambhava with instituting their worship in the early eighth century by subduing hostile local spirits along his route into Tibet and sparing only those who agreed to become protectors. Classed as either \"mundane\" — worldly beings who protect the dharma — or \"supramundane\" — already-enlightened beings appearing in wrathful guise for the same purpose, with the eight classes of nonhuman beings (nāgas, yakṣas, and the like) sometimes listed among them.",null,null],["n1016","Dharmapāla",283,5,49,40,2050,0,-158,-67,["person"],"Dharmapāla. (530–561.) One of India's ten great Yogācāra philosophers, born to a South Indian government minister's family, who fled his own wedding to become a monk and rose, despite his youth, to chief instructor at Nālandā. His interpretation of consciousness as always split into a \"seeing part\" and a \"seen part\" — against rivals who saw that split as purely imaginary — became orthodox doctrine in China after Xuanzang studied it under Dharmapāla's disciple Śīlabhadra and carried the lineage home, where it shaped the entire Chinese Faxiang school. He died at twenty-nine, having retired to Asaṃbodhi monastery.",{"start":530,"end":561,"basis":"\"(530–561)\", given directly"},{"lat":25.136,"lng":85.4434,"label":"Nālandā, India (where he became chief instructor, the entry's central setting)"}],["n1034","dhātu",287,1,62,51,2432,0,-103,213,["concept"],"Dhātu. (\"Element.\") A polysemous term spanning several distinct Buddhist taxonomies. In epistemology, the eighteen elements of sensory experience — six sense organs, six objects, six resulting consciousnesses. In cosmology, the three realms of existence that comprise all of saṃsāra. Physically, the four (or six) constituent elements of matter — earth, water, fire, wind, sometimes space and consciousness. And, in mortuary contexts, a synonym for bodily relics, sometimes differentiated into corporeal relics, relics of use, and relics of commemoration — the same word doing duty across physics, cosmology, and the cult of the dead.",null,null],["n1039","dhutaṅga",288,2,40,24,3683,0,116,164,["concept"],"Dhutaṅga. (\"Ascetic practices.\") Thirteen voluntary austerities the Buddha sanctioned for monks seeking deeper contentment and detachment — wearing only discarded-cloth robes, eating a single sitting's worth of alms food, dwelling at the root of a tree or in a charnel ground, never lying down to sleep — offered explicitly as a middle way after the Buddha's own failed extreme asceticism as a bodhisattva. Notably, he authorized these as optional precisely while rejecting his rival cousin Devadatta's harsher proposal to make similar austerities mandatory for the entire saṃgha.",null,null],["n1040","dhyāna",289,1,180,172,3966,0,-21,151,["concept"],"Dhyāna. (\"Meditative absorption.\") Sanskrit source of the term Chan/Zen — the state in which the mind withdraws from sensory awareness into full concentration on its object. Divides into four stages of subtle-materiality absorption, each shedding a mental factor as concentration deepens, then four further immaterial absorptions named for ever-subtler objects: infinite space, infinite consciousness, nothingness, and neither-perception-nor-nonperception. Builds the concentration needed for insight but doesn't by itself grant it — sustained absorption alone only leads to rebirth as a long-lived divinity.",null,null],["n1051","Dīghanikāya",292,2,59,52,1668,0,120,297,["work"],"Dīghanikāya. (\"Collection of Long Discourses.\") The first division of the Pāli sutta collection, thirty-four lengthy discourses grouped loosely into three sections and including such influential texts as the Aggaññasutta and Mahāparinibbānasutta. Tradition holds it was first recited orally at the first council after the Buddha's death and officially committed to writing in Sri Lanka in the first century BCE. A closely related Sanskrit recension, the Dīrghāgama, survives only in a 413 CE Chinese translation attributed to the Dharmaguptaka school, plus fragments rediscovered in Afghanistan in the 1990s.",{"start":-100,"end":-100,"basis":"\"officially transcribed into written form in Sri Lanka during the reign of King Vaṭṭagāmaṇi Abhaya in the first century BCE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Anurādhapura placeholder — seat of King Vaṭṭagāmaṇi Abhaya, named in the entry)"}],["n1052","Dignāga",292,5,33,27,1781,0,-367,68,["person"],"Dignāga. (c. 480–c. 540.) The formalizer of Buddhist logic, who streamlined the Nyāya school's cumbersome five-step syllogism into a lean three-step form — proposition, reason, exemplification — and was the first Buddhist thinker to adopt the Vaiśeṣika position that only two means of valid knowledge exist: direct perception and inference. His Pramāṇasamuccaya became the foundational text for centuries of subsequent Buddhist epistemology, most notably taken up and extended by Dharmakīrti.",{"start":480,"end":540,"basis":"\"(c. 480–c. 540)\", given directly"},null],["n1057","Dīpavaṃsa",293,2,27,21,1441,0,294,273,["work"],"Dīpavaṃsa. (\"Island Chronicle.\") The earliest surviving Pāli chronicle of Sri Lanka, compiled from older Sinhalese Mahāvihāra commentaries and covering Theravāda history from the third-century-BCE conversion of King Devānaṃpiyatissa through the fourth-century-CE reign of Mahāsena. Preserves the earliest Pāli account of Aśoka's patronage of the third Buddhist council and its missionary dispatches abroad, and directly supplied the outline later expanded into the more famous Mahāvaṃsa.",{"start":300,"end":400,"basis":"\"in its present form, it probably dates from the fourth-century CE\""},{"lat":8.3114,"lng":80.4037,"label":"Sri Lanka (Mahāvihāra tradition, source of the chronicle)"}],["n1058","Dīrghāgama",294,2,35,32,2121,0,147,310,["work"],"Dīrghāgama. (\"Collection of Long Scriptures.\") The Sanskrit-tradition counterpart to the Pāli Dīghanikāya, long known only through a 413 CE Chinese translation attributed to the Dharmaguptaka school until extensive Sanskrit fragments turned up in Afghanistan in the 1990s — fragments that instead point to a Sarvāstivāda or Mūlasarvāstivāda origin. Despite sharing a broad tripartite structure with the Pāli and Chinese versions, two of its three sections diverge so sharply that scholars suspect it descends from a genuinely independent textual lineage rather than a shared original.",null,null],["n1060","divyacakṣus",294,1,25,17,1449,0,4,335,["concept"],"Divyacakṣus. (\"Divine eye\" — clairvoyance.) One of the six superknowledges and three knowledges of enlightenment, granting the ability to see distant events, observe mind-made bodies, and — most significantly — witness beings' rebirth destinies unfold according to their past deeds, seeing wrongdoers descend to lower realms and the virtuous ascend to higher ones. The Buddha attained this power during the second watch of his enlightenment night; though classed as a merely mundane achievement reachable through deep meditative absorption alone, it forms a crucial link toward the truly liberating third knowledge that follows it.",null,null],["n1066","Dōgen Kigen",296,7,40,29,3482,0,133,-376,["person"],"Dōgen Kigen. (1200–1253.) Founder of Japanese Sōtōshū, trained first at Tendai's Mt. Hiei before studying under Myōan Eisai's disciple and eventually traveling to China, where he received dharma transmission from the Caodong master Tiantong Rujing after reportedly awakening on hearing Rujing rebuke a sleeping monk with the phrase \"sloughing off body and mind.\" Driven from Kyōto by rival Rinzai institutional power, he relocated to rural Echizen and founded Eiheiji, where he composed much of his monumental Shōbōgenzō and taught \"just sitting\" (shikan taza) as the direct enactment, not merely the path toward, one's own buddhahood.",{"start":1200,"end":1253,"basis":"\"(1200–1253)\", given directly"},{"lat":36.05,"lng":136.35,"label":"Eiheiji, Echizen (Fukui), Japan (the monastery he founded and renamed)"}],["n1095","dṛṣṭi",302,1,36,28,1957,0,-185,329,["concept"],"Dṛṣṭi. (\"View\" or \"opinion.\") Used almost exclusively pejoratively in Buddhism, denoting attachment to a fixed opinion — the Suttanipāta's earliest strata already treat views in general as sources of conceit and quarrel, a skepticism some scholars see as prefiguring Madhyamaka's later reductio-style demolition of any philosophical position whatsoever. A standard list of five wrong views includes belief in a perduring self, extreme views of permanence or annihilation, denial of karma and causality, and stubborn attachment either to one's own opinions or to the efficacy of rites and rituals.",null,null],["n1099","duḥkha",303,1,78,69,4038,0,-191,277,["concept"],"Duḥkha. (\"Suffering\" or \"unsatisfactoriness.\") The first of the four noble truths — not just pain, but the built-in unsatisfactoriness of anything impermanent, since even pleasure inevitably passes and pain unpredictably arrives. Enumerated in lists of three (misery from suffering itself, from change, and from mere conditionedness), four (birth, aging, sickness, death), or eight types; some texts count as many as a hundred and ten. The teaching's purpose isn't despair but reorientation: recognizing duḥkha in ordinary life is what first turns a person toward nirvāṇa.",null,null],["n1104","Dunhuang",305,7,51,48,2524,0,-1,-192,["place"],"Dunhuang. A garrison oasis town on the Silk Road's edge, today famous for the nearby Mogao and Qianfo Dong cave complexes, whose excavation legend holds began in 366 CE with a monk's vision of a thousand golden buddhas and continued for nearly a thousand years. Sealed inside a side chamber, Cave 17, was a hoard of manuscripts and silk paintings discovered in the early twentieth century — tens of thousands of texts in over a dozen languages, including the world's earliest dated printed book, an 868 CE copy of the Diamond Sūtra, making the find one of history's richest paper archives.",{"start":366,"end":366,"basis":"\"legend has it that in 366 CE\" the first cave was excavated there"},{"lat":40.1421,"lng":94.6619,"label":"Dunhuang, Gansu, China (named directly as the entry's subject)"}],["n1106","dunwu",306,7,42,27,2049,0,-112,-171,["concept"],"Dunwu. (\"Sudden awakening.\") The Chan claim that simply \"seeing one's [buddha-]nature\" suffices to realize innate buddhahood, weaponized polemically by Heze Shenhui's \"Southern school\" to dismiss its gradualist \"Northern\" rivals as inferior. In two-tiered schemes of \"sudden awakening followed by gradual cultivation,\" this initial breakthrough only confirms that one is already a buddha — full, functioning buddhahood still requires continued practice until knowledge and action fully coincide in a final \"realization-awakening.\" A structurally similar sudden-versus-gradual dispute surfaces even outside East Asia, in Tibet's Bsam yas debate between Kamalaśīla and the Chan monk Heshang Moheyan.",null,null],["n1107","dunwu jianxiu",306,7,24,16,1842,0,-102,-199,["concept"],"Dunwu jianxiu. (\"Sudden awakening followed by gradual cultivation.\") A path schema associated with Guifeng Zongmi and Pojo Chinul, in which an initial sudden \"understanding-awakening\" — knowing oneself to already be a buddha — is only the beginning, not the end, of the path. Genuine buddhahood still requires a long process of gradual cultivation to erode deeply ingrained habitual patterns, until knowledge and action finally coincide in a final \"realization-awakening\" — a process Zongmi and Chinul compare to an infant born with full human faculties who nonetheless still needs years to mature into functioning as an adult.",null,null],["n1111","durgati",307,6,30,21,1581,0,128,36,["concept"],"Durgati. (\"Unfortunate destinies.\") The unfavorable rebirths — hell denizen, animal, hungry ghost, and sometimes demigod — resulting from demeritorious action, each destined to endure vastly different lifespans: a topmost hell's five-hundred-year sentence, calculated by celestial time-scaling, dwarfs an animal's fleeting existence, while a nāga can supposedly persist for an entire eon. The stark asymmetry in suffering and duration across these destinies functions as a vivid moral ledger, mapping precisely how unwholesome deeds translate into unequal portions of misery.",null,null],["n1123","dveṣa",310,1,59,53,1295,0,-226,151,["concept"],"Dveṣa. (\"Aversion,\" \"ill will,\" or \"hatred.\") One of Buddhism's most pervasive defilements, appearing across nearly every list of afflictions — the six fundamental kleśas, the ten fetters, the ten proclivities, the three poisons — and counted among the core mental factors in every major abhidharma system. Arises when contact with a displeasing sensory object occurs without proper introspection, and branches into derivative emotions including anger, enmity, agitation, envy, and harmfulness, all sharing aversion as their common root.",null,null],["n1145","ekayāna",314,5,40,26,3233,0,-125,37,["concept"],"Ekayāna. (\"One vehicle.\") The Lotus Sūtra's claim that the three separate vehicles of śrāvaka, pratyekabuddha, and bodhisattva are merely expedient devices concealing a single underlying path to buddhahood for all beings — a position genuinely contested elsewhere in Mahāyāna literature, since texts like the Saṃdhinirmocanasūtra and thinkers like Asaṅga held instead that some beings following the lesser vehicles become arhats permanently, never advancing to buddhahood. East Asian schools drew further fine distinctions atop this dispute, with Faxiang splitting the \"one vehicle\" into an inclusive expedient sense and a stricter derivative sense, while Huayan and Tiantai kept the buddha vehicle conceptually distinct from the bodhisattva vehicle nested within the three.",null,null],["n1146","Ekottarāgama",315,2,40,33,1728,0,139,294,["work"],"Ekottarāgama. (\"Numerically Arranged Discourses.\") The Sanskrit-tradition counterpart to the Pāli Aṅguttaranikāya, nominally organized by ascending numerical lists though its surviving form reads more topically. Its sectarian origin remains genuinely disputed — proposed candidates include the Mahāsāṃghika, the Prajñaptivāda offshoot, and the Dharmaguptaka, the last suggested partly because the text cites 250 prātimokṣa rules matching the Dharmaguptaka code. Surviving only in a 397 CE Chinese translation, it contains just 471 sūtras against the Pāli collection's 2,198.",{"start":100,"end":350,"basis":"\"probably dates from sometime between the second century and the first part of the fourth century CE\""},null],["n1213","Fanwang jing",328,5,25,15,2687,0,-36,-54,["work"],"Fanwang jing. (\"Brahmā's Net Sūtra.\") A Chinese apocryphal scripture whose second roll — far more influential than its rarely-studied first — sets out ten major and forty-eight minor bodhisattva precepts open to laypeople as well as monastics, becoming a popular East Asian alternative to the traditional 250 monastic vinaya rules. Explicitly correlating its precepts with Confucian filial piety and buddha-nature, it was embraced wholesale by Saichō in Japan, who rejected traditional monastic ordination entirely in favor of these purely Mahāyāna precepts, while Korea treats them as complementary to, rather than a replacement for, standard monastic vows.",{"start":450,"end":450,"basis":"\"most likely an indigenous Chinese scripture... composed during the middle of the fifth century\""},null],["n1220","Faxian",330,2,30,25,1380,0,119,81,["person"],"Faxian. (c. 337–422.) Chinese pilgrim-monk whose travel account, the Faxian zhuan, is an invaluable record of early fifth-century South Asian Buddhism. Setting out from Chang'an in 399 in search of a complete vinaya recension, he crossed the Himalayas, spent years studying Sanskrit and copying scriptures in India, then survived a typhoon-damaged voyage home that stranded him five months in Java before he finally reached China in 413 — after which he spent his remaining years translating the texts he had brought back, sometimes alongside the Indian monk Buddhabhadra.",{"start":337,"end":422,"basis":"\"(c. 337–422)\", given directly"},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (departure point for his pilgrimage to India in 399)"}],["n1221","Faxiang zong",330,5,56,24,4910,0,-164,-32,["school"],"Faxiang zong. (\"Dharma Characteristics School.\") The most important of three Chinese Yogācāra strands, built on Xuanzang's Chinese translation of the Cheng weishi lun and systematized by his disciple Kuiji, the school's first patriarch. Its own preferred self-designation was \"Consciousness-Only School\"; the pejorative \"Faxiang\" name came from rivals. Transmitted to Korea, where the monk Wŏnch'ŭk's rival interpretive lineage sparked intense controversy with Kuiji's own line, and to Japan as Hossōshū, where it survived but never rivaled Tendai or Shingon in influence — known above all for its exhaustive hundred-factor taxonomy of all possible phenomena.",{"start":630,"end":690,"basis":"founding activity of Kuiji, \"traditionally regarded as the first Faxiang patriarch\" (632–682), building on Xuanzang's return from India"},{"lat":34.3416,"lng":108.9398,"label":"China (Chang'an placeholder — base of Xuanzang and Kuiji's translation activity)"}],["n1229","Fazang",333,5,49,40,2317,0,-226,-70,["person"],"Fazang. (643–712.) Tang-dynasty monk of Sogdian immigrant descent, third-generation patriarch of the Huayan zong and its de facto founder, who studied under Zhiyan and assisted in retranslating the Avataṃsakasūtra and Laṅkāvatārasūtra. A favorite lecturer of Empress Wu Zetian on dependent origination, he systematized his teacher's vision of the Avataṃsakasūtra using indigenous Chinese concepts drawn partly from the Dasheng qixin lun, effectively giving Huayan philosophy its lasting doctrinal vocabulary. His close friendship with the Korean monk Ŭisang helped carry Huayan teaching to Korea and, through further transmission, to Japan as Kegon.",{"start":643,"end":712,"basis":"\"(643–712)\", given directly"},{"lat":34.3416,"lng":108.9398,"label":"Chang'an, China (site of his major translation and imperial-court activity)"}],["n1248","four noble truths",337,1,111,84,5741,0,-88,250,["concept"],"Four noble truths. A translation that obscures the original sense — \"noble\" describes those who understand the truths, not the truths themselves. First taught in the Buddha's inaugural sermon at Sarnath: existence is suffering (duḥkha); suffering has a cause, craving (samudaya); suffering has an end, nirvāṇa (nirodha); and there is a path to that end, the eightfold path (mārga). Traditionally elaborated into sixteen aspects, four per truth, each countering a specific inverted view — though some Mahāyāna sūtras caution that clinging to the four truths as ultimately true is itself a failure to grasp the Buddha's deeper point.",{"start":-525,"end":-525,"basis":"the Buddha's first sermon, via chronology convention"},{"lat":25.3805,"lng":83.0221,"label":"Sarnath (site of first sermon — not restated in this entry, cross-referenced from the saṃgha entry's account of the same event)"}],["n1250","foxing",338,7,58,47,1769,0,-88,-148,["concept"],"Foxing. (\"Buddha-nature,\" rendering Sanskrit buddhadhātu.) In the East Asian Yogācāra tradition, split into a universal \"buddha-nature of principle\" — the true, unproduced nature of all factors, discoverable by anyone through wisdom — and a \"functional buddha-nature,\" a latent seed within the storehouse consciousness that only some beings possess and that must be activated to reach buddhahood. The Foxing lun elaborates a further threefold scheme: buddha-nature simply inherent in deluded minds, buddha-nature emerging through practice once the aspiration for enlightenment arises, and buddha-nature fully attained at the completion of the bodhisattva path.",null,null],["n1273","Gaṇḍavyūha",343,5,30,20,1983,0,-86,-73,["work"],"Gaṇḍavyūha. A Mahāyāna sūtra following the youth Sudhana's pilgrimage through fifty-three spiritual mentors — beginning and ending with Mañjuśrī — as a personification of the full bodhisattva path, culminating in Sudhana's vision-merger with Samantabhadra. Later absorbed as the climactic \"Entering the Dharmadhātu\" chapter of the Avataṃsakasūtra, it survives in three progressively more complete Chinese translations spanning three and a half centuries, the earliest badly truncated and the last, by Prajña, dedicated specifically to finally rendering the chapter in full.",{"start":100,"end":100,"basis":"elsewhere in this dictionary dated to \"perhaps the second century of the Common Era\""},null],["n1277","Gandhāra",344,2,33,24,3256,0,45,157,["place"],"Gandhāra. A cosmopolitan northwest Indian crossroads region — spanning modern northern Pakistan and southeast Afghanistan — where Greek, Central Asian, and Indian cultures mingled along Silk Road trade routes, producing some of the earliest known Buddhist sculpture and the first iconographic images of the Buddha in \"Greco-Buddhist\" style. A major Sarvāstivāda stronghold alongside neighboring Kashmir, it hosted the fourth Buddhist council under the Kushan king Kaniṣka I, which compiled the massive Abhidharmamahāvibhāṣā and gave rise to the Vaibhāṣika school named after it.",{"start":-250,"end":300,"basis":"\"for the five centuries bracketing the beginning of the Common Era\" Gandhāra was a major Buddhist center; conquered \"around 185 BCE,\" Kushan rule extended \"between the years 50 and 320 CE\""},{"lat":34.0151,"lng":71.5249,"label":"Gandhāra region (Peshawar, Pakistan placeholder), named directly as the entry's subject"}],["n1279","gandharva",344,6,29,23,1579,0,155,2,["concept"],"Gandharva. (\"Fragrance eater.\") In Buddhist cosmology, celestial musicians who fly through the sky serving Indra/Śakra's heavenly court and, by tradition, marry the celestial nymphs called apsaras. The same word does separate duty as the technical term for the \"transitional being\" occupying the forty-nine-day intermediate state between death and rebirth — named for the same presumed diet of pure scent, since it subsists on nothing else while searching for its next parents and destined form.",null,null],["n1298","gati",348,6,50,37,2495,0,58,47,["concept"],"Gati. (\"Destiny\" or \"bourne.\") The five or six places within saṃsāra where rebirth occurs, ranked from hell denizens through hungry ghosts, animals, humans, demigods, and divinities, spanning all three cosmological realms. The bottom three destinies are called the \"evil bournes,\" dominated by suffering from past unwholesome deeds; divine realms are dominated by pleasure from virtuous ones — but the human destiny alone offers the balanced mix of suffering and happiness that makes it, paradoxically, the ideal condition for recognizing impermanence and pursuing liberation.",null,null],["n1299","Gautama",349,2,52,51,763,0,201,158,["person"],"Gautama. The clan name of the historical Buddha — Śākya was his tribe, Gautama his family or clan, and Siddhārtha his given name. \"Gotama\" (\"Excellent Cow\") was a common brāhmaṇa lineage name in ancient India, also borne by a poet of the Ṛg Veda, unrelated to the Buddha's own family beyond the shared name. Pāli literature typically calls him Gotama Buddha; Mahāyāna sources prefer Śākyamuni.",{"start":-560,"end":-480,"basis":"identifies the family name of Śākyamuni Buddha; chronology convention"},{"lat":27.6667,"lng":83.2833,"label":"Lumbini area, southern Nepal (homeland of the Śākya tribe, named directly)"}],["n1340","gong’an",357,7,82,71,4687,0,7,-407,["concept","work"],"Gong'an. (\"Public case\" — kōan in Japanese.) Originally a legal term for a magistrate's precedent, adapted by the Chan school for the enigmatic sayings and exchanges of past masters used as objects of contemplation. Practice of commenting on these \"old cases\" began around the late Tang dynasty, developing into elaborate collections — pointer, case, prose and verse commentary — like the Biyan Lu and Wumen Guan. Dahui Zonggao systematized a further method of fixating on just a case's \"keyword\" (huatou), most famously the single syllable \"wu\" — no.",{"start":800,"end":900,"basis":"\"probably dating from the late-Tang dynasty\""},{"lat":34.27,"lng":108.95,"label":"China (general placeholder — Xi'an/Chang'an; no specific site named)"}],["n1344","gotra",358,5,41,23,1764,0,-173,74,["concept"],"Gotra. (\"Family\" or \"lineage.\") In Mahāyāna, especially Yogācāra, a spiritual disposition determining which of several paths a person is destined to follow — a fivefold scheme running from those bound for buddhahood, through those destined for pratyekabuddha- or arhatship, to those of indeterminate lineage who could still shift paths, down to those without any lineage at all, permanently barred from liberation as \"incorrigibles.\" A further distinction separates gotra that is simply innate from gotra actively cultivated through habit — the raw potential for awakening versus the practical work of realizing it.",null,null],["n1349","gozan",359,7,25,18,2177,0,152,-402,["concept"],"Gozan. (\"Five mountains.\") A medieval Japanese ranking system for state-sponsored Zen monasteries, adapted from Chinese precedent and first implemented under the Kamakura shogunate before being reordered repeatedly as political power shifted between Kamakura and Kyōto. By the Muromachi period the system had expanded to roughly three hundred officially ranked monasteries across three tiers, and came to denote not just institutions but entire prestigious lineages renowned for their classical Chinese literary and artistic accomplishment — with a parallel, far less documented five-mountain convent system existing for Japanese nuns.",null,null],["n1352","Gṛdhrakūṭaparvata",360,2,36,18,2152,0,76,25,["place"],"Gṛdhrakūṭaparvata. (\"Vulture Peak.\") A hill outside Rājagṛha where the Buddha reportedly delivered numerous mainstream sūtras as well as major Mahāyāna scriptures like the Lotus Sūtra and the perfection-of-wisdom texts — a site so sanctified by its sermons that some traditions hold it survives even the fire that consumes the universe at the end of an eon. Also the site of two darker episodes: Devadatta's attempt to kill the Buddha by hurling a boulder down its slope, and, by tradition, the cave where the first Buddhist council was convened after the Buddha's death.",{"start":-524,"end":-480,"basis":"site of the Buddha's ministry (many Mahāyāna and mainstream sūtras delivered there); chronology convention"},{"lat":25.0268,"lng":85.4212,"label":"Vulture Peak, near Rājagṛha (named directly as the entry's subject)"}],["n1358","Gsang phu ne’u thog",361,3,28,15,1915,0,-341,-89,["place"],"Gsang phu ne'u thog. A Bka' gdams monastery that became, for centuries, the premier center of Tibetan epistemological (pramāṇa) studies, thanks to Rngog Blo ldan shes rab's translations and commentaries on Dharmakīrti, later refined by Sa skya Paṇḍita's own influential 1219 treatise. Also a major hub for Prajñāpāramitā study based on the Abhisamayālaṃkāra and home to Phywa pa Chos kyi seng ge, originator of the distinctive Tibetan textbook genre still used in Dge lugs monasteries today — though like many former Bka' gdams institutions, it faded once the Dge lugs sect rose to dominance.",{"start":1073,"end":1073,"basis":"\"established south of Lha sa in 1073\""},{"lat":29.55,"lng":91.05,"label":"South of Lhasa, Tibet (named directly as the entry's subject)"}],["n1362","gter ma",362,3,64,46,4569,0,-280,-281,["concept","work"],"Gter ma. (\"Hidden treasures.\") Tibetan Buddhist and Bon manuscripts, relics, and ritual objects said to have been concealed — most famously by Padmasambhava, before the ninth-century persecution under Glang dar ma — for discovery by a predestined revealer in a later age. Three types: earth treasures physically unearthed from caves or pillars, mind treasures found within the revealer's own mindstream as seeds from a past life, and pure visions perceived through the mind's innate purity. Authenticity is genuinely contested — some are dismissed as forgeries — but major gter ma cycles, including the Klong chen snying thig, remain foundational to Rnying ma practice, and even the fifth Dalai Lama's political legitimacy was grounded in gter ma he himself revealed.",{"start":1000,"end":1000,"basis":"\"the first Tibetan gter ma appear sometime after the start of the second dispensation (phyi dar), c. 1000\""},{"lat":29.6467,"lng":91.117,"label":"Tibet (general placeholder — the tradition is Tibet-wide, centered on the Rnying ma sect)"}],["n1363","gter ston",362,3,36,35,320,0,-309,-392,["concept"],"Gter ston. (\"Treasure revealer.\") The Tibetan title for someone who discovers gter ma — hidden Buddhist or Bon treasures, whether physical objects unearthed from the landscape or teachings surfacing directly within the revealer's own mind. The role carries real religious authority, since a successful revelation is taken as evidence of a karmic connection to the treasure's original concealer, most often Padmasambhava himself.",null,null],["n1375","Guan Wuliangshou jing",365,0,33,19,3274,0,185,-105,["work"],"Guan Wuliangshou jing. (\"Sūtra on the Visualization of [the Buddha of] Immeasurable Life.\") One of the three core pure land scriptures, framing sixteen guided visualizations — of the setting sun, Amitābha's pure land, and its resident bodhisattvas — within the story of Queen Vaidehī, imprisoned by her own usurping son and granted release through devotion to Amitābha. No Sanskrit or Tibetan version has ever surfaced despite its claimed Indian origin, and its Chinese-specific content suggests the meditation practice it describes likely originated in Central Asia, possibly the Turfan region, before taking its final form with substantial Chinese admixture.",{"start":383,"end":442,"basis":"attributed to translator Kālayaśas, \"fl. c. 383–442\""},{"lat":42.9513,"lng":89.1897,"label":"Turfan region, Central Asia (proposed origin of the underlying visualization practice)"}],["n1384","Guifeng Zongmi",368,7,43,32,2287,0,-94,-215,["person"],"Guifeng Zongmi. (780–841.) Chan master, historian, and putative fifth patriarch of the Huayan tradition, celebrated for arguing that Buddhism's scriptural teachings and Chan meditative practice are fundamentally in harmony rather than in tension. Trained first in the Heze line of Chan and later under the Huayan master Chengguan, he retired to a hermitage on Gui peak — the source of his toponym — where he wrote his influential commentary on the Yuanjue jing and a massive, now largely lost history of the Chan school. His synthesis of Sŏn and doctrinal study went on to shape Pojo Chinul and, through him, the entire subsequent Korean Buddhist tradition.",{"start":780,"end":841,"basis":"\"(780–841)\", given directly"},{"lat":30.95,"lng":105.77,"label":"Xichong, Sichuan, China (native place, named directly)"}],["n1393","Guṇaprabha",370,5,26,7,3090,0,-159,37,["person"],"Guṇaprabha. (c. seventh century.) A Mathurā-born scholar who began as a Yogācāra writer and adviser to King Harṣa before shifting to śrāvakayāna vinaya specialization, becoming Tibet's most revered authority on the Mūlasarvāstivāda monastic code. His Vinayasūtra condensed the massive Mūlasarvāstivāda vinaya to roughly a quarter of its length, functioning as a practical primer on actual monastic conduct rather than scripture, and became so foundational to Tibetan Buddhism that it forms one of the five core texts of the Dge lugs curriculum — despite a legend that his one trip to consult Maitreya directly in Tuṣita heaven taught him nothing new at all.",{"start":600,"end":700,"basis":"\"(d.u.; c. seventh century)\""},{"lat":27.4924,"lng":77.6737,"label":"Mathurā, India (birthplace and later monastic residence, named directly)"}],["n1397","guru",371,3,32,20,1509,0,-183,-163,["concept"],"Guru. (\"Venerable\" — religious teacher.) In mainstream monasticism, embodied by the preceptor who ordains and instructs a novice in a relationship likened to father and son; in Mahāyāna literature, elevated into the figure of the essential spiritual guide, as in Sudhana's pilgrimage through fifty-three mentors in the Gaṇḍavyūha. Tantric Buddhism raises the guru's status furthest of all — the very first tantric vow is never to disparage one's guru, considered equal to all buddhas, since it is only through a guru's personal transmission that a student can actually receive the teaching at all.",null,null],["n1414","Haimavata",375,2,24,0,3164,0,64,237,["school"],"Haimavata. (\"Inhabitants of the Himālayas.\") One of the eighteen mainstream schools, named for its Himalayan homeland and, according to a Sarvāstivāda-authored account often dismissed as polemical, the first school to split from the Sthaviranikāya lineage. That same account links it to Mahādeva's controversial five theses questioning arhats' spiritual perfection — the very propositions blamed for triggering the second council's schism between the Sthaviras and the emerging Mahāsāṃghika — while crediting the school with several distinctive positions of its own, including that bodhisattvas remain ordinary beings until buddhahood and that non-Buddhist ascetics simply cannot develop genuine supernatural powers.",{"start":-280,"end":-280,"basis":"per the Dīpavaṃsa, arose \"during the second century after the Buddha's death\" (chronology convention)"},{"lat":28.3949,"lng":84.124,"label":"Himalayan region (general placeholder — named directly, \"Inhabitants of the Himālayas\")"}],["n1423","Haribhadra",378,5,29,17,2184,0,-285,-15,["person"],"Haribhadra. (c. 800.) A Pāla-dynasty Indian exegete, possibly a student of Śāntarakṣita and contemporary of Kamalaśīla, best known for his commentaries on the Perfection of Wisdom in Eight Thousand Lines built on the interpretive scaffolding of the Abhisamayālaṃkāra. His summary commentary became the root text for an entire line of Tibetan exegesis originating at Gsang phu ne'u thog monastery, remaining the most widely studied prajñāpāramitā commentary in Tibetan Buddhism to this day, and his distinctive \"false-aspectarian\" epistemological position was defined in explicit contrast to Kamalaśīla's rival \"true-aspectarian\" view.",{"start":800,"end":800,"basis":"\"(c. 800)\", given directly"},null],["n1436","hetu",381,1,37,31,2529,0,-261,204,["concept"],"Hetu. (\"Cause.\") The primary or main cause of production, working alongside supporting conditions (pratyaya) to jointly generate an effect — a seed as hetu, soil and water as pratyaya, together yielding a tree. The Jñānaprasthāna specifies six distinct types of cause, from a broad generic causation encompassing everything a phenomenon isn't, to a \"retributive\" cause linking present unwholesome or wholesome deeds to their eventual karmic payoff — and in logic, hetu also names the \"reason\" step of a formal syllogism.",null,null],["n1443","Hieizan",382,0,33,30,2320,0,196,-231,["place"],"Hieizan. The mountain headquarters of Japanese Tendai, settled by Saichō in 785 and built up around the monastery Enryakuji, which grew from religious into major political, economic, and military power across medieval Japan — a power violently curtailed when Oda Nobunaga burned much of the mountain in 1571. Beyond its Buddhist institutions, Hieizan also hosted its own resident kami and became a center for both Shugendō practice and the grueling thousand-day mountain-circumambulation austerity, kaihōgyō.",{"start":785,"end":788,"basis":"Saichō \"left Nara for Hieizan\" in 785 and built its founding hall in 788"},{"lat":35.0708,"lng":135.8408,"label":"Mt. Hiei, Japan (named directly as the entry's subject)"}],["n1449","hīnayāna",384,5,61,59,1602,0,-124,17,["concept"],"Hīnayāna. (\"Lesser vehicle.\") A pejorative coined by Mahāyāna Buddhists for the doctrines of rival mainstream śrāvakayāna schools — never used self-referentially, and never a synonym for the contemporary Theravāda tradition, despite common confusion. Variously used to mean those who reject the Mahāyāna sūtras as authentic word of the Buddha, the combined paths of śrāvakas and pratyekabuddhas who seek liberation for themselves alone, or the roughly eighteen non-Mahāyāna schools of Indian Buddhism collectively.",null,null],["n1458","Hōnen",385,0,24,23,295,0,220,-187,["person"],"Hōnen. (1133–1212.) Founder of Japan's Jōdoshū, orphaned by his father's violent death and raised by an uncle before training at Mt. Hiei. His teaching that reciting Amitābha's name alone suffices for rebirth in the pure land — the \"easy path\" set against traditional Tendai practice — drew a large popular following, including his disciple Shinran, and provoked enough establishment backlash that Hōnen was exiled to Tosa in 1207 before being pardoned; his still-unpublished masterwork, the Senchakushū, was significant enough that Shinran was personally permitted to copy it.",{"start":1133,"end":1212,"basis":"\"(1133–1212)\", given directly"},{"lat":35.0333,"lng":134,"label":"Mimasaka province, Japan (native place, named directly)"}],["n1459","hongaku",386,0,32,14,4036,0,69,-128,["concept"],"Hongaku. (\"Original enlightenment.\") The doctrine, rooted in the apocryphal Dasheng qixin lun, that enlightenment is already inherently present in every sentient mind — distinguished from \"actualized enlightenment,\" the practical work of putting that latent potential into action. Medieval Japanese Tendai reinterpreted this from a soteriological claim into a more radical ontological one: that everyday reality, just as it is, already constitutes enlightenment, a reading that critics both premodern and modern (notably the \"Critical Buddhism\" movement) accused of smuggling in a disguised permanent self and of providing convenient religious cover for social inequality.",{"start":1050,"end":1050,"basis":"\"distinctively Japanese treatments of original enlightenment thought begin in the mid-eleventh century\""},{"lat":35.0708,"lng":135.8408,"label":"Hieizan, Japan (center of the medieval Tendai oral transmissions that developed the doctrine)"}],["n1477","huatou",391,7,28,17,3029,0,-19,-363,["concept"],"Huatou. (\"Topic of inquiry\" or \"critical phrase.\") A gong'an fragment — most famously Zhaozhou's \"no\" in answer to whether a dog has buddha-nature — used by Dahui Zonggao as an object of sustained meditative doubt rather than intellectual puzzle-solving. Functioning as a kind of homeopathic dose of conceptual poison meant to cure conceptual thinking itself, the huatou pushes the mind to the very limit of speech and thought, leaving it clear and receptive; the technique reached Korea through Pojo Chinul as hwadu and Japan's Rinzai tradition through Hakuin Ekaku.",null,null],["n1492","Huayan wujiao",394,5,43,14,4065,0,-181,-41,["concept"],"Huayan wujiao. (\"Huayan's five classifications of the teachings.\") A doctrinal ranking system, in two competing versions by Fazang and later Guifeng Zongmi, sorting the whole of Buddhist teaching into an ascending hierarchy — Hīnayāna teachings at bottom, then Mahāyāna's \"elementary\" emptiness- and phenomena-focused strands, then more \"advanced\" teachings on buddha-nature, then Chan's \"sudden\" methods, capped by Huayan's own \"perfect\" or \"consummate\" teaching centered on the Avataṃsakasūtra. A textbook case of a school using comparative doctrine not just to organize Buddhist literature but to install itself, unsurprisingly, at the very top of the resulting pyramid.",null,null],["n1496","Huayan zong",395,5,67,48,3892,0,-143,-131,["school"],"Huayan zong. (\"Flower Garland School.\") Chinese exegetical tradition named for its central scripture, the Avataṃsakasūtra, with a lineage of patriarchs — Dushun, Zhiyan, Fazang, Chengguan, Guifeng Zongmi — retrospectively constructed by later followers. Systematizes the sūtra's vision of infinite, mutually interpenetrating world-systems into the doctrine of \"dependent origination of the dharmadhātu,\" where every phenomenon simultaneously creates and is created by every other. Transmitted to Japan in 740 as Kegon and influential in Korea through Ŭisang and Wŏnhyo; weakened in China after the Huichang persecution but continues to shape modern Buddhist environmentalism and engaged Buddhism.",null,null],["n1500","huguo Fojiao",396,0,29,14,4507,0,96,-83,["concept"],"Huguo Fojiao. (\"State-protection Buddhism.\") The doctrinally grounded belief that Buddhist ritual and royal patronage of the dharma could shield a state from war, rebellion, and natural disaster — justified by specific chapters in the Lotus Sūtra, the Renwang jing, and the Golden Light Sūtra promising divine protection for faithful rulers. The elaborate \"Renwang Assembly of One-Hundred Seats\" ritual, performed across China, Japan, and Korea from the late sixth century onward, exemplifies the practice, which in Korea is cited as a defining national characteristic — though revisionist historians argue this framing may reflect modern political concerns, including Japanese Meiji-era ideology, as much as genuine premodern history.",null,null],["n1505","Huineng",398,7,51,47,3135,0,-12,-276,["person"],"Huineng. (638–713.) The legendary sixth and final patriarch of the Chan school, whose historical life is barely documented but whose hagiography in the Platform Sūtra is foundational to Chan literature. An illiterate woodcutter converted on hearing the Diamond Sūtra recited, he reportedly won a poetry contest against the learned monk Shenxiu with a verse on emptiness so sharp the fifth patriarch Hongren secretly transmitted Bodhidharma's robe and bowl to him overnight, then sent him into hiding. Settled at Baolinsi on Caoxishan, he is claimed as founder of Chan's \"Southern school\" of sudden awakening, and virtually every later Chan lineage traces its pedigree back to him.",{"start":638,"end":713,"basis":"\"(638–713)\", given directly"},{"lat":22.7167,"lng":112.1833,"label":"Xinzhou, Guangdong, China (birthplace, named directly)"}],["n1530","Indra",405,6,32,27,1004,0,215,-20,["deity"],"Indra. The Vedic king of the sky gods, absorbed into Buddhism as guardian of the dharma and ruler of the heaven of the thirty-three atop Mount Sumeru — but always depicted as subservient to the Buddha, holding an umbrella over him or carrying his alms bowl. Functionally interchangeable in Buddhist texts with Śakra, whose full title, \"Śakra, king of the gods,\" is itself simply an epithet built around Indra's name.",null,null],["n1533","indriya",406,1,70,56,3373,0,-145,240,["concept"],"Indriya. (\"Faculty\" or \"dominant factor.\") Most often the five or six sense bases — sight, hearing, smell, taste, touch, and mind — but also, soteriologically, the five spiritual \"dominants\" of faith, effort, mindfulness, concentration, and wisdom that drive progress on the path. Vaibhāṣika abhidharma expands both senses into a comprehensive list of twenty-two faculties, adding faculties of sex, life-force, feeling, and three grades of purifying insight — an entire taxonomy of what actually governs a being's experience, moment to moment.",null,null],["n1547","Jaina",409,2,47,43,1970,0,66,159,["school"],"Jaina. (\"Followers of the Victor.\") One of the major non-Buddhist śramaṇa movements of ancient India, founded in the tradition of Mahāvīra, a direct contemporary of the Buddha, and the śramaṇa group closest to Buddhism in belief and practice — close enough that the Buddha regularly used Jaina teachings as a foil for his own. Jainas share a doctrine of karman with Buddhism but treat it as an actual physical substance binding the soul, requiring rigorous bodily purification through a five-vow moral code that closely parallels Buddhism's own five precepts.",{"start":-488,"end":-488,"basis":"founder Mahāvīra's death date, \"(d. c. 488 BCE)\""},{"lat":25.61,"lng":85.14,"label":"Magadha (general placeholder — the region of Mahāvīra's activity, contemporary with the Buddha)"}],["n1554","Jambudvīpa",410,6,28,24,1653,0,164,16,["concept"],"Jambudvīpa. (\"Rose-Apple Continent.\") The southernmost of the four continents surrounding Mount Sumeru, corresponding to India and uniquely privileged in Buddhist cosmology — it is the only continent ruled by a wheel-turning monarch and the sole place where buddhas take their final rebirth and attain enlightenment, always at the vajrāsana at its very center. Triangular in shape with the Himalayas among its mountain ranges and the Ganges among its rivers, its human lifespans fluctuate wildly across cosmic time, from as low as ten years at an eon's end to incalculable lengths at its beginning.",null,null],["n1569","jātaka",414,2,48,42,3017,0,160,167,["concept","work"],"Jātaka. (\"Birth\" or \"nativity.\") Narratives of a buddha's previous lives, one of the classical genres of Buddhist scripture and, at 547 stories in the Pāli collection alone, among the most popular forms of Buddhist literature — especially with the laity, thanks to their entertaining plots and moral payoff. A typical tale has the Buddha recount a past-life story demonstrating some virtue, then identify the story's characters as past incarnations of people in his present audience, his rival Devadatta included. Many plots trace back to shared Indian folklore also found in Hindu and Jaina literature, simply repurposed with a Buddhist frame.",null,null],["n1576","Jetavana",416,2,52,47,2928,0,226,287,["place"],"Jetavana. (\"Prince Jeta's Grove.\") A park outside Śrāvastī donated to the Buddha by the banker Anāthapiṇḍada, who purchased it from the reluctant Prince Jeta by literally covering its grounds in gold coins — Jeta, impressed, donated the entrance himself. The Buddha's favorite residence, where he is said to have spent nineteen rains retreats in a chamber called the \"perfumed chamber,\" alternating with another monastery built nearby by the laywoman Viśākhā. A later, unrelated monastery at Anurādhapura in Sri Lanka also bears the name Jetavana, built after a schism with the Mahāvihāra sect.",{"start":-524,"end":-480,"basis":"period of use during the Buddha's ministry; he \"passed nineteen rains retreats there\"; chronology convention"},{"lat":27.5167,"lng":82.05,"label":"near Śrāvastī (named directly)"}],["n1577","jhāna",416,1,70,50,3725,0,-9,281,["concept"],"Jhāna. The Pāli counterpart of Sanskrit dhyāna — meditative absorption achieved by withdrawing the mind from sensory input into single-pointed concentration on one object. Eight stages total: four increasingly refined absorptions of the subtle-materiality realm, each shedding a mental factor as it deepens, followed by four immaterial absorptions named for ever-more-attenuated objects, from infinite space to neither-perception-nor-nonperception. Builds the concentration that makes insight possible, without by itself constituting insight — and can lead, if mistaken for the goal, merely to rebirth as a long-lived divinity in the corresponding heaven.",null,null],["n1587","jiaoxiang panshi",418,5,39,25,2096,0,-188,-89,["concept"],"Jiaoxiang panshi. (\"Tenet classification.\") An East Asian exegetical practice, flourishing in the fifth through seventh centuries, ranking Buddhist scriptures by relative profundity to explain why texts all claiming the Buddha's authorship offer such different teachings. Tiantai organized its ranking chronologically, by stage of the Buddha's teaching career; Huayan sorted scriptures into five tiers of doctrinal depth, from Hīnayāna at the bottom to its own Avataṃsakasūtra at the summit. Almost without exception, whichever school built the classification placed its own central scripture at the top — turning a hermeneutical tool into an unmistakably polemical one.",null,null],["n1611","Jingde chuandeng lu",422,7,28,22,1363,0,59,-333,["work"],"Jingde chuandeng lu. (\"Record of the Transmission of the Lamplight, Compiled during the Jingde Era.\") The most influential of the Song-dynasty Chan \"lamplight histories,\" tracing patriarchal succession from the seven buddhas of antiquity down through 1,701 named Chinese and Indian Chan figures. Its final rolls preserve discourse records, poetry, and other Chan miscellany, making the thirty-roll collection an indispensable, if genealogically constructed, source for understanding how the Chan tradition told its own origin story.",{"start":1004,"end":1004,"basis":"\"compiled by Daoyuan... in 1004\""},null],["n1628","Jingying Huiyuan",425,5,32,9,3230,0,-54,-17,["person"],"Jingying Huiyuan. (523–592.) A prolific Sui-dynasty commentator and putative Di lun exegete, native of Dunhuang, who defended Buddhism in formal debate against Emperor Wu of Northern Zhou during the emperor's persecution of the religion, then helped rebuild the tradition once the Sui dynasty restored imperial favor. His Dasheng yi zhang, a comprehensive encyclopedia of Mahāyāna doctrine, remained a standard reference across East Asia, and his early commentary on the Guan Wuliangshou jing significantly shaped the development of pure land thought in Korea and Japan. His concept of tathāgatagarbha as the shared
